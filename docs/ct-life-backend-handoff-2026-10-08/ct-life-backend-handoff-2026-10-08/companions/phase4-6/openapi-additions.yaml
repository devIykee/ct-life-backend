  /smart-money/traders:
    get:
      tags: [copy-trading]
      operationId: getSmartMoneyTraders
      summary: Opted-in traders players can copy, with their record.
      x-phase: 2
      parameters:
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [pnl_7d, win_rate, copiers], default: pnl_7d }
