  # ---------------------------------------------------------------------------
  # Phase 4 · Cosmetic NFTs (#34) and the NFT gallery
  # ---------------------------------------------------------------------------
  /nft/catalog:
    get:
      tags: [nft]
      operationId: getNftCatalog
      summary: Cosmetic NFTs for sale (real money only).
      description: |
        Cosmetic NFTs are Metaplex Core assets in the CT Life collection.
        They can only be bought with USDC, SOL, SKR or ORE, are never prizes,
        and can never be paid for with Cash. Purchase uses the rc1 flow:
        `POST /payments/intents {kind: 'cosmetic', sku, currency}`. After the
        Helius webhook confirms the payment, the server mints the asset to the
        player's wallet with its own payer key (Metaplex Core `create` accepts
        an `owner` different from the payer; no second player signature).
        `prices` are indicative; the intent locks the quote. `oreOnly` items
        accept only `ORE`. `cluster` says where the asset lives.
      x-phase: 4
      responses:
        '200':
          description: Catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NftCatalog' }
              example:
                quotedAt: '2026-10-08T12:00:00.000Z'
                listings:
                  - sku: 'nft_acc_hard_hat_s1'
                    itemId: 'acc_hard_hat'
                    name: 'Refinery Hard Hat'
                    slot: 'acc'
                    imageUrl: 'https://cdn.ctlife.dev/nft/acc_hard_hat_s1.png'
                    editionSize: 1000
                    mintedCount: 212
                    available: true
                    oreOnly: true
                    cluster: 'mainnet'
                    collectionAddress: 'CtLifeCoLLectionS1xxxxxxxxxxxxxxxxxxxxxxxx'
                    prices:
                      - { currency: 'ORE', amount: '3700000000', priceUsd: '5.00' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServerError' }

  /nft/orders/{intentId}:
    get:
      tags: [nft]
      operationId: getNftOrder
      summary: Status of an NFT purchase, from payment to mint.
      description: |
        `intentId` is the `PaymentIntent.intentId` of a `cosmetic` intent for
        an NFT sku. The realtime `nft_order_update` message pushes the same
        transitions. A failed mint after a confirmed payment moves to
        `refunded` once the refund transfer confirms (README, B9).
      x-phase: 4
      parameters:
        - name: intentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NftOrder' }
              example:
                intentId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e06'
                sku: 'nft_acc_hard_hat_s1'
                status: 'minted'
                wallet: 'Dgw3c4GbQnZe1FeaCa29vXtoyv6fxmxAVyynQw8mN2gZ'
                cluster: 'mainnet'
                assetAddress: 'CtAssetHardHat1xxxxxxxxxxxxxxxxxxxxxxxxxxx'
                mintSignature: 'CtMintSignaturexxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'
                failureReasonId: null
                updatedAt: '2026-10-08T12:01:10.000Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServerError' }

  /nft/gallery:
    get:
      tags: [nft]
      operationId: getNftGallery
      summary: NFTs held by a player's wallet, with images and a moderation flag.
      description: |
        Without `userId` it returns my own wallet. The server indexes the
        wallet (Helius DAS `getAssetsByOwner`) and serves images through its
        own CDN path, never the raw off-chain URI. `source: ct_life` assets
        (our collection) are always `approved`. `source: external` assets
        are `pending` until moderated: the owner sees them with
        `imageUrl` set, everyone else sees only `approved` and `displayed`
        assets, and `hidden` assets have `imageUrl: null` for everyone.
        External assets sit behind the `nft_gallery_external` kill switch in
        `GET /config` `degraded` (README, B10).
      x-phase: 4
      parameters:
        - name: userId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Gallery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gallery' }
              example:
                userId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e00'
                wallet: 'Dgw3c4GbQnZe1FeaCa29vXtoyv6fxmxAVyynQw8mN2gZ'
                indexedAt: '2026-10-08T11:55:00.000Z'
                nextCursor: null
                assets:
                  - assetAddress: 'CtAssetHardHat1xxxxxxxxxxxxxxxxxxxxxxxxxxx'
                    source: 'ct_life'
                    interface: 'MplCoreAsset'
                    collectionAddress: 'CtLifeCoLLectionS1xxxxxxxxxxxxxxxxxxxxxxxx'
                    itemId: 'acc_hard_hat'
                    name: 'Refinery Hard Hat'
                    imageUrl: 'https://cdn.ctlife.dev/nft/acc_hard_hat_s1.png'
                    thumbnailUrl: 'https://cdn.ctlife.dev/nft/thumb/acc_hard_hat_s1.png'
                    moderation: { status: 'approved', reasonId: null }
                    displayed: true
                    equippable: true
                  - assetAddress: 'ExternaLNftAssetxxxxxxxxxxxxxxxxxxxxxxxxxxx'
                    source: 'external'
                    interface: 'V1_NFT'
                    collectionAddress: null
                    itemId: null
                    name: 'Unknown Collection #42'
                    imageUrl: 'https://cdn.ctlife.dev/gallery/proxy/ExternaLNftAssetxxxxxxxxxxxxxxxxxxxxxxxxxxx.webp'
                    thumbnailUrl: null
                    moderation: { status: 'pending', reasonId: null }
                    displayed: false
                    equippable: false
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServerError' }

  /me/gallery:
    put:
      tags: [nft]
      operationId: putMeGallery
      summary: Choose which of my NFTs hang in my home gallery.
      description: |
        Up to 12 assets my wallet holds. An external asset can be chosen
        while `pending`; visitors see it only once `approved`. A `hidden`
        asset returns `FORBIDDEN`.
      x-phase: 4
      parameters:
