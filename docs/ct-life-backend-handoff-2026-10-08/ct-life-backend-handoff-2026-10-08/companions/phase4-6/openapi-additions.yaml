                status: 'paused'
                budgetCents: 500000
                spentCents: 120000
                perTradeCapCents: 50000
                copyRatioBps: 1000
                copySells: true
                createdAt: '2026-10-08T12:00:00.000Z'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
