openapi: 3.1.0
info:
  title: CT Life REST API — Phase 4-6 additions (FE proposal)
  version: 1.1.0-proposal.1
  description: |
    FE proposal for devIykee. Additive operations and schemas for Phases 4-6
    (plus Smart Money copy trading from Phase 2) that `contract/openapi.yaml`
    1.0.0-rc1 does not define. Nothing here renames, removes or retypes an rc1
    operation, field or schema.

    This file is a fragment: its `$ref`s point at rc1 components
    (`Error`, `PaymentIntent`, `IdempotencyKey`, `Cursor`, `Unauthorized`,
    `NotFound`, `ValidationFailed`, `RateLimited`, `ServerError`, `Forbidden`)
    and resolve once it is merged into rc1 (see `README.md`, "Validation").

    Conventions follow rc1 and `docs/spec/contract.md` section 1, plus four
    items the Unity client asked for in its rc1 feedback: every response body
    is a named schema, every `*Cents` field is `format: int64`, no
    `const: true` booleans, and nullable fields use the OpenAPI 3.1 form
    `type: [x, 'null']` (rc1's `nullable: true` is a 3.1 `struct` error).

    Operations marked "Implemented on main @ 9f3e5ef" already exist in
    devIykee's server outside the contract; their shapes follow that code,
    with any proposed change called out in the description.
  contact:
    name: CT Life frontend (proposal)
  license:
    name: MIT
    url: https://github.com/devIykee/ct-life-backend/blob/main/LICENSE

tags:
  - name: businesses
    description: Player businesses, daily take and bad days. Phase 4.
  - name: homes
    description: My home, rent payments, visit policy, furniture and layout. Phase 4.
  - name: nft
    description: Cosmetic NFTs (Metaplex Core, real money only) and the NFT gallery. Phase 4.
  - name: seasons
    description: Seasons and the season pass. Phase 4+.
  - name: projects
    description: Player projects, hiring, funding, launch, HQ rooms, VC Row. Phase 5.
  - name: competition
    description: Tribes, districts, leagues, CT Beef, Airdrop Farm, Sybil Barn, venue gates, Cabal invites. Phase 6.
  - name: npcs
    description: LLM chat with the AI Agent and the Sleuth. Phase 6.
  - name: identity
    description: Verified X link (display only). Phase 6.
  - name: copy-trading
    description: Smart Money traders and copy subscriptions. Phase 2.

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------------------
  # Phase 4 · Work: career progression and server-issued gig runs
  # ---------------------------------------------------------------------------
  /careers/{careerId}:
    get:
      tags: [work]
      operationId: getCareer
      summary: One career with every level and my progress.
      description: |
        Feeds the jobs screen for all 14 careers: per-level pay, shift length,
        mini-games and skill gates, plus my level, XP, XP to the next level
        and the unmet gates. `GET /careers` stays the summary list.
        Values come from `config/careers.json`; the client never computes
        promotion. Note: `config/careers.json` writes `skillGates` as
        `{skill, level}` while `CareersService.apply` reads it as
        `Record<skill, level>`; this schema uses a list of `{skill, level}`.
      x-phase: 4
      parameters:
        - name: careerId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Career detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CareerDetail' }
              example:
                id: 'discord_mod'
                name: 'Discord Mod'
                phase: 1
                active: true
                skillGates: []
                levels:
                  - {
                      level: 1,
                      title: 'Trial Mod',
                      payCents: 4000,
                      shiftSec: 45,
                      xpToReach: 0,
                      miniGameIds: ['discord_mod_ban'],
                    }
                  - {
                      level: 2,
                      title: 'Mod',
                      payCents: 5500,
                      shiftSec: 50,
                      xpToReach: 100,
                      miniGameIds: ['discord_mod_ban', 'discord_mod_raid_router'],
                    }
                progress:
                  level: 1
                  xp: 60
                  xpToNextLevel: 40
                  shiftsCompleted: 3
                  isActiveJob: true
                  eligible: true
                  blockedBy: []
                  lastShiftAt: '2026-10-07T18:00:00.000Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServerError' }

  /gigs/{gigId}/start:
    post:
      tags: [work]
      operationId: postGigsGigIdStart
      summary: Start a server-issued gig run.
      description: |
        Proposed replacement for the self-reported body of
        `POST /gigs/{gigId}/run`. Main @ 9f3e5ef pays gigs from client-sent
        numbers (`distanceKm`, `correctRows`, `clicks`, `hoursOnline`); any
        client can send the maximum. A run mirrors shifts: the server picks
        the mini-game, fixes `endsAt`, and pays only from a capped score.
        Cooldowns from `Gig.cooldownSec` still apply.
      x-phase: 4
      parameters:
        - name: gigId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Run started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GigRun' }
              example:
                runId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e01'
                gigId: 'food_delivery'
                miniGameId: 'gig_food_delivery_route'
                maxScore: 100
                startedAt: '2026-10-08T12:00:00.000Z'
                endsAt: '2026-10-08T12:00:45.000Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A gig run is already in progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'CONFLICT',
                      message: 'Resource conflict.',
                      details: { 'reason': 'run_in_progress', 'runId': '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e01' },
                    },
                }
        '429':
          description: Gig cooldown not elapsed
          headers:
            Retry-After:
              schema: { type: integer, description: 'Seconds until retry.' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'RATE_LIMITED',
                      message: 'Rate limit exceeded; try again later.',
                      details: { 'retryAfterMs': 30000, 'reason': 'gig_cooldown' },
                    },
                }
        '503': { $ref: '#/components/responses/ServerError' }

  /gig-runs/{runId}/complete:
    post:
      tags: [work]
      operationId: postGigRunsRunIdComplete
      summary: Complete a gig run with its mini-game score.
      description: |
        The score is capped at `maxScore` from `mini_games.json`. Completing
        before `endsAt` returns `SHIFT_NOT_FINISHED` (same rule as shifts).
        Completing twice replays the first result.
      x-phase: 4
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GigRunCompleteRequest' }
            example: { score: 82 }
      responses:
        '200':
          description: Pay and XP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GigRunResult' }
              example:
                runId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e01'
                gigId: 'food_delivery'
                score: 82
                payCents: 1450
                xp: 20
                outcomeId: 'gig_outcome_good'
                cashCents: 151450
        '400':
          description: Run not finished or score invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'SHIFT_NOT_FINISHED',
                      message: 'Shift cannot be completed before durationSec has elapsed.',
                      details: { 'endsAt': '2026-10-08T12:00:45.000Z' },
                    },
                }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServerError' }

  # ---------------------------------------------------------------------------
  # Phase 4 · Businesses and bad days (#30)
  # ---------------------------------------------------------------------------
  /me/businesses:
    get:
      tags: [businesses]
      operationId: getMeBusinesses
      summary: Businesses I own.
      x-phase: 4
      responses:
        '200':
          description: My businesses
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessList' }
              example:
                businesses:
                  - businessId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e02'
                    ownerUserId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e00'
                    kind: 'kols_agency'
                    name: 'KOLs Agency'
                    status: 'open'
                    purchaseCents: 5000000
                    incomeMinCents: 200000
                    incomeMaxCents: 600000
                    upkeepCentsPerWeek: 0
                    resaleCents: 3500000
                    canRunToday: true
                    lastRunDay: '2026-10-07'
                    createdAt: '2026-10-01T09:00:00.000Z'
                    closedAt: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServerError' }

  /businesses:
    post:
      tags: [businesses]
      operationId: postBusinesses
      summary: Buy (found) a business.
      description: |
        Implemented on main @ 9f3e5ef. `kind` is an id from
        `config/businesses.json` (`kols_agency`, `audit_firm`,
        `memecoin_lab`, `lounge`). Main @ 9f3e5ef accepts
        `lemonade_stand | laundromat | cafe | shop | arcade` from an in-code
        table and charges a first week of rent instead of `costCents`; see
        README, open question B1. Insufficient Cash is `INSUFFICIENT_CASH`
        (402); main currently throws `VALIDATION_FAILED`.
      x-phase: 4
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuyBusinessRequest' }
            example: { kind: 'kols_agency' }
      responses:
        '201':
          description: Business bought
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Business' }
              example:
                businessId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e02'
                ownerUserId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e00'
                kind: 'kols_agency'
                name: 'KOLs Agency'
                status: 'open'
                purchaseCents: 5000000
                incomeMinCents: 200000
                incomeMaxCents: 600000
                upkeepCentsPerWeek: 0
                resaleCents: 3500000
                canRunToday: true
                lastRunDay: null
                createdAt: '2026-10-08T12:00:00.000Z'
                closedAt: null
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/InsufficientCash' }
        '409':
          description: Ownership limit reached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'CONFLICT',
                      message: 'Resource conflict.',
                      details: { 'reason': 'business_limit', 'max': 3 },
                    },
                }
        '503': { $ref: '#/components/responses/ServerError' }

  /businesses/{id}:
    get:
      tags: [businesses]
      operationId: getBusiness
      summary: A business and its last 30 days.
      description: Implemented on main @ 9f3e5ef (`{business, recentDays}`).
      x-phase: 4
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Business detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessDetail' }
              example:
                business:
                  businessId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e02'
                  ownerUserId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e00'
                  kind: 'kols_agency'
                  name: 'KOLs Agency'
                  status: 'open'
                  purchaseCents: 5000000
                  incomeMinCents: 200000
                  incomeMaxCents: 600000
                  upkeepCentsPerWeek: 0
                  resaleCents: 3500000
                  canRunToday: false
                  lastRunDay: '2026-10-08'
                  createdAt: '2026-10-01T09:00:00.000Z'
                  closedAt: null
                recentDays:
                  - dayId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e03'
                    businessId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e02'
                    dayDate: '2026-10-08'
                    dayKind: 'bad_day'
                    payCents: 40000
                    eventId: 'biz_power_outage'
                    description: 'Power outage — closed early.'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServerError' }

  /businesses/{id}/run:
    post:
      tags: [businesses]
      operationId: postBusinessesIdRun
      summary: Open for the day and collect today's take.
      description: |
        Implemented on main @ 9f3e5ef. This is the "collect" action: one roll
        per business per UTC day (`normal`, `bad_day`, `great_day`), credited
        to the owner's Cash. A second call on the same UTC day returns the
        same `BusinessDay` without paying again. `eventId` comes from the
        proposed `business_events` registry so the client can localise the
        bad-day line; `description` stays as an English fallback.
      x-phase: 4
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Today's result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessDay' }
              example:
                dayId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e03'
                businessId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e02'
                dayDate: '2026-10-08'
                dayKind: 'great_day'
                payCents: 600000
                eventId: 'biz_viral_on_ct'
                description: 'Viral on CT — line around the block.'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServerError' }

  /businesses/{id}/sell:
    post:
      tags: [businesses]
      operationId: postBusinessesIdSell
      summary: Sell a business back to the city.
      description: |
        Credits `resaleCents` (a config share of `purchaseCents`; Cash only,
        never withdrawable) and closes the business. Not implemented on main
        @ 9f3e5ef. Owner only.
      x-phase: 4
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Sold
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessSale' }
              example:
                businessId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e02'
                resaleCents: 3500000
                cashCents: 3650000
                soldAt: '2026-10-08T12:30:00.000Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServerError' }

  # ---------------------------------------------------------------------------
  # Phase 4 · Homes: my home, rent, visit policy, furniture (#31)
  # ---------------------------------------------------------------------------
  /me/home:
    get:
      tags: [homes]
      operationId: getMeHome
      summary: My current home, rent state and layout.
      description: |
        `homeId` is the home instance (main @ 9f3e5ef uses `home:<uuidv7>`);
        `kindId` is the `homes.json` id. Weekly rent is debited by the rent
        worker; `overdueCents` is what the worker could not collect.
        404 before the player has a home.
      x-phase: 4
      responses:
        '200':
          description: My home
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyHome' }
              example:
                homeId: 'home:0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e04'
                kindId: 'hacker_house'
                rentCentsPerWeek: 6000
                nextDueAt: '2026-10-12T20:00:00.000Z'
                lastRentPaidAt: '2026-10-05T20:00:00.000Z'
                overdueCents: 0
                visitPolicy: 'followers'
                layout:
                  placements:
                    - {
                        instanceId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e05',
                        furnitureId: 'furniture_trading_rig',
                        anchorId: 'home_hacker_house.desk_1',
                        rotIndex: 0,
                      }
                  galleryAssetAddresses: ['CtAssetHardHat1xxxxxxxxxxxxxxxxxxxxxxxxxxx']
                  updatedAt: '2026-10-07T21:00:00.000Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServerError' }

  /me/home/rent-payments:
    post:
      tags: [homes]
      operationId: postMeHomeRentPayments
      summary: Pay overdue rent (and the current week) now.
      description: |
        Clears `overdueCents` plus the current week if unpaid. Main @ 9f3e5ef
        has the same debit as `POST /homes/{homeId}/rent` with `homeId` = the
        home instance; rc1 defines that path as "sign a lease for a home kind",
        so this proposal gives manual payment its own path (README, B3).
        Nothing due returns `CONFLICT`.
      x-phase: 4
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Rent paid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentPayment' }
              example:
                homeId: 'home:0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e04'
                paidCents: 12000
                overdueCents: 0
                cashCents: 138000
                nextDueAt: '2026-10-19T20:00:00.000Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/InsufficientCash' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServerError' }

  /me/home/settings:
    patch:
      tags: [homes]
      operationId: patchMeHomeSettings
      summary: Set who may visit my home.
      description: |
        `open`: anyone may `POST /homes/{ownerId}/visit`. `followers`: only
        players I follow. `closed`: nobody; visitors already inside are sent
        `kicked {reasonId: 'home_closed'}`. Blocked players can never visit.
      x-phase: 4
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HomeSettingsRequest' }
            example: { visitPolicy: 'open' }
      responses:
        '200':
          description: Updated home
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyHome' }
              example:
                homeId: 'home:0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e04'
                kindId: 'hacker_house'
                rentCentsPerWeek: 6000
                nextDueAt: '2026-10-12T20:00:00.000Z'
                lastRentPaidAt: '2026-10-05T20:00:00.000Z'
                overdueCents: 0
                visitPolicy: 'open'
                layout: { placements: [], galleryAssetAddresses: [], updatedAt: '2026-10-07T21:00:00.000Z' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServerError' }

  /me/home/layout:
    put:
      tags: [homes]
      operationId: putMeHomeLayout
      summary: Replace my home's furniture layout.
      description: |
        Places owned furniture on named anchors. Anchor ids are FE-owned
        entries in `spots.json` under the home's interior
        (`home_<kindId>.<anchor>`), each with a `kind` (`floor`, `wall`,
        `desk`) that must be in the item's `anchorKinds`. Omitted instances
        go back to storage. Visitors see the change through `HomeState`
        (realtime-additions.ts, `HomeDecorState`).
      x-phase: 4
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HomeLayoutRequest' }
            example:
              placements:
                - {
                    instanceId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e05',
                    anchorId: 'home_hacker_house.desk_1',
                    rotIndex: 0,
                  }
      responses:
        '200':
          description: Saved layout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeLayout' }
              example:
                placements:
                  - {
                      instanceId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e05',
                      furnitureId: 'furniture_trading_rig',
                      anchorId: 'home_hacker_house.desk_1',
                      rotIndex: 0,
                    }
                galleryAssetAddresses: []
                updatedAt: '2026-10-08T12:00:00.000Z'
        '400':
          description: Unknown anchor or anchor kind mismatch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'VALIDATION_FAILED',
                      message: 'Request body or params failed validation.',
                      details: { 'anchorId': 'home_hacker_house.wall_9', 'reason': 'unknown_anchor' },
                    },
                }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Two items on one anchor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'CONFLICT',
                      message: 'Resource conflict.',
                      details: { 'reason': 'anchor_taken', 'anchorId': 'home_hacker_house.desk_1' },
                    },
                }
        '503': { $ref: '#/components/responses/ServerError' }

  /furniture/catalog:
    get:
      tags: [homes]
      operationId: getFurnitureCatalog
      summary: Furniture for sale (Cash only, off-chain).
      x-phase: 4
      responses:
        '200':
          description: Catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FurnitureCatalog' }
              example:
                items:
                  - furnitureId: 'furniture_trading_rig'
                    name: 'Triple-Monitor Trading Rig'
                    priceCents: 250000
                    anchorKinds: ['desk']
                    homeKindIds: ['hacker_house', 'studio', 'penthouse', 'marina_villa']
                    phase: 4
                  - furnitureId: 'furniture_gallery_frame'
                    name: 'Gallery Frame'
                    priceCents: 20000
                    anchorKinds: ['wall']
                    homeKindIds: []
                    phase: 4
