  /season-pass/claim:
    post:
      tags: [seasons]
      operationId: postSeasonPassClaim
      summary: Check this week's season-pass perk.
      description: |
        Implemented on main @ 9f3e5ef. The Sunday Unlock worker credits the
        weekly perk; this call only reports it and never moves Cash. Without
        an active pass it returns `PASS_REQUIRED` (main: `VALIDATION_FAILED`).
        `statusId` is proposed so the client need not parse `message`.
      x-phase: 4
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Perk status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeeklyPerkClaim' }
              example:
                weekIso: '2026-W41'
                perkCents: 500
                credited: true
                statusId: 'credited'
                message: 'Weekly perk credited for 2026-W41.'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: No active season pass
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'PASS_REQUIRED',
                      message: 'An active season pass is required.',
                      details: { 'sku': 'season_pass_s1' },
                    },
                }
        '503': { $ref: '#/components/responses/ServerError' }

  # ---------------------------------------------------------------------------
  # Phase 5 · Ads booking details (#36)
  # ---------------------------------------------------------------------------
  /ads/bookings/{id}:
    get:
      tags: [ads]
      operationId: getAdsBooking
      summary: One of my ad bookings, with its review and payment state.
      description: |
        Lifecycle: `awaiting_payment` (intent open) → `pending_review` (paid,
        manual review) → `scheduled` (approved, `startsAt` in the future) →
        `live` → `expired`. Side exits: `cancelled` (before payment),
        `rejected` (review failed; a refund follows, `refunded` once the
        refund transfer confirms). `rejectionReasonId` comes from the proposed
        `ad_rejection_reasons` registry. Only the booker can read it.
      x-phase: 5
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Booking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdBooking' }
              example:
                bookingId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e10'
                slotId: 'billboard_01'
                termId: 'term_7d'
                status: 'rejected'
                link: 'https://example.org/launch'
                startsAt: '2026-10-12T00:00:00.000Z'
                endsAt: '2026-10-19T00:00:00.000Z'
                intentId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e11'
                currency: 'USDC'
                amount: '20000000'
                creative:
                  uploadId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e12'
                  imageUrl: 'https://cdn.ctlife.dev/ads/0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e12.png'
                  mimeType: 'image/png'
                  sizeBytes: 482113
                  width: 1024
                  height: 512
                rejectionReasonId: 'ad_x_engagement_reward'
                refund: { status: 'sent', amount: '20000000', currency: 'USDC', signature: 'CtRefundSignaturexxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx' }
                createdAt: '2026-10-08T12:00:00.000Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServerError' }

