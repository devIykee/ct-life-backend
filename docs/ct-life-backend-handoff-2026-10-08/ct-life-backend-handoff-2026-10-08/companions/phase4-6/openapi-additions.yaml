              schema: { $ref: '#/components/schemas/SmartMoneyTraderList' }
              example:
                nextCursor: null
                traders:
                  - userId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e60'
                    alias: 'frogewhale'
                    tribeId: 'trencher'
                    pnl7dCents: 8800000
                    winRateBps: 6100
                    tradeCount7d: 54
                    copierCount: 19
                    optedInAt: '2026-10-02T09:00:00.000Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServerError' }

  /copy-subscriptions:
    get:
      tags: [copy-trading]
      operationId: getCopySubscriptions
      summary: Traders I am copying.
      x-phase: 2
      responses:
        '200':
          description: Subscriptions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CopySubscriptionList' }
              example:
                subscriptions:
                  - subscriptionId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e61'
                    traderId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e60'
                    traderAlias: 'frogewhale'
                    status: 'active'
                    budgetCents: 500000
                    spentCents: 120000
                    perTradeCapCents: 50000
                    copyRatioBps: 1000
                    copySells: true
                    createdAt: '2026-10-08T12:00:00.000Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [copy-trading]
      operationId: postCopySubscriptions
      summary: Start copying a trader's coin trades with a Cash budget.
      description: |
        When the trader's buy or sell executes, the server places my trade at
        the next market tick: `copyRatioBps` of their Cash size, capped by
        `perTradeCapCents` and the remaining budget, with the market's default
        slippage guard. The budget is a ceiling, not escrow: Cash stays in my
        balance. Fictional coins and Cash only; perps are not copied.
        Skipped copies are reported with a reason, never retried.
      x-phase: 2
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CopySubscriptionRequest' }
            example:
              traderId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e60'
              budgetCents: 500000
              perTradeCapCents: 50000
              copyRatioBps: 1000
              copySells: true
      responses:
        '201':
          description: Subscribed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CopySubscription' }
              example:
                subscriptionId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e61'
                traderId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e60'
                traderAlias: 'frogewhale'
                status: 'active'
                budgetCents: 500000
                spentCents: 0
                perTradeCapCents: 50000
                copyRatioBps: 1000
                copySells: true
                createdAt: '2026-10-08T12:00:00.000Z'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already copying this trader, or copying myself
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'CONFLICT',
                      message: 'Resource conflict.',
                      details: { 'reason': 'already_copying' },
                    },
                }
        '503': { $ref: '#/components/responses/ServerError' }

  /copy-subscriptions/{id}:
    patch:
      tags: [copy-trading]
      operationId: patchCopySubscription
      summary: Pause, resume or resize a copy subscription.
      x-phase: 2
      parameters:
        - name: id
