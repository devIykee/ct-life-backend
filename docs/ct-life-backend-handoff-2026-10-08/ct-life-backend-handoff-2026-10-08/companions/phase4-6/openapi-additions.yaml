        membership; `sybil_barn`: jailed players only). The server enforces
        the same rule in the room's `onAuth` and fails the join with the same
        contract code. Replaces main @ 9f3e5ef
        `POST /homes/{id}/marina/visit`, which only accepts `marina_villa`.
        Ungated venues return `allowed: true`.
      x-phase: 6
