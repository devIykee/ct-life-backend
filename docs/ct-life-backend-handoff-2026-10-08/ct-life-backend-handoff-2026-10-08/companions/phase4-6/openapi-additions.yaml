components:
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  responses:
    InsufficientCash:
      description: Insufficient Cash
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error:
                {
                  code: 'INSUFFICIENT_CASH',
                  message: 'Cash balance is insufficient.',
                  details: { 'shortfallCents': 50000 },
                },
            }
    Conflict:
      description: The resource is not in a state that allows this action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error:
                {
                  code: 'CONFLICT',
                  message: 'Resource conflict.',
                  details: { 'reason': 'state_mismatch', 'status': 'closed' },
                },
            }
    SybilJailed:
      description: The caller is in the Sybil Barn
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error:
                {
                  code: 'SYBIL_JAILED',
                  message: 'You are in the Sybil Barn.',
                  details: { 'releaseAt': '2026-10-09T10:00:00.000Z', 'reasonId': 'sybil_clone_farm' },
                },
            }
    InternalError:
      description: Unexpected server error (already emitted by main's error envelope)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: 'INTERNAL_ERROR', message: 'Internal server error.', details: {} } }

  schemas:
    # --- Careers and gigs ---------------------------------------------------
    CareerSkillGate:
      type: object
      required: [skill, level]
      properties:
        skill: { type: string, enum: [clout, coding, trading, writing, design, security] }
        level: { type: integer, minimum: 1, maximum: 10 }
    CareerLevel:
      type: object
      required: [level, title, payCents, shiftSec, xpToReach, miniGameIds]
      properties:
        level: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string }
        payCents: { type: integer, format: int64 }
        shiftSec: { type: integer }
        xpToReach: { type: integer, minimum: 0, description: 'Cumulative career XP needed to reach this level (0 for level 1).' }
        miniGameIds: { type: array, items: { type: string } }
        skillGates: { type: array, items: { $ref: '#/components/schemas/CareerSkillGate' } }
    CareerProgress:
      type: object
      required: [level, xp, xpToNextLevel, shiftsCompleted, isActiveJob, eligible, blockedBy, lastShiftAt]
      properties:
        level: { type: integer, minimum: 0, maximum: 5, description: '0 = never worked this career.' }
        xp: { type: integer, minimum: 0 }
        xpToNextLevel: { type: [integer, 'null'], minimum: 0, description: 'null at the top level.' }
        shiftsCompleted: { type: integer, minimum: 0 }
        isActiveJob: { type: boolean }
        eligible: { type: boolean, description: 'All skill gates for level 1 are met.' }
        blockedBy: { type: array, items: { $ref: '#/components/schemas/CareerSkillGate' } }
        lastShiftAt: { type: [string, 'null'], format: date-time }
    CareerDetail:
      type: object
      required: [id, name, phase, active, skillGates, levels, progress]
      properties:
        id: { type: string }
        name: { type: string }
        phase: { type: integer, minimum: 1, maximum: 6 }
        active: { type: boolean }
        skillGates: { type: array, items: { $ref: '#/components/schemas/CareerSkillGate' } }
        levels: { type: array, items: { $ref: '#/components/schemas/CareerLevel' } }
        progress: { $ref: '#/components/schemas/CareerProgress' }
    GigRun:
      type: object
      required: [runId, gigId, miniGameId, maxScore, startedAt, endsAt]
      properties:
        runId: { type: string, format: uuid }
        gigId: { type: string }
        miniGameId: { type: string }
        maxScore: { type: integer, minimum: 1 }
        startedAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    GigRunCompleteRequest:
      type: object
      required: [score]
      properties:
        score: { type: integer, minimum: 0 }
    GigRunResult:
      type: object
      required: [runId, gigId, score, payCents, xp, outcomeId, cashCents]
      properties:
        runId: { type: string, format: uuid }
        gigId: { type: string }
        score: { type: integer, minimum: 0, description: 'After capping at maxScore.' }
        payCents: { type: integer, format: int64 }
        xp: { type: integer }
        outcomeId: { type: string }
        cashCents: { type: integer, format: int64, description: 'My Cash balance after payment.' }

    # --- Businesses ---------------------------------------------------------
    BuyBusinessRequest:
      type: object
      required: [kind]
      properties:
        kind: { type: string, description: 'An id from config/businesses.json.' }
    Business:
      type: object
      required:
        [
          businessId,
          ownerUserId,
          kind,
          name,
          status,
          purchaseCents,
          incomeMinCents,
          incomeMaxCents,
          upkeepCentsPerWeek,
          resaleCents,
          canRunToday,
          lastRunDay,
          createdAt,
          closedAt,
        ]
      properties:
        businessId: { type: string, format: uuid }
        ownerUserId: { type: string, format: uuid }
        kind: { type: string }
        name: { type: string }
        status: { type: string, enum: [open, closed, sold] }
        purchaseCents: { type: integer, format: int64 }
        incomeMinCents: { type: integer, format: int64 }
        incomeMaxCents: { type: integer, format: int64 }
        upkeepCentsPerWeek: { type: integer, format: int64 }
        resaleCents: { type: integer, format: int64, description: 'What POST /businesses/{id}/sell pays now.' }
        canRunToday: { type: boolean }
        lastRunDay: { type: [string, 'null'], format: date }
        createdAt: { type: string, format: date-time }
        closedAt: { type: [string, 'null'], format: date-time }
    BusinessList:
      type: object
      required: [businesses]
      properties:
        businesses: { type: array, items: { $ref: '#/components/schemas/Business' } }
    BusinessDay:
      type: object
      required: [dayId, businessId, dayDate, dayKind, payCents, eventId]
      properties:
        dayId: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        dayDate: { type: string, format: date }
        dayKind: { type: string, enum: [normal, bad_day, great_day] }
        payCents: { type: integer, format: int64 }
        eventId: { type: string, description: 'Id from the proposed business_events registry.' }
        description: { type: string, description: 'English fallback; the client localises eventId.' }
    BusinessDetail:
      type: object
      required: [business, recentDays]
      properties:
        business: { $ref: '#/components/schemas/Business' }
        recentDays: { type: array, items: { $ref: '#/components/schemas/BusinessDay' } }
    BusinessSale:
      type: object
      required: [businessId, resaleCents, cashCents, soldAt]
      properties:
        businessId: { type: string, format: uuid }
        resaleCents: { type: integer, format: int64 }
        cashCents: { type: integer, format: int64, description: 'My Cash balance after the sale.' }
        soldAt: { type: string, format: date-time }

    # --- Homes and furniture ------------------------------------------------
    FurniturePlacement:
      type: object
      required: [instanceId, furnitureId, anchorId, rotIndex]
      properties:
        instanceId: { type: string, format: uuid }
        furnitureId: { type: string }
        anchorId: { type: string, description: 'FE-owned spot id, e.g. home_hacker_house.desk_1.' }
        rotIndex: { type: integer, minimum: 0, maximum: 3, description: 'Quarter turns.' }
    HomeLayoutPlacementInput:
      type: object
      required: [instanceId, anchorId, rotIndex]
      properties:
        instanceId: { type: string, format: uuid }
        anchorId: { type: string }
        rotIndex: { type: integer, minimum: 0, maximum: 3 }
    HomeLayoutRequest:
      type: object
      required: [placements]
      properties:
        placements: { type: array, maxItems: 40, items: { $ref: '#/components/schemas/HomeLayoutPlacementInput' } }
    HomeLayout:
      type: object
      required: [placements, galleryAssetAddresses, updatedAt]
      properties:
        placements: { type: array, items: { $ref: '#/components/schemas/FurniturePlacement' } }
        galleryAssetAddresses: { type: array, maxItems: 12, items: { type: string } }
        updatedAt: { type: string, format: date-time }
    MyHome:
      type: object
      required:
        [homeId, kindId, rentCentsPerWeek, nextDueAt, lastRentPaidAt, overdueCents, visitPolicy, layout]
      properties:
        homeId: { type: string, description: 'Home instance id (main: home:<uuidv7>).' }
        kindId: { type: string, description: 'Id from homes.json.' }
        rentCentsPerWeek: { type: integer, format: int64 }
        nextDueAt: { type: string, format: date-time }
        lastRentPaidAt: { type: [string, 'null'], format: date-time }
        overdueCents: { type: integer, format: int64, minimum: 0 }
        visitPolicy: { type: string, enum: [open, followers, closed] }
        layout: { $ref: '#/components/schemas/HomeLayout' }
    HomeSettingsRequest:
      type: object
      required: [visitPolicy]
      properties:
        visitPolicy: { type: string, enum: [open, followers, closed] }
    RentPayment:
      type: object
      required: [homeId, paidCents, overdueCents, cashCents, nextDueAt]
      properties:
        homeId: { type: string }
        paidCents: { type: integer, format: int64 }
        overdueCents: { type: integer, format: int64, minimum: 0 }
        cashCents: { type: integer, format: int64, description: 'My Cash balance after payment.' }
        nextDueAt: { type: string, format: date-time }
    FurnitureItem:
      type: object
      required: [furnitureId, name, priceCents, anchorKinds, homeKindIds, phase]
      properties:
        furnitureId: { type: string, description: 'Id from the proposed furniture.json registry.' }
        name: { type: string }
        priceCents: { type: integer, format: int64 }
        anchorKinds: { type: array, items: { type: string, enum: [floor, wall, desk] } }
        homeKindIds: { type: array, items: { type: string }, description: 'Empty = fits every home kind and the HQ.' }
        phase: { type: integer, minimum: 1, maximum: 6 }
    FurnitureCatalog:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/FurnitureItem' } }
    FurniturePurchaseRequest:
      type: object
      required: [furnitureId]
      properties:
        furnitureId: { type: string }
    OwnedFurniture:
      type: object
      required: [instanceId, furnitureId, placed, acquiredAt]
      properties:
        instanceId: { type: string, format: uuid }
        furnitureId: { type: string }
        placed: { type: boolean }
        acquiredAt: { type: string, format: date-time }
    FurnitureInventory:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OwnedFurniture' } }

    # --- Weekly recap -------------------------------------------------------
    WeeklyRecapBoard:
      type: object
      required: [boardId, rank]
      properties:
        boardId: { type: string }
        rank: { type: [integer, 'null'], minimum: 1, description: 'null when outside the published range or hidden (anon).' }
    WeeklyRecap:
      type: object
      required:
        [
          weekIso,
          from,
          to,
          pnlCents,
          incomeCents,
          rentPaidCents,
          taxPaidCents,
          netWorthCents,
          netWorthDeltaCents,
          shiftsWorked,
          liquidations,
          biggestWinCents,
          boards,
          metaBonusId,
        ]
      properties:
        weekIso: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        pnlCents: { type: integer, format: int64 }
        incomeCents: { type: integer, format: int64 }
        rentPaidCents: { type: integer, format: int64 }
        taxPaidCents: { type: integer, format: int64 }
        netWorthCents: { type: integer, format: int64 }
        netWorthDeltaCents: { type: integer, format: int64 }
        shiftsWorked: { type: integer, minimum: 0 }
        liquidations: { type: integer, minimum: 0 }
        biggestWinCents: { type: integer, format: int64 }
        boards: { type: array, items: { $ref: '#/components/schemas/WeeklyRecapBoard' } }
        metaBonusId: { type: [string, 'null'] }

    # --- Cosmetic NFTs and gallery -----------------------------------------
    NftPrice:
      type: object
      required: [currency, amount, priceUsd]
      properties:
        currency: { type: string, enum: [USDC, SOL, SKR, ORE] }
        amount: { type: string, pattern: '^[0-9]+$', description: 'Base units of currency.' }
        priceUsd: { type: string, description: 'Display only. Never compute with it.' }
    NftListing:
      type: object
      required:
        [
          sku,
          itemId,
          name,
          slot,
          imageUrl,
          editionSize,
          mintedCount,
          available,
          oreOnly,
          cluster,
          collectionAddress,
          prices,
        ]
      properties:
        sku: { type: string, description: 'Pass as PaymentIntent sku with kind cosmetic.' }
        itemId: { type: string, description: 'Id from items.json; equippable while the wallet holds the asset.' }
        name: { type: string }
        slot: { type: string, enum: [skin, head, hair, top, bottom, shoes, acc] }
        imageUrl: { type: string, format: uri }
        editionSize: { type: [integer, 'null'], minimum: 1, description: 'null = open edition.' }
        mintedCount: { type: integer, minimum: 0 }
        available: { type: boolean }
        oreOnly: { type: boolean }
        cluster: { type: string, enum: [devnet, mainnet] }
        collectionAddress: { type: string }
        prices: { type: array, items: { $ref: '#/components/schemas/NftPrice' } }
    NftCatalog:
      type: object
      required: [listings, quotedAt]
      properties:
        listings: { type: array, items: { $ref: '#/components/schemas/NftListing' } }
        quotedAt: { type: string, format: date-time }
    NftOrder:
      type: object
      required:
        [intentId, sku, status, wallet, cluster, assetAddress, mintSignature, failureReasonId, updatedAt]
      properties:
        intentId: { type: string, format: uuid }
        sku: { type: string }
        status: { type: string, enum: [awaiting_payment, paid, minting, minted, failed, refunded] }
        wallet: { type: string, description: 'Recipient wallet (the signed-in wallet).' }
        cluster: { type: string, enum: [devnet, mainnet] }
        assetAddress: { type: [string, 'null'] }
        mintSignature: { type: [string, 'null'] }
        failureReasonId: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
    NftModeration:
      type: object
      required: [status, reasonId]
      properties:
        status: { type: string, enum: [approved, pending, hidden] }
        reasonId: { type: [string, 'null'], description: 'Id from report_reasons.json when hidden.' }
    GalleryAsset:
      type: object
      required:
        [
          assetAddress,
          source,
          interface,
          collectionAddress,
          itemId,
          name,
          imageUrl,
          thumbnailUrl,
          moderation,
          displayed,
          equippable,
        ]
      properties:
        assetAddress: { type: string }
        source: { type: string, enum: [ct_life, external] }
        interface: { type: string, description: 'Helius DAS interface, e.g. MplCoreAsset, V1_NFT, ProgrammableNFT.' }
        collectionAddress: { type: [string, 'null'] }
        itemId: { type: [string, 'null'], description: 'Set for ct_life assets.' }
        name: { type: string }
        imageUrl: { type: [string, 'null'], description: 'Server CDN URL; null when hidden, or pending and viewed by someone else.' }
        thumbnailUrl: { type: [string, 'null'] }
        moderation: { $ref: '#/components/schemas/NftModeration' }
        displayed: { type: boolean, description: 'Chosen for the home gallery.' }
        equippable: { type: boolean }
    Gallery:
      type: object
      required: [userId, wallet, assets, nextCursor, indexedAt]
      properties:
        userId: { type: string, format: uuid }
        wallet: { type: string }
        assets: { type: array, items: { $ref: '#/components/schemas/GalleryAsset' } }
        nextCursor: { type: [string, 'null'] }
        indexedAt: { type: [string, 'null'], format: date-time }
    GallerySelectionRequest:
      type: object
      required: [assetAddresses]
      properties:
        assetAddresses: { type: array, maxItems: 12, items: { type: string } }
    GalleryRefresh:
      type: object
      required: [status, indexedAt, nextRefreshAt]
      properties:
        status: { type: string, enum: [queued, fresh] }
        indexedAt: { type: [string, 'null'], format: date-time }
        nextRefreshAt: { type: string, format: date-time }

    # --- Seasons and season pass -------------------------------------------
    Season:
      type: object
      required: [seasonId, name, startsAt, endsAt, weekIso]
      properties:
        seasonId: { type: string }
        name: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        weekIso: { type: string, description: 'Current ISO week, for the weekly clocks.' }
    SeasonPassPerk:
      type: object
      required: [perkId, kind, cashCents, itemId]
      properties:
        perkId: { type: string, description: 'Id from the proposed season_pass_perks registry.' }
        kind: { type: string, enum: [weekly_cash, cosmetic, badge, bonus] }
        cashCents: { type: [integer, 'null'], format: int64 }
        itemId: { type: [string, 'null'], description: 'Off-chain cosmetic; never an NFT.' }
    SeasonPassStatus:
      type: object
      required: [owned, purchasedAt, expiresAt, intentId]
      properties:
        owned: { type: boolean }
        purchasedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        intentId: { type: [string, 'null'], format: uuid }
    SeasonPass:
      type: object
      required: [season, sku, priceUsdc, currencies, perks, me]
      properties:
        season: { $ref: '#/components/schemas/Season' }
        sku: { type: string, description: 'Pass as PaymentIntent sku with kind season_pass.' }
        priceUsdc: { type: string, pattern: '^[0-9]+$', description: 'USDC base units (6 decimals).' }
        currencies: { type: array, items: { type: string, enum: [USDC, SOL, SKR, ORE] } }
        perks: { type: array, items: { $ref: '#/components/schemas/SeasonPassPerk' } }
        me: { $ref: '#/components/schemas/SeasonPassStatus' }
    WeeklyPerkClaim:
      type: object
      required: [weekIso, perkCents, credited, statusId, message]
      properties:
        weekIso: { type: string }
        perkCents: { type: integer, format: int64 }
        credited: { type: boolean }
        statusId: { type: string, enum: [credited, pending, not_eligible] }
        message: { type: string, description: 'English fallback.' }

    # --- Ads ----------------------------------------------------------------
    AdCreative:
      type: object
      required: [uploadId, imageUrl, mimeType, sizeBytes, width, height]
      properties:
        uploadId: { type: string, format: uuid }
        imageUrl: { type: string, format: uri }
        mimeType: { type: string, enum: [image/png, image/jpeg] }
        sizeBytes: { type: integer, minimum: 1, maximum: 1048576 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
    AdRefund:
      type: object
      required: [status, amount, currency, signature]
      properties:
        status: { type: string, enum: [pending, sent, failed] }
        amount: { type: string, pattern: '^[0-9]+$' }
        currency: { type: string, enum: [USDC, SOL, SKR, ORE] }
        signature: { type: [string, 'null'] }
    AdBooking:
      type: object
      required:
        [
          bookingId,
          slotId,
          termId,
          status,
          link,
          startsAt,
          endsAt,
          intentId,
          currency,
          amount,
          creative,
          rejectionReasonId,
          refund,
          createdAt,
        ]
      properties:
        bookingId: { type: string, format: uuid }
        slotId: { type: string }
        termId: { type: string }
        status:
          type: string
          enum: [awaiting_payment, pending_review, scheduled, live, expired, rejected, cancelled, refunded]
        link: { type: string, description: 'Stored only; never fetched by the server.' }
        startsAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        intentId: { type: [string, 'null'], format: uuid }
        currency: { type: string, enum: [USDC, SOL, SKR, ORE] }
        amount: { type: string, pattern: '^[0-9]+$', description: 'Paid amount in base units.' }
        creative:
          anyOf:
            - { $ref: '#/components/schemas/AdCreative' }
            - { type: 'null' }
        rejectionReasonId: { type: [string, 'null'], description: 'Id from the proposed ad_rejection_reasons registry.' }
        refund:
          anyOf:
            - { $ref: '#/components/schemas/AdRefund' }
            - { type: 'null' }
        createdAt: { type: string, format: date-time }
    AdBookingList:
      type: object
      required: [bookings, nextCursor]
      properties:
        bookings: { type: array, items: { $ref: '#/components/schemas/AdBooking' } }
        nextCursor: { type: [string, 'null'] }
    AdTermPrice:
      type: object
      required: [termId, days, priceUsdc]
      properties:
        termId: { type: string }
        days: { type: integer, minimum: 1 }
        priceUsdc: { type: string, pattern: '^[0-9]+$', description: 'USDC base units (rc1 AdSlot uses a number).' }
    AdWindow:
      type: object
      required: [startsAt, endsAt]
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    AdSlotAvailability:
      type: object
      required: [slotId, kind, creativeWidth, creativeHeight, terms, booked, nextFreeAt]
      properties:
        slotId: { type: string }
        kind: { type: string }
        creativeWidth: { type: integer, minimum: 1 }
        creativeHeight: { type: integer, minimum: 1 }
        terms: { type: array, items: { $ref: '#/components/schemas/AdTermPrice' } }
        booked: { type: array, items: { $ref: '#/components/schemas/AdWindow' } }
        nextFreeAt: { type: [string, 'null'], format: date-time }

    # --- Projects, HQ, VC Row -----------------------------------------------
    ProjectSummary:
      type: object
      required:
        [
          projectId,
          name,
          kind,
          status,
          ownerUserId,
          ownerAlias,
          memberCount,
          treasuryCents,
          coinId,
          openRoles,
          createdAt,
        ]
      properties:
        projectId: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [memecoin, dex, nft_studio, perps_venue, l2] }
        status: { type: string, enum: [founded, launching, live, paused, rugged, dead] }
        ownerUserId: { type: string, format: uuid }
        ownerAlias: { type: string }
        memberCount: { type: integer, minimum: 1 }
        treasuryCents: { type: integer, format: int64 }
        coinId: { type: [string, 'null'], format: uuid, description: 'Launchpad coin once listed.' }
        openRoles: { type: array, items: { type: string, enum: [dev, mod, kol, auditor] } }
        createdAt: { type: string, format: date-time }
    ProjectList:
      type: object
      required: [projects, nextCursor]
      properties:
        projects: { type: array, items: { $ref: '#/components/schemas/ProjectSummary' } }
        nextCursor: { type: [string, 'null'] }
    CreateProjectRequest:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string, enum: [memecoin, dex, nft_studio, perps_venue, l2] }
        name: { type: string, minLength: 3, maxLength: 24, description: 'Passes the chat filter; parody names only.' }
        ticker: { type: string, pattern: '^[A-Z0-9]{2,8}$' }
    ProjectMember:
      type: object
      required: [userId, alias, role, salaryCentsPerWeek, joinedAt]
      properties:
        userId: { type: string, format: uuid }
        alias: { type: string }
        role: { type: string, enum: [founder, dev, mod, kol, auditor] }
        salaryCentsPerWeek: { type: integer, format: int64 }
        joinedAt: { type: string, format: date-time }
    VcStake:
      type: object
      required: [vcArchetypeId, equityBps, investedCents, unlockAt]
      properties:
        vcArchetypeId: { type: string }
        equityBps: { type: integer, minimum: 1, maximum: 10000 }
        investedCents: { type: integer, format: int64 }
        unlockAt: { type: string, format: date-time }
    ProjectEvent:
      type: object
      required: [eventId, projectId, cashDeltaCents, params, at]
      properties:
        eventId: { type: string, description: 'Id from the proposed project_events registry.' }
        projectId: { type: string, format: uuid }
        cashDeltaCents: { type: integer, format: int64, description: 'Treasury change.' }
        params: { type: object, additionalProperties: { type: string } }
        at: { type: string, format: date-time }
    ProjectDetail:
      type: object
      required: [project, members, payrollCentsPerWeek, nextPayrollAt, vcStakes, recentEvents]
      properties:
        project: { $ref: '#/components/schemas/ProjectSummary' }
        members: { type: array, items: { $ref: '#/components/schemas/ProjectMember' } }
        payrollCentsPerWeek: { type: integer, format: int64 }
        nextPayrollAt: { type: [string, 'null'], format: date-time }
        vcStakes: { type: array, items: { $ref: '#/components/schemas/VcStake' } }
        recentEvents: { type: array, items: { $ref: '#/components/schemas/ProjectEvent' } }
    ProjectFundRequest:
      type: object
      required: [cashCents]
      properties:
        cashCents: { type: integer, format: int64, minimum: 1 }
    HireOfferRequest:
      type: object
      required: [userId, role, salaryCentsPerWeek]
      properties:
        userId: { type: string, format: uuid }
        role: { type: string, enum: [dev, mod, kol, auditor] }
        salaryCentsPerWeek: { type: integer, format: int64, minimum: 1 }
    HireOffer:
      type: object
      required:
        [
          offerId,
          projectId,
          projectName,
          fromUserId,
          toUserId,
          role,
          salaryCentsPerWeek,
          status,
          expiresAt,
          createdAt,
        ]
      properties:
        offerId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        fromUserId: { type: string, format: uuid }
        toUserId: { type: string, format: uuid }
        role: { type: string, enum: [dev, mod, kol, auditor] }
        salaryCentsPerWeek: { type: integer, format: int64 }
        status: { type: string, enum: [pending, accepted, declined, expired, withdrawn] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    HireOfferList:
      type: object
      required: [offers, nextCursor]
      properties:
        offers: { type: array, items: { $ref: '#/components/schemas/HireOffer' } }
        nextCursor: { type: [string, 'null'] }
    ProjectLaunchQuote:
      type: object
      required: [projectId, launchCostCents, builderDiscountBps, treasuryCents, canLaunch, blockers, quotedAt]
      properties:
        projectId: { type: string, format: uuid }
        launchCostCents: { type: integer, format: int64 }
        builderDiscountBps: { type: integer, minimum: 0, maximum: 10000 }
        treasuryCents: { type: integer, format: int64 }
        canLaunch: { type: boolean }
        blockers:
          type: array
          items: { type: string, enum: [insufficient_treasury, wrong_status, no_dev_hired, cooldown] }
        quotedAt: { type: string, format: date-time }
    ProjectLaunchRequest:
      type: object
      required: [ticker, quotedCostCents]
      properties:
        ticker: { type: string, pattern: '^[A-Z0-9]{2,8}$' }
        quotedCostCents: { type: integer, format: int64, description: 'launchCostCents from the quote.' }
    ProjectEventList:
      type: object
      required: [events, nextCursor]
      properties:
        events: { type: array, items: { $ref: '#/components/schemas/ProjectEvent' } }
        nextCursor: { type: [string, 'null'] }
    RoomTicket:
      type: object
      required: [roomName, roomId, expiresAt]
      properties:
        roomName: { type: string, enum: [home, project_hq] }
        roomId: { type: string, description: 'Pass to client.joinById(roomId, {token}).' }
        expiresAt: { type: string, format: date-time }
    VcOffer:
      type: object
      required: [offerId, projectId, vcArchetypeId, investCents, equityBps, unlockAt, status, expiresAt]
      properties:
        offerId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        vcArchetypeId: { type: string, description: 'Id from archetypes.json (vc).' }
        investCents: { type: integer, format: int64 }
        equityBps: { type: integer, minimum: 1, maximum: 10000 }
        unlockAt: { type: string, format: date-time }
        status: { type: string, enum: [pending, accepted, declined, expired] }
        expiresAt: { type: string, format: date-time }
    VcOfferList:
      type: object
      required: [offers]
      properties:
        offers: { type: array, items: { $ref: '#/components/schemas/VcOffer' } }
    VcDeal:
      type: object
      required: [projectId, projectName, vcArchetypeId, investCents, equityBps, status, at]
      properties:
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        vcArchetypeId: { type: string }
        investCents: { type: integer, format: int64 }
        equityBps: { type: integer, minimum: 1, maximum: 10000 }
        status: { type: string, enum: [active, unlocked, dumped] }
        at: { type: string, format: date-time }
    VcDealList:
      type: object
      required: [deals, nextCursor]
      properties:
        deals: { type: array, items: { $ref: '#/components/schemas/VcDeal' } }
        nextCursor: { type: [string, 'null'] }

    # --- Tribes and districts -----------------------------------------------
    Tribe:
      type: object
      required: [tribeId, name, homeTurf, perk, emoteId, phase, ownedDistricts]
      properties:
        tribeId: { type: string }
        name: { type: string }
        homeTurf: { type: string }
        perk: { type: string }
        emoteId: { type: string }
        phase: { type: integer, minimum: 1, maximum: 6 }
        ownedDistricts: { type: array, items: { type: string } }
        memberCount: { type: integer, minimum: 0 }
    TribeList:
      type: object
      required: [tribes]
      properties:
        tribes: { type: array, items: { $ref: '#/components/schemas/Tribe' } }
    District:
      type: object
      required: [districtId, name, venueIds, currentOwnerTribeId, controlledSince, defaultHolderTribeId]
      properties:
        districtId: { type: string, description: 'Id from the proposed districts.json registry.' }
        name: { type: string }
        venueIds: { type: array, items: { type: string } }
        currentOwnerTribeId: { type: [string, 'null'] }
        controlledSince: { type: [string, 'null'], format: date-time }
        defaultHolderTribeId: { type: string }
        lore: { type: string }
    DistrictList:
      type: object
      required: [districts]
      properties:
        districts: { type: array, items: { $ref: '#/components/schemas/District' } }
    DistrictStanding:
      type: object
      required: [tribeId, score]
      properties:
        tribeId: { type: string }
        score: { type: integer, minimum: 0 }
    DistrictStandings:
      type: object
      required: [districtId, dayDate, rolloverAt, standings, myTribeId, myContribution]
      properties:
        districtId: { type: string }
        dayDate: { type: string, format: date }
        rolloverAt: { type: string, format: date-time }
        standings: { type: array, items: { $ref: '#/components/schemas/DistrictStanding' } }
        myTribeId: { type: string }
        myContribution: { type: [integer, 'null'], minimum: 0 }

    # --- Leagues and season results -----------------------------------------
    League:
      type: object
      required: [leagueId, slug, label, minNetWorthCents, maxMembers, sortOrder, promoteToSlug]
      properties:
        leagueId: { type: string }
        slug: { type: string }
        label: { type: string }
        minNetWorthCents: { type: integer, format: int64 }
        maxMembers: { type: integer, minimum: 1 }
        sortOrder: { type: integer, minimum: 0 }
        promoteToSlug: { type: [string, 'null'] }
    LeagueList:
      type: object
      required: [leagues]
      properties:
        leagues: { type: array, items: { $ref: '#/components/schemas/League' } }
    SeasonMembership:
      type: object
      required: [userId, seasonIso, leagueId, netWorthCents, rank, promotedFromLeagueId]
      properties:
        userId: { type: string, format: uuid }
        seasonIso: { type: string }
        leagueId: { type: string }
        netWorthCents: { type: integer, format: int64 }
        rank: { type: integer, minimum: 1 }
        promotedFromLeagueId: { type: [string, 'null'] }
    LeagueMembership:
      type: object
      required: [seasonIso, membership]
      properties:
        seasonIso: { type: string }
        membership:
          anyOf:
            - { $ref: '#/components/schemas/SeasonMembership' }
            - { type: 'null' }
    SeasonReward:
      type: object
      required: [kind, cashCents, itemId, badgeId]
      properties:
        kind: { type: string, enum: [cash, cosmetic, badge] }
        cashCents: { type: [integer, 'null'], format: int64 }
        itemId: { type: [string, 'null'], description: 'Off-chain cosmetic only.' }
        badgeId: { type: [string, 'null'] }
    SeasonResult:
      type: object
      required: [seasonId, leagueId, finalRank, outcome, toLeagueId, rewards]
      properties:
        seasonId: { type: string }
        leagueId: { type: string }
        finalRank: { type: integer, minimum: 1 }
        outcome: { type: string, enum: [promoted, relegated, stayed] }
        toLeagueId: { type: string }
        rewards: { type: array, items: { $ref: '#/components/schemas/SeasonReward' } }

    # --- CT Beef -------------------------------------------------------------
    BeefOpenRequest:
      type: object
      required: [stakeCents, topicId]
      properties:
        stakeCents: { type: integer, format: int64, minimum: 100 }
        topicId: { type: string, description: 'Id from the proposed beef_topics registry.' }
        invitedUserId: { type: string, format: uuid }
    BeefVotes:
      type: object
      required: [challenger, accepter, total]
      properties:
        challenger: { type: integer, minimum: 0 }
        accepter: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    BeefMatch:
      type: object
      required:
        [
          matchId,
          challengerUserId,
          invitedUserId,
          accepterUserId,
          topicId,
          stakeCents,
          feeBps,
          status,
          phaseEndsAt,
          votes,
          myVote,
          winnerUserId,
          eloChallengerPre,
          eloAccepterPre,
          eloChallengerPost,
          eloAccepterPost,
          openedAt,
          acceptedAt,
          settledAt,
        ]
      properties:
        matchId: { type: string, format: uuid }
        challengerUserId: { type: string, format: uuid }
        invitedUserId: { type: [string, 'null'], format: uuid }
        accepterUserId: { type: [string, 'null'], format: uuid }
        topicId: { type: string }
        stakeCents: { type: integer, format: int64 }
        feeBps: { type: integer, minimum: 0, maximum: 10000 }
        status: { type: string, enum: [open, active, voting, closed, declined, cancelled, expired] }
        phaseEndsAt: { type: [string, 'null'], format: date-time }
        votes:
          anyOf:
            - { $ref: '#/components/schemas/BeefVotes' }
            - { type: 'null' }
        myVote: { type: [string, 'null'], format: uuid }
        winnerUserId: { type: [string, 'null'], format: uuid, description: 'null on a draw or before close.' }
        eloChallengerPre: { type: [integer, 'null'] }
        eloAccepterPre: { type: [integer, 'null'] }
        eloChallengerPost: { type: [integer, 'null'] }
        eloAccepterPost: { type: [integer, 'null'] }
        openedAt: { type: string, format: date-time }
        acceptedAt: { type: [string, 'null'], format: date-time }
        settledAt: { type: [string, 'null'], format: date-time }
    BeefMatchList:
      type: object
      required: [matches, nextCursor]
      properties:
        matches: { type: array, items: { $ref: '#/components/schemas/BeefMatch' } }
        nextCursor: { type: [string, 'null'] }
    BeefVoteRequest:
      type: object
      required: [votedUserId]
      properties:
        votedUserId: { type: string, format: uuid }
    BeefVoteReceipt:
      type: object
      required: [matchId, votedUserId, at]
      properties:
        matchId: { type: string, format: uuid }
        votedUserId: { type: string, format: uuid }
        at: { type: string, format: date-time }
    BeefElo:
      type: object
      required: [userId, elo, matchesPlayed, wins, losses, draws]
      properties:
        userId: { type: string, format: uuid }
        elo: { type: integer, minimum: 0, maximum: 3000 }
        matchesPlayed: { type: integer, minimum: 0 }
        wins: { type: integer, minimum: 0 }
        losses: { type: integer, minimum: 0 }
        draws: { type: integer, minimum: 0 }

    # --- Airdrop Farm and Sybil Barn ----------------------------------------
    SybilStatus:
      type: object
      required: [jailed, jailedAt, releaseAt, reasonId, bailCents, bailable]
      properties:
        jailed: { type: boolean }
        jailedAt: { type: [string, 'null'], format: date-time }
        releaseAt: { type: [string, 'null'], format: date-time, description: 'null = until an admin releases.' }
        reasonId: { type: [string, 'null'], description: 'Id from the proposed sybil_reasons registry.' }
        bailCents: { type: [integer, 'null'], format: int64 }
        bailable: { type: boolean }
    FarmStatus:
      type: object
      required:
        [
          dayDate,
          claimedToday,
          nextClaimAt,
          baseCents,
          sgtBonusBps,
          tribeBonusBps,
          todayAmountCents,
          dailyCapCents,
          streakDays,
          sybil,
        ]
      properties:
        dayDate: { type: string, format: date }
        claimedToday: { type: boolean }
        nextClaimAt: { type: string, format: date-time }
        baseCents: { type: integer, format: int64 }
        sgtBonusBps: { type: integer, minimum: 0 }
        tribeBonusBps: { type: integer, minimum: 0 }
        todayAmountCents: { type: integer, format: int64 }
        dailyCapCents: { type: integer, format: int64 }
        streakDays: { type: integer, minimum: 0 }
        sybil: { $ref: '#/components/schemas/SybilStatus' }
    AirdropClaim:
      type: object
      required: [claimId, userId, dayDate, claimCount, amountCents, sgtBonus, claimedAt]
      properties:
        claimId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        dayDate: { type: string, format: date }
        claimCount: { type: integer, minimum: 1 }
        amountCents: { type: integer, format: int64 }
        sgtBonus: { type: boolean }
        claimedAt: { type: string, format: date-time }
    AirdropClaimList:
      type: object
      required: [claims]
      properties:
        claims: { type: array, items: { $ref: '#/components/schemas/AirdropClaim' } }
    SybilInmate:
      type: object
      required: [userId, alias, jailedAt, releaseAt]
      properties:
        userId: { type: string, format: uuid }
        alias: { type: string }
        jailedAt: { type: string, format: date-time }
        releaseAt: { type: [string, 'null'], format: date-time }
    SybilBarn:
      type: object
      required: [count, inmates, nextCursor]
      properties:
        count: { type: integer, minimum: 0 }
        inmates: { type: array, items: { $ref: '#/components/schemas/SybilInmate' } }
        nextCursor: { type: [string, 'null'] }

    # --- Venue gates and the Cabal ------------------------------------------
    VenueAccess:
      type: object
      required:
        [venueId, allowed, reasonCode, requiredNetWorthCents, netWorthCents, membershipRequired, isMember]
      properties:
        venueId: { type: string }
        allowed: { type: boolean }
        reasonCode:
          type: [string, 'null']
          description: 'NET_WORTH_TOO_LOW, INVITE_REQUIRED or SYBIL_JAILED; null when allowed. Same code the room join fails with. A string, not an enum, because openapi-generator 7.25.0 csharp emits a non-nullable enum for a nullable one.'
        requiredNetWorthCents: { type: [integer, 'null'], format: int64 }
        netWorthCents: { type: integer, format: int64 }
        membershipRequired: { type: boolean }
        isMember: { type: boolean }
    CabalMembership:
      type: object
      required: [member, since, expiresAt, invitedByUserId, invitesRemaining, hostGateCents]
      properties:
        member: { type: boolean }
        since: { type: [string, 'null'], format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time, description: 'Membership lasts until season end.' }
        invitedByUserId: { type: [string, 'null'], format: uuid }
        invitesRemaining: { type: integer, minimum: 0 }
        hostGateCents: { type: integer, format: int64, description: 'Net worth a member needs to send invites.' }
    CabalInviteRequest:
      type: object
      required: [guestUserId]
      properties:
        guestUserId: { type: string, format: uuid }
    CabalInvite:
      type: object
      required: [inviteId, hostUserId, guestUserId, status, expiresAt, createdAt, usedAt]
      properties:
        inviteId: { type: string, format: uuid }
        hostUserId: { type: string, format: uuid }
        guestUserId: { type: string, format: uuid }
        status: { type: string, enum: [pending, accepted, expired, revoked] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        usedAt: { type: [string, 'null'], format: date-time }
    CabalInviteList:
      type: object
      required: [invites, nextCursor]
      properties:
        invites: { type: array, items: { $ref: '#/components/schemas/CabalInvite' } }
        nextCursor: { type: [string, 'null'] }

    # --- LLM NPC chat -------------------------------------------------------
    LlmChatRequest:
      type: object
      required: [archetype, message]
      properties:
        archetype: { type: string, enum: [ai_agent, sleuth] }
        message: { type: string, minLength: 1, maxLength: 500 }
        npcId: { type: string, description: 'The NpcState key the player tapped, if any.' }
    LlmQuota:
      type: object
      required: [perMinuteLimit, remainingThisMinute, perDayLimit, remainingToday, resetsAt]
      properties:
        perMinuteLimit: { type: integer, minimum: 0 }
        remainingThisMinute: { type: integer, minimum: 0 }
        perDayLimit: { type: integer, minimum: 0 }
        remainingToday: { type: integer, minimum: 0 }
        resetsAt: { type: string, format: date-time, description: 'Next UTC midnight.' }
    LlmChatReply:
      type: object
      required: [replyId, archetype, text, filtered, refused, refusalReasonId, aiGenerated, quota]
      properties:
        replyId: { type: string, format: uuid, description: 'Report target for POST /reports.' }
        archetype: { type: string, enum: [ai_agent, sleuth] }
        text: { type: string }
        filtered: { type: boolean, description: 'The output filter changed the text.' }
        refused: { type: boolean }
        refusalReasonId:
          type: [string, 'null']
          description: 'prompt_injection or moderation; null when not refused.'
        aiGenerated: { type: boolean, description: 'Always true; the client shows an AI label.' }
        quota: { $ref: '#/components/schemas/LlmQuota' }
        model: { type: string }
        promptTokens: { type: integer, minimum: 0 }
        completionTokens: { type: integer, minimum: 0 }

    # --- Verified X link ----------------------------------------------------
    XLink:
      type: object
      required: [userId, xUserId, xHandle, xAvatarUrl, verifiedAt]
      properties:
        userId: { type: string, format: uuid }
        xUserId: { type: string }
        xHandle: { type: string, minLength: 1, maxLength: 32, description: 'Without the leading @.' }
        xAvatarUrl: { type: string }
        verifiedAt: { type: string, format: date-time }
        refreshedAt: { type: [string, 'null'], format: date-time, description: 'Last time handle and avatar were re-read from X.' }
    XLinkStatus:
      type: object
      required: [link]
      properties:
        link:
          anyOf:
            - { $ref: '#/components/schemas/XLink' }
            - { type: 'null' }
    XLinkStart:
      type: object
      required: [authorizationUrl, state]
      properties:
        authorizationUrl: { type: string, format: uri }
        state: { type: string }

    # --- Smart Money copy trading -------------------------------------------
    SmartMoneyOptInRequest:
      type: object
      required: [optIn]
      properties:
        optIn: { type: boolean }
    SmartMoneyTrader:
      type: object
      required: [userId, alias, tribeId, pnl7dCents, winRateBps, tradeCount7d, copierCount, optedInAt]
      properties:
        userId: { type: string, format: uuid }
        alias: { type: string }
        tribeId: { type: string }
        pnl7dCents: { type: integer, format: int64 }
        winRateBps: { type: integer, minimum: 0, maximum: 10000 }
        tradeCount7d: { type: integer, minimum: 0 }
        copierCount: { type: integer, minimum: 0 }
        optedInAt: { type: string, format: date-time }
    SmartMoneyTraderList:
      type: object
      required: [traders, nextCursor]
      properties:
        traders: { type: array, items: { $ref: '#/components/schemas/SmartMoneyTrader' } }
        nextCursor: { type: [string, 'null'] }
    CopySubscriptionRequest:
      type: object
      required: [traderId, budgetCents, perTradeCapCents, copyRatioBps]
      properties:
        traderId: { type: string, format: uuid }
        budgetCents: { type: integer, format: int64, minimum: 1000 }
        perTradeCapCents: { type: integer, format: int64, minimum: 100 }
        copyRatioBps: { type: integer, minimum: 100, maximum: 10000 }
        copySells: { type: boolean, default: true }
    CopySubscription:
      type: object
      required:
        [
          subscriptionId,
          traderId,
          traderAlias,
          status,
          budgetCents,
          spentCents,
          perTradeCapCents,
          copyRatioBps,
          copySells,
          createdAt,
        ]
      properties:
        subscriptionId: { type: string, format: uuid }
        traderId: { type: string, format: uuid }
        traderAlias: { type: string }
        status: { type: string, enum: [active, paused, exhausted, stopped] }
        budgetCents: { type: integer, format: int64 }
        spentCents: { type: integer, format: int64 }
        perTradeCapCents: { type: integer, format: int64 }
        copyRatioBps: { type: integer, minimum: 100, maximum: 10000 }
        copySells: { type: boolean }
        createdAt: { type: string, format: date-time }
    CopySubscriptionList:
      type: object
      required: [subscriptions]
      properties:
        subscriptions: { type: array, items: { $ref: '#/components/schemas/CopySubscription' } }
    CopySubscriptionPatch:
      type: object
      minProperties: 1
      properties:
        status: { type: string, enum: [active, paused] }
        budgetCents: { type: integer, format: int64, minimum: 1000 }
        perTradeCapCents: { type: integer, format: int64, minimum: 100 }
        copyRatioBps: { type: integer, minimum: 100, maximum: 10000 }
        copySells: { type: boolean }
    CopiedTrade:
      type: object
      required: [copyTradeId, subscriptionId, coinId, side, status, reasonId, cashCents, units, tradeId, at]
      properties:
        copyTradeId: { type: string, format: uuid }
        subscriptionId: { type: string, format: uuid }
        coinId: { type: string, format: uuid }
        side: { type: string, enum: [buy, sell] }
        status: { type: string, enum: [executed, skipped] }
        reasonId:
          type: [string, 'null']
          description: 'For skipped copies: budget_exhausted, insufficient_cash, slippage_exceeded, coin_dead or no_position.'
        cashCents: { type: integer, format: int64 }
        units: { type: string, pattern: '^[0-9]+$' }
        tradeId: { type: [string, 'null'], format: uuid }
        at: { type: string, format: date-time }
    CopiedTradeList:
      type: object
      required: [trades, nextCursor]
      properties:
        trades: { type: array, items: { $ref: '#/components/schemas/CopiedTrade' } }
        nextCursor: { type: [string, 'null'] }
