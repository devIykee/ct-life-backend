  # ---------------------------------------------------------------------------
  # Phase 6 · LLM chat for the AI Agent and the Sleuth (#43)
  # ---------------------------------------------------------------------------
  /llm/chat:
    post:
      tags: [npcs]
      operationId: postLlmChat
      summary: Send one message to the AI Agent or the Sleuth.
      description: |
        Implemented on main @ 9f3e5ef behind `LLM_NPCS_ENABLED` (503
        `LLM_DISABLED` when off). Input and output pass the LLM chat filter
        (links, phone numbers, emails, wallet-shaped strings, profanity) and
        a prompt-injection check; only filtered text is stored. The client
        always labels replies as AI-generated (`aiGenerated`).

        Proposed changes to main: (1) a rate-limited request returns 429
        `RATE_LIMITED` with `retryAfterMs` instead of a 200 whose `response`
        is English refusal text; (2) a refused input stays 200 with
        `refused: true` and a stable `refusalReasonId`; (3) a per-day cap in
        addition to 5 per minute, reported in `quota`; (4) `message` max 500
        (main allows 1000); (5) `model` and token counts are optional, the
        client does not use them. Replies can be reported with rc1
        `POST /reports {targetType: 'npc_reply', targetId: replyId}` (new
        enum value, README).
      x-phase: 6
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LlmChatRequest' }
            example: { archetype: 'sleuth', message: 'Who bundled $FROGE?', npcId: 'npc_sleuth_1' }
      responses:
        '200':
          description: Reply (possibly a refusal)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LlmChatReply' }
              example:
                replyId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e50'
                archetype: 'sleuth'
                text: 'Three fresh wallets bought in the first tick. Follow the funding.'
                filtered: false
                refused: false
                refusalReasonId: null
                aiGenerated: true
                quota:
                  perMinuteLimit: 5
                  remainingThisMinute: 4
                  perDayLimit: 50
                  remainingToday: 41
                  resetsAt: '2026-10-09T00:00:00.000Z'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: LLM chat is switched off
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: 'LLM_DISABLED', message: 'LLM NPC chat is disabled.', details: {} } }

  /llm/quota:
    get:
      tags: [npcs]
      operationId: getLlmQuota
      summary: My remaining LLM chat quota.
      x-phase: 6
      responses:
        '200':
          description: Quota
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LlmQuota' }
              example:
                perMinuteLimit: 5
                remainingThisMinute: 5
                perDayLimit: 50
                remainingToday: 41
                resetsAt: '2026-10-09T00:00:00.000Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: LLM chat is switched off
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: 'LLM_DISABLED', message: 'LLM NPC chat is disabled.', details: {} } }

  # ---------------------------------------------------------------------------
  # Phase 6 · Verified X link (#44)
  # ---------------------------------------------------------------------------
  /x/link:
    get:
      tags: [identity]
      operationId: getXLink
      summary: My verified X link, if any.
      description: |
        Implemented on main @ 9f3e5ef (`{link}`; null when not linked).

        Display rules (X Developer Policy, opened 2026-10-07): show the
        current @handle and avatar together with the X logo; use the X name
        and logo only to identify X as the source; never imply X endorses CT
        Life; never reward or require any X action (no follows, likes, posts
        or quests). The link is display-only: no Sign in with X, no posting,
        no follower counts. Stored X data must be kept current and deleted
        within 24 hours of a deletion request (`DELETE /x/link`).
      x-phase: 6
      responses:
        '200':
          description: Link status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/XLinkStatus' }
              example:
                link:
                  userId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e00'
                  xUserId: '1712345678901234567'
                  xHandle: 'ctlife_anon'
                  xAvatarUrl: 'https://pbs.twimg.com/profile_images/1712345678901234567/abc_normal.jpg'
                  verifiedAt: '2026-10-08T12:00:00.000Z'
                  refreshedAt: '2026-10-08T12:00:00.000Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [identity]
      operationId: deleteXLink
      summary: Unlink X and delete the stored handle and avatar.
      description: |
        Not implemented on main @ 9f3e5ef. Deletes the row and purges cached
        avatars within 24 hours. Profiles stop showing the badge at once.
      x-phase: 6
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Unlinked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServerError' }

  /x/link/start:
    get:
      tags: [identity]
      operationId: getXLinkStart
      summary: Start the X OAuth 2.0 PKCE flow.
      description: |
        Implemented on main @ 9f3e5ef. Returns the X authorize URL (scopes
        `tweet.read users.read`, which X's mapping lists for
        `GET /2/users/me`). The client opens it in the system browser /
        Custom Tab, never a WebView. 503 `X_LINK_DISABLED` when the feature
        flag is off.
      x-phase: 6
      responses:
        '200':
          description: Authorize URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/XLinkStart' }
              example:
                authorizationUrl: 'https://x.com/i/oauth2/authorize?response_type=code&client_id=abc&redirect_uri=https%3A%2F%2Fapi.ctlife.dev%2Fv1%2Fx%2Flink%2Fcallback&scope=tweet.read%20users.read&state=Yk3vQ2&code_challenge=Zx9&code_challenge_method=S256'
                state: 'Yk3vQ2xN8pL4tR7wB1mC5dF0gH6jK9sA'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: X link is switched off
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: 'X_LINK_DISABLED', message: 'X link is disabled.', details: {} } }

  /x/link/callback:
    get:
      tags: [identity]
      operationId: getXLinkCallback
      summary: X's OAuth redirect target (server-side exchange, then back to the app).
      description: |
        X's docs say the authorization code is valid for 30 seconds and the
        `redirect_uri` must exactly match a registered callback URL. On main
        @ 9f3e5ef this route requires the player's Bearer token, so the code
        would travel browser → app → API inside that window. Proposed: X
        redirects straight here; the route is unauthenticated, finds the
        player by the single-use `state`, exchanges the code at once, then
        answers `302` to the app link in `Location` with `status` and never
        the code. The app learns the outcome from `x_link_update` on the
        city room or `GET /x/link`. README, B14.
      x-phase: 6
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string, maxLength: 1024 }
        - name: state
          in: query
          required: true
          schema: { type: string, maxLength: 64 }
        - name: error
          in: query
          required: false
          description: Set by X when the user cancels (e.g. `access_denied`).
          schema: { type: string }
      responses:
        '200':
          description: |
            Fallback page when the request asks for no redirect
            (`Accept: text/html` from a desktop browser during testing). It
            says the outcome and links back to the app; it never shows the
            code.
          content:
            text/html:
              schema: { type: string }
              example: '<!doctype html><title>CT Life</title><p>X linked. Return to CT Life.</p>'
        '302':
          description: Back to the app
          headers:
            Location:
              schema: { type: string }
              example: 'https://ctlife.dev/app/x-linked?status=linked'
        '400':
          description: Unknown or expired state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: 'VALIDATION_FAILED', message: 'Request body or params failed validation.', details: { 'reason': 'state_mismatch' } } }
        '409':
          description: This X account is linked to another player
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: 'X_ACCOUNT_ALREADY_LINKED', message: 'This X account is already linked to another player.', details: {} } }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: X link is switched off
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: 'X_LINK_DISABLED', message: 'X link is disabled.', details: {} } }

  # ---------------------------------------------------------------------------
  # Phase 2 · Smart Money copy trading (#21) — missing from rc1 and main
  # ---------------------------------------------------------------------------
  /me/smart-money:
    post:
      tags: [copy-trading]
      operationId: postMeSmartMoney
