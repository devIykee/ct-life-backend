                  - { perkId: 'pass_weekly_cash', kind: 'weekly_cash', cashCents: 500, itemId: null }
                  - { perkId: 'pass_badge_s1', kind: 'badge', cashCents: null, itemId: null }
                me:
                  owned: true
                  purchasedAt: '2026-10-06T10:00:00.000Z'
                  expiresAt: '2026-11-02T00:00:00.000Z'
                  intentId: '0192a1c2-7b3e-7c4d-8e5f-6a7b8c9d0e07'
