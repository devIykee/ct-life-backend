  /season-pass:
    get:
      tags: [seasons]
      operationId: getSeasonPass
      summary: The season pass offer, its perks and my status.
      description: |
        The pass costs 5 USDC (spec, Revenue lines) and is bought with the rc1
        flow `POST /payments/intents {kind: 'season_pass', sku, currency}`.
        Main @ 9f3e5ef instead debits $5 of Cash in `POST /season-pass/buy`
        (README, B4); this proposal does not contract that route.
      x-phase: 4
      responses:
        '200':
          description: Season pass
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeasonPass' }
              example:
                season:
                  seasonId: 's1'
                  name: 'Season 1'
                  startsAt: '2026-10-05T00:00:00.000Z'
                  endsAt: '2026-11-02T00:00:00.000Z'
                  weekIso: '2026-W41'
