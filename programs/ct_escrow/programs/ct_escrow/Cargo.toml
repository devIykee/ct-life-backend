[package]
name = "ct-escrow"
version = "0.1.0"
description = "CT Life paid-call escrow program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "ct_escrow"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
zeroize_derive = "<1.4"