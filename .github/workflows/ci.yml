name: ci

on:
  push:
    branches: [main, 'milestone/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # No `version:` here: package.json `packageManager` is the single source
      # (setting both makes pnpm/action-setup fail with "Multiple versions").
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install Java (openapi-generator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          save-only: true

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # No `version:` here: package.json `packageManager` is the single source
      # (setting both makes pnpm/action-setup fail with "Multiple versions").
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm docs:check
      - run: pnpm boundary:check

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # No `version:` here: package.json `packageManager` is the single source
      # (setting both makes pnpm/action-setup fail with "Multiple versions").
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    name: Unit tests
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ctlife
          POSTGRES_PASSWORD: ctlife
          POSTGRES_DB: ctlife_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ctlife -d ctlife_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://ctlife:ctlife@localhost:5432/ctlife_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      # No `version:` here: package.json `packageManager` is the single source
      # (setting both makes pnpm/action-setup fail with "Multiple versions").
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  contract-check:
    name: Contract check
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # No `version:` here: package.json `packageManager` is the single source
      # (setting both makes pnpm/action-setup fail with "Multiple versions").
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm contract:check

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    name: Integration tests
    needs: [lint, typecheck, unit, contract-check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ctlife
          POSTGRES_PASSWORD: ctlife
          POSTGRES_DB: ctlife_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ctlife -d ctlife_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://ctlife:ctlife@localhost:5432/ctlife_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      # No `version:` here: package.json `packageManager` is the single source
      # (setting both makes pnpm/action-setup fail with "Multiple versions").
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  # Runs nightly or manually. Hits external services (Helius, devnet airdrop).
  # Gated by ENABLE_E2E and RUN_MAINNET_TESTS so the default run never
  # touches mainnet.
  e2e-nightly:
    name: E2E / load / mainnet-read (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch' || github.event.schedule
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ctlife
          POSTGRES_PASSWORD: ctlife
          POSTGRES_DB: ctlife_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ctlife -d ctlife_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://ctlife:ctlife@localhost:5432/ctlife_test
      REDIS_URL: redis://localhost:6379/0
      ENABLE_E2E: '1'
      # RUN_MAINNET_TESTS stays off unless manually set in secrets.
      RUN_MAINNET_TESTS: ${{ secrets.RUN_MAINNET_TESTS || '0' }}
    steps:
      - uses: actions/checkout@v4
      # No `version:` here: package.json `packageManager` is the single source
      # (setting both makes pnpm/action-setup fail with "Multiple versions").
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
      - run: pnpm smoke
