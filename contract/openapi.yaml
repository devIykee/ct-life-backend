          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Paid call
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaidCall' }
              example:
                callId: '0192a1c2-...'
                status: 'live'
                minutesUsed: 5
                creatorAmount: '10000000'
                refundAmount: '0'

  /payments/intents:
    post:
      tags: [payments]
      operationId: postPaymentsIntents
      summary: Build a payment intent.
      description: |
        The intent locks in the live quote and the bonus bps at the time
        of creation. The client signs `tx` with MWA, polls
        `GET /payments/intents/{id}`, and the city room emits
        `payment_confirmed` once the on-chain transfer is verified.
      x-phase: 2
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, sku, currency]
              properties:
                kind: { type: string, enum: [topup, cosmetic, ad, season_pass] }
                sku: { type: string }
                currency: { type: string, enum: [USDC, SOL, SKR, ORE] }
            example:
              kind: 'topup'
              sku: 'whale'
              currency: 'USDC'
      responses:
        '200':
          description: Intent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
              example:
                intentId: '0192a1c2-...'
                currency: 'USDC'
                recipient: 'Dgw3c4GbQ...'
                mint: 'EPjFWdd5...'
                amount: '10000000'
                cashCents: 700000
                bonusBps: 0
                reference: 'ref_...'
                memo: '0192a1c2-...'
                tx: 'base64...'
                solanaPayUrl: 'solana:...'
                expiresAt: '2026-10-05T12:10:00.000Z'
        '429':
          description: Top-up cap reached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'TOPUP_CAP_REACHED',
                      message: '100 USDC of top-ups per wallet per day exceeded.',
                      details: { 'dayTotalCents': 1000000 },
                    },
                }
        '503':
          description: Price feed down
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'SERVER_BUSY',
                      message: 'Server is at capacity. Retry-After header carries the wait time.',
                      details: {},
                    },
                }

  /payments/intents/{id}:
    get:
      tags: [payments]
      operationId: getPaymentsIntentsId
      summary: Poll the intent status.
      x-phase: 2
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Intent
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [pending, confirmed, expired, failed] }
                  signature: { type: string, nullable: true }
              description: |
                Status wins over the clock: confirmed stays confirmed after the
                quote's expiry, and a pending intent with a reported signature
                stays pending while the server reconciles it from finalized chain
                data (reported signature + reference history).
        '410':
          description: Expired with no reported signature and nothing found on chain
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'PAYMENT_EXPIRED',
                      message: 'Payment intent expired before it was confirmed.',
                      details: {},
                    },
                }

