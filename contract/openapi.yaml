          required: [resumed, postId]
          properties:
            resumed: { type: boolean, description: 'An already-open shift was returned.' }
            postId:
              type: [string, 'null']
              description: 'The "Back to the trenches" post, when this start wrote one.'
    RektBurgerEnd:
      type: object
      required:
        [
          shiftId,
          paidCents,
          durationSec,
          minutes,
          careerXp,
          cappedCents,
          capRemainingCents,
          uniformGranted,
          endReason,
        ]
      properties:
        shiftId: { type: string, format: uuid }
        paidCents: { type: integer, description: 'Paid, after the daily cap.' }
        durationSec:
          {
            type: integer,
            description: Total time on the clock in seconds (at most the maximum shift).,
          }
        minutes:
          {
            type: integer,
            description: 'floor(durationSec / 60). Not a remainder: 65 s is minutes 1, durationSec 65.',
          }
        careerXp:
          {
            type: integer,
            description: Career XP added (time-based; 0 off a ladder,
            under the minimum or past the daily cap).,
          }
        cappedCents: { type: integer, description: 'Withheld by the daily cap.' }
        capRemainingCents: { type: integer }
        uniformGranted:
          {
            type: boolean,
            description: 'First counted shift only: the Rekt Burger Uniform cosmetic.',
          }
        endReason: { type: string, enum: [clock_out, auto, left] }
    RektBurgerLastShift:
      type: object
      required: [shiftId, endedAt, paidCents, durationSec, minutes, careerXp, endReason]
      properties:
        shiftId: { type: string, format: uuid }
        endedAt: { type: string, format: date-time }
        paidCents: { type: integer }
        durationSec: { type: integer, description: Total time on the clock in seconds. }
        minutes: { type: integer, description: 'floor(durationSec / 60).' }
        careerXp: { type: integer }
        endReason: { type: [string, 'null'], enum: [clock_out, auto, left, null] }
    RektBurgerCurrent:
      type: object
      required: [shift, lastShift]
      properties:
        shift: { allOf: [{ $ref: '#/components/schemas/RektBurgerShift' }], nullable: true }
        lastShift: { allOf: [{ $ref: '#/components/schemas/RektBurgerLastShift' }], nullable: true }
    RektBurger:
      type: object
      required:
        [
          jobId,
          name,
          venueId,
          propId,
          unlocked,
          reason,
          lockedHint,
          employed,
          stintShifts,
          netWorthCents,
          glowUpNetWorthCents,
          pay,
          counter,
          shift,
          uniformCosmeticId,
          hasUniform,
        ]
      properties:
        jobId: { type: string, enum: [rekt-burger] }
        name: { type: string }
        venueId: { type: string, description: 'The venue it sits in (the_trenches).' }
        propId: { type: string }
        unlocked: { type: boolean }
        reason: { type: string, nullable: true, enum: [trencher, broke, liquidated, null] }
        lockedHint:
          type: object
          nullable: true
          properties:
            cashCents: { type: integer }
            debtCents: { type: integer }
            brokeCashCentsAtMost: { type: integer }
            liquidationCashBelowCents: { type: integer }
        employed: { type: boolean }
        stintShifts: { type: integer }
        netWorthCents: { type: integer, description: 'Cash minus debt.' }
        glowUpNetWorthCents: { type: integer }
        pay:
          type: object
          properties:
            ratePerMinuteCents: { type: integer }
            maxShiftCents:
              { type: integer, description: The most one shift pays before the daily cap. }
            maxShiftSec: { type: integer }
            dailyCapCents: { type: integer }
            earnedTodayCents: { type: integer }
            remainingTodayCents: { type: integer }
            resetsAt: { type: string, format: date-time }
        counter:
          type: object
          description: Where to stand (island metres) to clock in.
          properties:
            x: { type: number }
            z: { type: number }
            radiusM: { type: number }
        shift: { allOf: [{ $ref: '#/components/schemas/RektBurgerShift' }], nullable: true }
        uniformCosmeticId: { type: string }
        hasUniform: { type: boolean }
    Job:
      type: object
      required: [careerId, level, xp]
      properties:
        careerId: { type: string }
        level: { type: integer, minimum: 1, maximum: 5 }
        xp: { type: integer, minimum: 0 }
    Shift:
      type: object
      required: [shiftId, miniGameIds, endsAt]
      properties:
        shiftId: { type: string }
        miniGameIds: { type: array, items: { type: string } }
        endsAt: { type: string, format: date-time }
    Gig:
      type: object
      required: [id, name, durationSec, payCents, cooldownSec]
      properties:
        id: { type: string }
        name: { type: string }
        durationSec: { type: integer }
        payCents: { type: integer }
        cooldownSec: { type: integer }
    ConfigResponse:
      type: object
      required:
        [version, minClientVersion, livePhase, degraded, capabilities, competitionCapabilities]
      properties:
        version: { type: string }
        minClientVersion: { type: string }
        livePhase:
          type: integer
          minimum: 1
          maximum: 6
          description: >-
            The release phase this deployment has opened. The client opens every app of a phase up
            to this number and shows "Coming soon" for the rest, instead of using its build default.
            Set by the server env `LIVE_PHASE` (1 to 6, default 1; any other value stops the API from
            starting).
        flags:
          type: object
          description: Remote switches the client reads without a release.
          properties:
            wireV3Kinds:
              type: boolean
              description: >-
                When true the client sends the v3 vehicle kinds (`sedan`, `taxi`, `police`,
                `pickup`, `van`, `bike`) instead of `compact` / `moped`. Default false; the
                server sets it with `WIRE_V3_KINDS`.
        degraded:
          type: array
          description: |
            List of features currently in degraded mode. Read on every
            `/config` response and disable those surfaces. Possible values:
            `voice`, `llm`, `feed`, `npc_density`, `venue_cap`, `board_refresh`,
            `smart_money`, `dms`, `ore_reader`, `signup`, `rate_limit`,
            `login`, `price_feed`, `helius`, `ledger_freeze`, `login_ip_only`.
          items: { type: string }
        venues: { type: object, additionalProperties: true }
        archetypes: { type: object, additionalProperties: true }
        tribes: { type: object, additionalProperties: true }
        careers: { type: object, additionalProperties: true }
        market: { type: object, additionalProperties: true }
        events: { type: object, additionalProperties: true }
        npc_lines: { type: object, additionalProperties: true }
        ads: { type: object, additionalProperties: true }
        ore: { type: object, additionalProperties: true }
        meta: { type: object, additionalProperties: true }
        characterPalettes:
          $ref: '#/components/schemas/CharacterPalettes'
        capabilities:
          type: object
          description: >-
            Finished-but-dark features this deployment has turned on. Set only by the server env
            `CAPABILITIES_ON` (comma list of the key names below). There are no code defaults:
            every key is always sent, `false` unless listed. Clients treat a missing block or key
            as off (fail closed) and withhold the app or control. A route whose capability is off
            answers `503 CAPABILITY_OFF`.
          required: [version, apps, features]
          properties:
            version: { type: integer, const: 2 }
            apps:
              type: object
              description: Phone apps; the client withholds the tile while false.
              required: [beef, builder, vc, predict]
              properties:
                beef: { type: boolean }
                builder: { type: boolean }
                vc: { type: boolean }
                predict: { type: boolean }
            features:
              type: object
              description: Features inside apps.
              required:
                [
                  beefVoting,
                  districtStandings,
                  seasonResults,
                  sybilBail,
                  sybilBarn,
                  cabalRevoke,
                  xUnlink,
                  worldEvents,
                  homeMove,
                  visitorPolicy,
                  nftGallery,
                  paidCalls,
                  creatorMode,
                  seasonPassPurchase,
                  factory,
                  projectHq,
                ]
              properties:
                beefVoting: { type: boolean }
                districtStandings: { type: boolean }
                seasonResults: { type: boolean }
                sybilBail: { type: boolean }
                sybilBarn: { type: boolean }
                cabalRevoke: { type: boolean }
                xUnlink: { type: boolean }
                worldEvents: { type: boolean }
                homeMove: { type: boolean }
                visitorPolicy: { type: boolean }
                nftGallery: { type: boolean }
                paidCalls: { type: boolean }
                creatorMode: { type: boolean }
                seasonPassPurchase: { type: boolean }
                factory: { type: boolean }
                projectHq: { type: boolean }
        competitionCapabilities:
          type: object
          description: >-
            Read by v1.2 competition clients. Derived from `CAPABILITIES_ON`: `beefChallenges`
            equals `capabilities.apps.beef`; `targetedCabalInvites` is true when `cabalInvites` is
            in the list.
          required: [version, beefChallenges, targetedCabalInvites]
          properties:
            version: { type: integer, const: 1 }
            beefChallenges: { type: boolean }
            targetedCabalInvites: { type: boolean }
        seasonPass:
          type: object
          description: >-
            The season pass on sale (unlock C1). Present only while capability
            `seasonPassPurchase` is on, the deployment is on devnet and a season is running;
            a missing key means "unavailable". Buy with `POST /payments/intents {kind:
            season_pass, sku, currency}`.
          required: [sku, priceUsdc, currency, seasonId, endsAt]
          properties:
            sku: { type: string, const: season_pass }
            priceUsdc: { type: string, description: 'USDC base units (6 decimals), e.g. 5000000.' }
            currency: { type: string, const: USDC }
            seasonId: { type: string }
            endsAt: { type: string, format: date-time }
    CharacterPalettes:
      type: object
      additionalProperties: false
      required: [version, models]
      properties:
        version: { type: integer, const: 1 }
        models:
          type: array
          description: Finite independent recolour choices bound to an authored head/body identity. A fresh server response confirms support; cache alone does not.
          items:
            type: object
            additionalProperties: false
            required: [headId, skinTones, hairIds, topIds, bottomIds, shoesIds, accIds]
            properties:
              headId: { type: string, enum: [head_ubc_m, head_ubc_f] }
