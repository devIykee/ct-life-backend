  /jobs/rekt-burger:
    get:
      tags: [work]
      operationId: getJobsRektBurger
      summary: 'Rekt Burger, the fallback job: unlocked?, why, pay, caps and my open shift.'
      description: >-
        Rekt Burger is our own parody fast-food brand. Trenchers have it from the start;
        everyone else unlocks it for good when Cash is at or below 0 while in debt (checked on
        this read and on shift start) or when a perp liquidation leaves Cash under
        `liquidationCashBelowCents`. A new unlock also arrives as the realtime `job_unlocked`.
        See `docs/CAREERS.md`.
      x-phase: 5
      responses:
        '200':
          description: Job state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RektBurger' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /jobs/rekt-burger/shift/start:
    post:
      tags: [work]
      operationId: postJobsRektBurgerShiftStart
      summary: 'Clock in at the Rekt Burger counter (idempotent while a shift is open).'
      description: >-
        Takes no body. The shift is a simple clock-in: the avatar works in 3D (client-side only)
        and pay builds by SERVER time, `ratePerMinuteCents` while the clock runs, up to the daily
        cap and `maxEndsAt`. The player may close the app. A new shift needs the server's own
        FRESH position for the player (street room, at most 30 s old) within `counter.radiusM` of
        the counter (`GET /jobs/rekt-burger` gives the counter), else `409 POSITION_UNKNOWN` or
        `409 COUNTER_TOO_FAR` (`details.distanceM`). Calling it again while a shift is open returns
        that shift with `resumed: true` and needs no position (so a relaunch can resume). The
        first shift after being out starts the employment and writes a "Back to the trenches"
        Timeline post (at most one per 24 hours). `403 JOB_LOCKED` when not unlocked; `409
        JOB_DAILY_CAP` when today's pay cap is already reached. Rate limited per player.
      x-phase: 5
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The open shift
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RektBurgerStart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Not unlocked (`JOB_LOCKED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: JOB_LOCKED
                  message: 'This job is not unlocked for you.'
                  details: { jobId: rekt-burger, cashCents: 500000, debtCents: 0 }
        '409':
          description: Daily pay cap reached (`JOB_DAILY_CAP`), no fresh position (`POSITION_UNKNOWN`) or too far from the counter (`COUNTER_TOO_FAR`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                cap:
                  value:
                    error:
                      code: JOB_DAILY_CAP
                      message: "You have earned today's maximum pay from this job."
                      details: { dailyCapCents: 4500, resetsAt: '2026-10-25T00:00:00.000Z' }
                far:
                  value:
                    error:
                      code: COUNTER_TOO_FAR
                      message: "The server's last position for you is too far from the Rekt Burger counter."
                      details: { radiusM: 25, distanceM: 140 }
                unknown:
                  value:
                    error:
                      code: POSITION_UNKNOWN
                      message: 'The server has no recent street position for the player.'
                      details: { reason: no fresh position }
        '429': { $ref: '#/components/responses/RateLimited' }

  /jobs/rekt-burger/shift/end:
    post:
      tags: [work]
      operationId: postJobsRektBurgerShiftEnd
      summary: Clock out; the server pays by the time on its clock.
      description: >-
        Takes no body (any field is ignored; there is no amount to send). Pay is
        `floor(seconds x ratePerMinuteCents / 60)` of the time since the shift started, capped at
        `maxShiftSec` and trimmed to what is left of the UTC-day cap (`cappedCents` is what the cap
        withheld). Ledger reason `job_rekt_burger`. A shift left running is closed and paid by the
        server at `maxEndsAt` (a per-minute worker, or on the next read), so the player does not have
        to come back; `endReason` is `clock_out`, `auto` or `left`. `careerXp` is time-based
        (`xpPerMinute`), only for a player on a career ladder, behind the shared daily action cap, and
        only for a shift of at least `minCountedSec` (so is the `shift_complete` quest, Season XP
        through it, and the Rekt Burger Uniform on the first such shift). Two ends racing pay once.
        `404` when there is no open shift (never started, or already ended). Needs no position.
      x-phase: 5
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Paid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RektBurgerEnd' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /jobs/rekt-burger/shift/current:
    get:
      tags: [work]
      operationId: getJobsRektBurgerShiftCurrent
      summary: My open shift (to restore after a relaunch) and my last paid shift.
      description: >-
        `shift` is the open shift with `accruedCents` (what clocking out at `serverNow` would pay,
        after the daily cap) or null. If the open shift ran to its maximum it is closed and paid first,
        so `shift` is null and `lastShift` shows what was paid (`endReason: auto`). Use `serverNow`
        for the on-screen timer, not the device clock.
      x-phase: 5
      responses:
        '200':
          description: Current shift
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RektBurgerCurrent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /jobs/rekt-burger/shift/finish:
    post:
      tags: [work]
      operationId: postJobsRektBurgerShiftFinish
      deprecated: true
      summary: Removed. The per-ticket minigame was replaced by the clock-in shift.
      description: >-
        Always answers `410 GONE` with `details.use` naming `POST /jobs/rekt-burger/shift/end`.
      x-phase: 5
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410':
          description: Gone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: GONE
                  message: 'This endpoint was removed; see details.use for its replacement.'
                  details: { use: '/jobs/rekt-burger/shift/end' }

  /jobs/rekt-burger/leave:
    post:
      tags: [work]
      operationId: postJobsRektBurgerLeave
      summary: 'Hang up the apron. Writes a "Glow-up" post if your net worth recovered.'
      description: >-
        Takes no body. A shift still open is clocked out and paid first (`endedShift`). If the stint began with net worth (Cash minus
        debt) below `glowUpNetWorthCents`, has at least one paid shift and ends at or above it,
        a "Glow-up" Timeline post is written (at most one per 24 hours). Harmless when you have
        no job.
      x-phase: 5
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Left
          content:
            application/json:
              schema:
                type: object
                required: [employed, wasEmployed, glowUp, postId, netWorthCents, endedShift]
                properties:
                  employed: { type: boolean, enum: [false] }
                  wasEmployed: { type: boolean }
                  glowUp: { type: boolean }
                  postId: { type: string, nullable: true }
                  netWorthCents: { type: integer }
                  endedShift:
                    allOf: [{ $ref: '#/components/schemas/RektBurgerEnd' }]
                    nullable: true
                    description: The open shift this paid on the way out, if there was one.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /shifts:
    post:
      tags: [work]
      operationId: postShifts
      summary: Start a shift.
      x-phase: 1
