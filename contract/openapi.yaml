        userId: { type: string, format: uuid }
        alias: { type: string }
        coinId: { type: string, format: uuid }
        side: { type: string, enum: [buy, sell] }
        cashCents: { type: integer }
        at: { type: string, format: date-time }
    BoardEntry:
      type: object
      required: [rank, userId, alias, value]
      properties:
        rank: { type: integer, minimum: 1 }
        userId: { type: string, format: uuid }
        alias: { type: string }
        value: { type: integer }
    Tombstone:
      type: object
      required: [userId, alias, lossCents, coinId, at]
      properties:
        userId: { type: string, format: uuid }
        alias: { type: string }
        lossCents: { type: integer }
        coinId: { type: string, format: uuid }
        at: { type: string, format: date-time }
    FeedPost:
      type: object
      required:
        [postId, userId, alias, text, createdAt, kind, isNpc, card, secondaryCard, verdict, social]
      properties:
        postId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        alias: { type: string, description: 'Character alias, or the NPC display name.' }
        text: { type: string, maxLength: 280 }
        createdAt: { type: string, format: date-time }
        kind:
          type: string
          enum: [player, sleuth, career, caller, checkin, launch, rug, liquidation, casino_win]
          description: >-
            `player` a normal post; `sleuth` an NPC exposé; `career` a server-written post about
            the author's own job; `caller` an NPC caller's call on a house coin (meta `persona`,
            `call: {entryMicros, targetX, stopPct}`); `checkin` an opt-in "is at <venue>";
            `launch`, `rug`, `liquidation`, `casino_win` city event cards (author "CT City").
            Clients should read unknown kinds as `player`.
        isNpc: { type: boolean, description: 'The city, the Sleuth or an NPC caller (NPC badge).' }
        district:
          type: string
          nullable: true
          description: The tribe district (districts.slug) the post counts for.
        meta: { type: object, nullable: true, additionalProperties: true }
        card:
          nullable: true
          description: The one action card (coin beats place).
          oneOf:
            - { $ref: '#/components/schemas/CoinCard' }
            - { $ref: '#/components/schemas/VenueCard' }
            - { $ref: '#/components/schemas/ProfileCard' }
        secondaryCard:
          nullable: true
          description: Sleuth posts and rug cards, the place pill next to the coin.
          allOf: [{ $ref: '#/components/schemas/VenueCard' }]
        verdict:
          type: object
          nullable: true
          description: A coin card whose coin the Sleuth exposed; the box under the post.
          properties:
            postId: { type: string, format: uuid }
            text: { type: string }
            sellSharePct: { type: integer, nullable: true }
        social:
          type: object
          nullable: true
          description: Launch cards. Faces only for people the reader follows (at most 3).
          properties:
            holders: { type: integer }
            followed:
              type: array
              items:
                type: object
                properties:
                  userId: { type: string, format: uuid }
                  alias: { type: string }
    TimelinePage:
      type: object
      required: [posts, nextBefore, quiet]
      properties:
        posts: { type: array, items: { $ref: '#/components/schemas/FeedPost' } }
        nextBefore: { type: string, format: date-time, nullable: true }
        quiet: { type: boolean, description: 'For you had no posts; these are recent city cards.' }
    CoinCard:
      type: object
      required:
        [type, coinId, ticker, name, stage, mcapCents, change5mBps, holders, rugged, dead, deepLink]
      properties:
        type: { type: string, enum: [coin] }
        coinId: { type: string, format: uuid }
        ticker: { type: string }
        name: { type: string }
        stage: { type: string }
        mcapCents: { type: string, description: 'Live at read time.' }
        change5mBps: { type: integer }
        holders: { type: integer }
        rugged:
          { type: boolean, description: 'Creator dump flagged, or the coin died: show RUGGED.' }
        dead: { type: boolean }
        deepLink: { type: string, example: 'ctlife://coin/018f...' }
    VenueCard:
      type: object
      required: [type, venueId, name, deepLink]
      properties:
        type: { type: string, enum: [venue] }
        venueId: { type: string, description: 'venues.json id, or rug_room for the casino.' }
        name: { type: string }
        deepLink: { type: string, example: 'ctlife://venue/terminal_cafe' }
    ProfileCard:
      type: object
      required: [type, userId, alias, deepLink]
      properties:
        type: { type: string, enum: [profile] }
        userId: { type: string, format: uuid }
        alias: { type: string }
        deepLink: { type: string, example: 'ctlife://profile/018f...' }
    Business:
      type: object
      required:
        [businessId, kindId, name, boughtAt, pendingCents, nextPayoutAt, sellBackCents, lastDay]
      properties:
        businessId: { type: string, format: uuid }
        kindId: { type: string }
        name: { type: string }
        boughtAt: { type: string, format: date-time }
        pendingCents: { type: integer, description: 'Payouts owed now; what collect would pay.' }
        nextPayoutAt: { type: string, format: date-time }
        sellBackCents: { type: integer }
        lastDay:
          oneOf:
            - { $ref: '#/components/schemas/BusinessDay' }
            - { type: 'null' }
    BusinessDay:
      type: object
      required: [kind, payCents, at]
      properties:
        kind: { type: string, enum: [normal, bad_day, great_day] }
        payCents: { type: integer }
        eventId: { type: string, description: 'Bad-day reason id from businesses.json badDays.' }
        at: { type: string, format: date-time, description: 'End of the payout period.' }
    DmThread:
      type: object
      required: [userId, alias, lastMessage, lastAt]
      properties:
        userId: { type: string, format: uuid }
        alias: { type: string }
        lastMessage: { type: string }
        lastAt: { type: string, format: date-time }
    DmMessage:
      type: object
      required: [messageId, fromUserId, toUserId, text, at]
      properties:
        messageId: { type: string }
        fromUserId: { type: string, format: uuid }
        toUserId: { type: string, format: uuid }
        text: { type: string, maxLength: 500 }
        at: { type: string, format: date-time }
    Space:
      type: object
      required: [spaceId, title, hostId, speakerIds, handIds, listenerCount]
      properties:
        spaceId: { type: string, format: uuid }
        title: { type: string }
        hostId: { type: string, format: uuid }
        speakerIds: { type: array, items: { type: string, format: uuid } }
        handIds: { type: array, items: { type: string, format: uuid } }
        listenerCount: { type: integer }
    CreatorProfile:
      type: object
      required: [enabled, ratePerMinUsdc, maxMinutes]
      properties:
        enabled: { type: boolean }
        ratePerMinUsdc: { type: string }
        maxMinutes: { type: integer }
    PaidCall:
      type: object
      required: [callId, status]
      properties:
        callId: { type: string, format: uuid }
        status: { type: string, enum: [awaiting_payment, ringing, live, settled, refunded] }
        minutesUsed: { type: integer }
        creatorAmount: { type: string, nullable: true }
        refundAmount: { type: string, nullable: true }
    AdBooking:
      type: object
      required: [bookingId, slotId, termId, uploadId, link, status, createdAt]
      properties:
        bookingId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        slotId: { type: string }
        termId: { type: string }
        uploadId: { type: string, format: uuid }
        link: { type: string }
        status:
          type: string
          enum: [awaiting_payment, pending_review, live, rejected, cancelled, expired]
        createdAt: { type: string, format: date-time }
        intentId: { type: string, format: uuid, nullable: true }
        priceCents: { type: integer, nullable: true }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }
        refund:
          type: object
          nullable: true
          properties:
            status: { type: string, enum: [due, refunded] }
            cents: { type: integer }
            signature: { type: string, nullable: true }
    PaymentIntent:
      type: object
      required: [intentId, currency, recipient, amount, reference, memo, tx, expiresAt]
      properties:
        intentId: { type: string, format: uuid }
        currency: { type: string, enum: [USDC, SOL, SKR, ORE] }
        recipient: { type: string }
        mint: { type: string, nullable: true }
        amount: { type: string }
        cashCents: { type: integer, description: 'For top-ups; null for cosmetic/ad/season_pass.' }
        bonusBps: { type: integer }
        reference: { type: string }
        memo: { type: string }
        tx: { type: string }
        solanaPayUrl: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time }
    ShopItem:
      type: object
      required: [id, slot, name, priceCents]
      properties:
        id: { type: string }
        slot: { type: string, enum: [skin, head, hair, top, bottom, shoes, acc] }
        name: { type: string }
        priceCents: { type: integer }
    Inventory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InventoryItem' }
    InventoryItem:
      type: object
      required: [itemId, slot, acquiredAt]
      properties:
        itemId: { type: string }
        slot: { type: string, enum: [skin, head, hair, top, bottom, shoes, acc] }
        acquiredAt: { type: string, format: date-time }
    ShopCatalog:
      type: object
      required: [items, lockerFeeCents, windows]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ShopCatalogItem' }
        lockerFeeCents: { type: integer, description: 'Cash fee for the lobby locker.' }
        windows:
          type: array
          items:
            type: object
            required: [id, minutes]
            properties:
              id: { type: string, enum: [asap, 30m, 1h] }
              minutes: { type: integer }
    ShopCatalogItem:
      type: object
      required: [itemId, category, name, priceCents, deliverable, placeable, footprint, modelKey]
      properties:
        itemId: { type: string }
        category: { type: string, enum: [furniture, decor, appliance, food, clothing] }
        name: { type: string }
        priceCents: { type: integer }
        deliverable: { type: boolean }
        placeable: { type: boolean }
        footprint:
          type: [object, 'null']
          description: 'Metres; null unless `placeable`.'
          required: [w, d, h]
          properties:
            w: { type: number }
            d: { type: number }
            h: { type: number }
        modelKey: { type: string, description: 'Frontend asset key.' }
    ChestRewards:
      type: object
      required: [cashCents, cosmetic]
      properties:
        cashCents: { type: integer }
        cosmetic:
          nullable: true
          description: A cosmetic granted on streak day 7, 14 and 30; null otherwise or when already owned.
          type: object
          required: [itemKey, name]
          properties:
            itemKey: { type: string }
            name: { type: string }
    DailyStatus:
      type: object
      required: [streakDay, claimedToday, nextResetAt, freezes, maxFreezes, freezePriceCents, chest]
      properties:
        streakDay: { type: integer }
        claimedToday: { type: boolean }
        nextResetAt: { type: string, format: date-time }
        freezes: { type: integer }
        maxFreezes: { type: integer }
        freezePriceCents: { type: integer }
        chest:
          type: object
          required: [day, rewards]
          properties:
            day: { type: integer }
            rewards: { $ref: '#/components/schemas/ChestRewards' }
    DailyClaim:
      allOf:
        - $ref: '#/components/schemas/DailyStatus'
        - type: object
          required: [alreadyClaimed, claimed, freezesUsed, reset]
          properties:
            alreadyClaimed: { type: boolean }
            claimed:
              type: object
              required: [day, rewards]
              properties:
                day: { type: integer }
                rewards: { $ref: '#/components/schemas/ChestRewards' }
            freezesUsed: { type: integer }
            reset: { type: boolean }
    QuestReward:
      type: object
      required: [cashCents, seasonXp]
      properties:
        cashCents: { type: integer }
        seasonXp: { type: integer }
    Quest:
      type: object
      required: [id, pool, title, verb, target, progress, completed, claimed, reward]
      properties:
        id: { type: string }
        pool: { type: string, enum: [starter, daily, weekly] }
        title: { type: string }
        description: { type: string, nullable: true }
        verb:
          type: string
          enum:
            [
              shift_complete,
              perp_open,
              perp_close,
              prediction_place,
              alpha_call,
              paid_call,
              tip_send,
              home_visit,
              shift_start,
              trade_open,
              chest_open,
            ]
        target: { type: integer }
        progress: { type: integer }
        completed: { type: boolean }
        claimed: { type: boolean }
        reward: { $ref: '#/components/schemas/QuestReward' }
        deepLink: { type: string, nullable: true, description: 'e.g. ctlife://jobs' }
        step:
          { type: integer, description: 'Weekly chain position, 1 to 5. Absent for daily quests.' }
    QuestsResponse:
      type: object
      required: [starter, daily, weekly]
      properties:
        starter:
          type: object
          required: [quests]
          properties:
            quests: { type: array, items: { $ref: '#/components/schemas/Quest' } }
        daily:
          type: object
          required: [date, resetsAt, quests]
          properties:
            date: { type: string, format: date }
            resetsAt: { type: string, format: date-time }
            quests: { type: array, items: { $ref: '#/components/schemas/Quest' } }
        weekly:
          type: object
          required: [week, resetsAt, quests]
          properties:
            week: { type: string, example: 2026-W43 }
            resetsAt: { type: string, format: date-time }
            quests: { type: array, items: { $ref: '#/components/schemas/Quest' } }
    PushPrefs:
      type: object
      required: [quietEnabled, quietStartHour, quietEndHour, tzOffsetMin, disabledTypes]
      properties:
        quietEnabled: { type: boolean }
        quietStartHour: { type: integer, minimum: 0, maximum: 23 }
        quietEndHour: { type: integer, minimum: 0, maximum: 23 }
        tzOffsetMin:
          { type: integer, minimum: -840, maximum: 840, description: 'Minutes east of UTC.' }
        disabledTypes:
          type: array
          items:
            type: string
            enum: [streak_ending, daily_clue, liquidated, home_visit, event_starting]
    CasinoMeta:
      type: object
      required: [disclaimer, sessionMinutes, sessionReminder]
      properties:
        disclaimer:
          type: string
          enum: ['Play money. No cash value. 18+']
          description: Show on every casino screen.
        sessionMinutes:
          type: integer
          description: Minutes of continuous play (a break over 10 minutes ends a session).
        sessionReminder:
          type: boolean
          description: True from 30 minutes of continuous play; show the take-a-break popup.
    CasinoRound:
      type: object
      required:
        [
          roundId,
          game,
          status,
          stakeCents,
          payoutCents,
          params,
          outcome,
          seedHash,
          seed,
          challengeId,
          createdAt,
          settledAt,
        ]
      properties:
        roundId: { type: string, format: uuid }
        game: { type: string, enum: [slots, crash, coinflip, coinflip_h2h] }
        status: { type: string, enum: [open, settled] }
        stakeCents: { type: integer }
        payoutCents: { type: integer, nullable: true, description: Null while open. }
        params:
          type: object
          description: >-
            Public inputs. Crash: `startedAtMs` (server epoch ms) and `growthPerSecond` for the
            open round, `autoCashout` when set. Coinflip: `side`.
          additionalProperties: true
        outcome:
          type: object
          nullable: true
          description: >-
            Null while open. Slots `{reels: [s, s, s], multiplier, winSymbol, jackpot}`; crash
            `{crashPoint, cashedOutAt, crashed, autoCashout?}`; coinflip `{side, result, won}`;
            head-to-head `{result, won, potCents, houseCutCents, winnerId, loserId}`.
          additionalProperties: true
        seedHash:
          { type: string, description: 'SHA-256 of `seed`, published when the round opens.' }
        seed: { type: string, nullable: true, description: Revealed once settled; null while open. }
        challengeId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        settledAt: { type: string, format: date-time, nullable: true }
    CasinoBetResult:
      allOf:
        - $ref: '#/components/schemas/CasinoMeta'
        - type: object
          required: [round, cashCents]
          properties:
            round: { $ref: '#/components/schemas/CasinoRound' }
            cashCents: { type: integer, description: Cash after this action. }
    CasinoChallenge:
      type: object
      required:
        [
          challengeId,
          role,
          challengerId,
          challengerAlias,
          opponentId,
          opponentAlias,
          challengerSide,
          status,
          seedHash,
          seed,
          result,
          winnerId,
          createdAt,
          expiresAt,
          settledAt,
        ]
      properties:
        challengeId: { type: string, format: uuid }
        role: { type: string, enum: [challenger, opponent], description: The caller's role. }
        challengerId: { type: string, format: uuid }
        challengerAlias: { type: string, nullable: true }
        opponentId: { type: string, format: uuid }
        opponentAlias: { type: string, nullable: true }
        challengerSide: { type: string, enum: [heads, tails] }
        status: { type: string, enum: [open, settled, expired, cancelled, declined] }
        seedHash: { type: string }
        seed: { type: string, nullable: true, description: Revealed once settled. }
        result: { type: string, enum: [heads, tails], nullable: true }
        winnerId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: 120 seconds after creation. }
        settledAt: { type: string, format: date-time, nullable: true }
    CasinoChallengeResult:
      allOf:
        - $ref: '#/components/schemas/CasinoMeta'
        - type: object
          required: [challenge, cashCents]
          properties:
            challenge: { $ref: '#/components/schemas/CasinoChallenge' }
            cashCents: { type: integer }
    CasinoState:
      allOf:
        - $ref: '#/components/schemas/CasinoMeta'
        - type: object
          required: [ageConfirmed, selfExcludedUntil, limits, today, games]
          properties:
            ageConfirmed: { type: boolean }
            selfExcludedUntil: { type: string, format: date-time, nullable: true }
            limits:
              type: object
              required: [minStakeCents, maxStakeCents, dailyStakeCapCents, dailyNetLossCapCents]
              properties:
                minStakeCents: { type: integer }
                maxStakeCents: { type: integer }
                dailyStakeCapCents: { type: integer }
                dailyNetLossCapCents: { type: integer }
            today:
              type: object
              required:
                [stakedCents, netLossCents, stakeRemainingCents, lossRemainingCents, resetsAt]
              properties:
                stakedCents: { type: integer }
                netLossCents: { type: integer }
                stakeRemainingCents: { type: integer }
                lossRemainingCents: { type: integer }
                resetsAt: { type: string, format: date-time }
            games:
              type: object
              required: [slots, crash, coinflip]
              properties:
                slots:
                  type: object
                  required: [reelWeights, paytable, rtp, hitRate]
                  properties:
                    reelWeights: { type: object, additionalProperties: { type: integer } }
                    paytable:
                      type: object
                      properties:
                        three: { type: object, additionalProperties: { type: number } }
                        two: { type: object, additionalProperties: { type: number } }
                    rtp: { type: number }
                    hitRate: { type: number }
                crash:
                  type: object
                  required: [growthPerSecond, maxMultiplier, minAutoCashout, rtp]
                  properties:
                    growthPerSecond: { type: number }
                    maxMultiplier: { type: number }
                    minAutoCashout: { type: number }
                    rtp: { type: number }
                coinflip:
                  type: object
                  required: [payoutMultiplier, rtp, h2hHouseCutBps, challengeTtlSeconds]
                  properties:
                    payoutMultiplier: { type: number }
                    rtp: { type: number }
                    h2hHouseCutBps: { type: integer }
                    challengeTtlSeconds: { type: integer }
    CashTip:
      type: object
      description: >-
        A tip row. New rows are on-chain notes (`kind: onchain`, `status: pending`, the Cash fields
        null). `kind: cash` rows exist only as history from before Cash became non-transferable.
      required: [tipId, fromUserId, toUserId, kind, status, createdAt]
      properties:
        tipId: { type: string, format: uuid }
        fromUserId: { type: string, format: uuid }
        toUserId: { type: string, format: uuid }
        kind: { type: string, enum: [cash, onchain] }
        amountCents: { type: [integer, 'null'], description: Old Cash tips only. }
        feeCents: { type: [integer, 'null'], description: Old Cash tips only. }
        receivedCents: { type: [integer, 'null'], description: Old Cash tips only. }
        amountLamports: { type: [string, 'null'] }
        mint: { type: [string, 'null'] }
        signature: { type: [string, 'null'] }
        message: { type: [string, 'null'] }
        status: { type: string, enum: [pending, confirmed, failed] }
        createdAt: { type: string, format: date-time }
    ShopOrder:
      type: object
      required:
        - orderId
        - status
        - window
        - destination
        - unitId
        - items
        - itemsCents
        - feeCents
        - totalCents
        - placedAt
        - etaAt
        - deliveredAt
        - cancelledAt
      properties:
        orderId: { type: string, format: uuid }
        status: { type: string, enum: [placed, out_for_delivery, delivered, cancelled] }
        window: { type: string, enum: [asap, 30m, 1h] }
        destination: { type: string, enum: [door, locker] }
        unitId: { type: [string, 'null'], description: 'The door; null for a locker.' }
        items:
          type: array
          items:
            type: object
            required: [itemId, name, qty, unitPriceCents]
            properties:
              itemId: { type: string }
              name: { type: string }
              qty: { type: integer }
              unitPriceCents: { type: integer }
        itemsCents: { type: integer }
        feeCents: { type: integer }
        totalCents: { type: integer }
        placedAt: { type: string, format: date-time }
        etaAt: { type: string, format: date-time }
        deliveredAt: { type: [string, 'null'], format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
    SeasonReward:
      type: object
      description: Exactly one of the three.
      properties:
        cashCents: { type: integer }
        cosmeticId: { type: string, description: 'A reward_* cosmetic id.' }
        furnitureItemId: { type: string, description: A shop_items id. }
    SeasonTier:
      type: object
      required: [tier, xpRequired, reward, status]
      properties:
        tier: { type: integer }
        xpRequired: { type: integer }
        reward: { $ref: '#/components/schemas/SeasonReward' }
        status: { type: string, enum: [locked, claimable, claimed, pass_required] }
    SeasonView:
      type: object
      required: [season, xp, tier, xpToNext, hasPass, tracks]
      properties:
        season:
          type: object
          required: [seasonId, name, startsAt, endsAt, xpPerTier]
          properties:
            seasonId: { type: string }
            name: { type: string }
            startsAt: { type: string, format: date-time }
            endsAt: { type: string, format: date-time }
            xpPerTier: { type: integer }
        xp: { type: integer }
        tier: { type: integer, description: Highest tier the XP reaches. }
        xpToNext: { type: [integer, 'null'] }
        hasPass: { type: boolean }
        tracks:
          type: object
          required: [free, paid]
          properties:
            free: { type: array, items: { $ref: '#/components/schemas/SeasonTier' } }
            paid: { type: array, items: { $ref: '#/components/schemas/SeasonTier' } }
    SeasonClaim:
      type: object
      required: [seasonId, track, tier, reward, alreadyClaimed, xp]
      properties:
        seasonId: { type: string }
        track: { type: string, enum: [free, paid] }
        tier: { type: integer }
        reward: { $ref: '#/components/schemas/SeasonReward' }
        alreadyClaimed: { type: boolean }
        xp: { type: integer }
    NodsBook:
      type: object
      required: [total, collected, sets]
      properties:
        total: { type: integer }
        collected: { type: integer }
        sets:
          type: array
          items:
            type: object
            required: [setId, name, reward, total, collected, completed, rewardGranted, nods]
            properties:
              setId: { type: string }
              name: { type: string }
              reward:
                type: object
                properties:
                  cosmeticId: { type: string }
              total: { type: integer }
              collected: { type: integer }
              completed: { type: boolean }
              rewardGranted: { type: boolean }
              nods:
                type: array
                items:
                  type: object
                  required: [nodId, name, tier, found, collectedAt]
                  properties:
                    nodId: { type: string }
                    name: { type: string }
                    tier: { type: string, enum: [A, B, C] }
                    found: { type: boolean }
                    collectedAt: { type: [string, 'null'], format: date-time }
    NodCollect:
      type: object
      required: [nodId, alreadyCollected, xp, set, setReward]
      properties:
        nodId: { type: string }
        alreadyCollected: { type: boolean }
        xp: { type: integer, description: Season XP awarded by this find. }
        set:
          type: object
          required: [setId, collected, total, completed]
          properties:
            setId: { type: string }
            collected: { type: integer }
            total: { type: integer }
            completed: { type: boolean }
        setReward:
          type: [object, 'null']
          description: Set when this find filled the set and granted its cosmetic.
          properties:
            setId: { type: string }
            cosmeticId: { type: string }
    HunterRow:
      type: object
      required: [rank, userId, alias, count]
      properties:
        rank: { type: integer }
        userId: { type: string, format: uuid }
        alias: { type: string }
        count: { type: integer }
    NodsLeaderboard:
      type: object
      required: [total, top, me]
      properties:
        total: { type: integer }
        top: { type: array, items: { $ref: '#/components/schemas/HunterRow' } }
        me:
          oneOf:
            - { $ref: '#/components/schemas/HunterRow' }
            - { type: 'null' }
    PlayerItem:
      type: object
      required:
        - itemInstanceId
        - itemId
        - name
        - category
        - modelKey
        - placeable
        - footprint
        - orderId
        - acquiredAt
        - placedHomeId
      properties:
        itemInstanceId: { type: string, format: uuid }
        itemId: { type: string }
        name: { type: string }
        category: { type: string, enum: [furniture, decor, appliance, food, clothing] }
        modelKey: { type: string }
        placeable: { type: boolean }
        footprint:
          type: [object, 'null']
          properties:
            w: { type: number }
            d: { type: number }
            h: { type: number }
        orderId: { type: [string, 'null'], format: uuid }
        acquiredAt: { type: string, format: date-time }
        placedHomeId: { type: [string, 'null'] }
    HomePlacements:
      type: object
      required: [homeId, placements]
      properties:
        homeId: { type: string }
        placements:
          type: array
          items:
            type: object
            required: [itemInstanceId, x, z, rotY, itemId, name, modelKey, footprint]
            properties:
              itemInstanceId: { type: string, format: uuid }
              x: { type: number }
              z: { type: number }
              rotY: { type: number, description: 'Yaw, radians.' }
              itemId: { type: string }
              name: { type: string }
              modelKey: { type: string }
              footprint:
                type: [object, 'null']
                properties:
                  w: { type: number }
                  d: { type: number }
                  h: { type: number }
    AdSlot:
      type: object
      required: [slotId, kind, terms]
      properties:
        slotId: { type: string }
        kind: { type: string }
        terms:
          type: array
          items:
            type: object
            required: [termId, priceUsdc]
            properties:
              termId: { type: string }
              priceUsdc: { type: number }
        nextFreeAt: { type: string, format: date-time, nullable: true }
    OreBoard:
      type: object
      required: [roundId, endsAt, endsAtSlot, squares, motherlodeOre, cityStakedOre, priceUsd]
      properties:
        roundId: { type: integer }
        endsAt: { type: string, format: date-time }
        endsAtSlot: { type: integer }
        squares:
          type: array
          minItems: 25
          maxItems: 25
          items:
            type: object
            required: [deployedLamports]
            properties:
              deployedLamports: { type: string }
        motherlodeOre: { type: string }
        cityStakedOre: { type: string }
        priceUsd: { type: string }
    OreMe:
      type: object
      required: [balance, staked, stOre, minerTier]
      properties:
        balance: { type: string }
        staked: { type: string }
        stOre: { type: string }
        minerTier: { type: string, enum: [none, prospector, miner, refiner] }
    ServerEvent:
      type: object
      required: [eventId, at]
      properties:
        eventId:
          {
            type: string,
            enum:
              [
                evt_liquidation,
                evt_rug,
                evt_coin_launch,
                evt_mood_change,
                evt_exploit,
                evt_ore_motherlode,
              ],
          }
        params: { type: object, additionalProperties: true }
        at: { type: string, format: date-time }
    WeeklyMeta:
      type: object
      required: [weekday, bonus]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6 }
        bonus: { type: string }
    CalendarEvent:
      type: object
      required:
        [
          slug,
          title,
          kind,
          startsAt,
          endsAt,
          city,
          realVenue,
          ingameVenueId,
          skinId,
          streamUrl,
          sourceUrl,
          irlCheckin,
          status,
        ]
      properties:
        slug: { type: string, example: breakpoint-2026 }
        title: { type: string }
        kind: { type: string, enum: [conference, hackathon, meetup] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        city: { type: string, example: London }
        realVenue: { type: string, example: Olympia London }
        ingameVenueId: { type: string, example: conference_hall }
        skinId: { type: string, example: london_2026 }
        streamUrl:
          { type: [string, 'null'], description: Link-out to the official stream; never embed. }
        sourceUrl: { type: string, description: The primary source for the dates. }
        irlCheckin: { type: boolean, description: True when the opt-in IRL check-in is available. }
        status: { type: string, enum: [upcoming, live, ended] }
    EventStepProgress:
      type: object
      required: [step, title, kind, required, done, complete]
      properties:
        step: { type: string }
        title: { type: string }
        kind: { type: string, enum: [interaction, trivia] }
        required: { type: integer }
        done: { type: integer }
        complete: { type: boolean }
        doneIds:
          type: array
          description: Interaction steps only (booths, nods). The ids the caller has already done.
          items: { type: string }
        questions:
          type: array
          description: Trivia steps only. Answers are never returned.
          items:
            type: object
            required: [id, prompt, choices, answered, triedChoices, retryAt]
            properties:
              id: { type: string }
              prompt: { type: string }
              answered: { type: boolean, description: True once answered right. }
              triedChoices:
                type: array
                description: Wrong choice ids already tried; they can not be tried again.
                items: { type: string }
              retryAt:
                type: [string, 'null']
                format: date-time
                description: When the next try is allowed; null when it is allowed now.
              choices:
                type: array
                items:
                  type: object
                  required: [id, label]
                  properties:
                    id: { type: string }
                    label: { type: string }
    EventQuestProgress:
      type: object
      required: [steps, completed, reward]
      properties:
        steps:
          type: array
          items: { $ref: '#/components/schemas/EventStepProgress' }
        completed: { type: boolean }
        reward:
          type: object
          required: [cashCents, itemKey, claimedAt]
          properties:
            cashCents:
              type: integer
              description: >-
                In-game Cash in cents, like every `*Cents` field: 20000 is $200 of play Cash,
                about two mid-level shifts. Paid once per player.
            itemKey: { type: [string, 'null'], example: lanyard_breakpoint_2026 }
            claimedAt: { type: [string, 'null'], format: date-time }
    CalendarEventDetails:
      allOf:
        - $ref: '#/components/schemas/CalendarEvent'
        - type: object
          required: [quest, irl]
          properties:
            quest: { $ref: '#/components/schemas/EventQuestProgress' }
            irl:
              type: object
              description: The caller's IRL check-in, to restore the UI after a relaunch.
              required: [available, checkedIn, checkedInAt, visible]
              properties:
                available: { type: boolean, description: The event has a geofence. }
                checkedIn: { type: boolean }
                checkedInAt: { type: [string, 'null'], format: date-time }
                visible:
                  { type: boolean, description: Whether the caller is on the attendee board. }
    EventProgressResult:
      allOf:
        - $ref: '#/components/schemas/EventQuestProgress'
        - type: object
          required: [slug, accepted, justCompleted]
          properties:
            slug: { type: string }
            accepted: { type: boolean, description: False for a replayed or no-op proof. }
            justCompleted:
              { type: boolean, description: True on the call that completed the chain and paid. }
    EventCheckinResult:
      type: object
      required: [slug, checkedIn, checkedInAt, visible, firstCheckin, reward]
      properties:
        slug: { type: string }
        checkedIn: { type: boolean, enum: [true] }
        checkedInAt: { type: string, format: date-time }
        visible: { type: boolean }
        firstCheckin: { type: boolean }
        reward:
          type: [object, 'null']
          description: Paid by this call; null on a repeat.
          required: [cashCents, itemKeys]
          properties:
            cashCents: { type: integer }
            itemKeys: { type: array, items: { type: string } }
    IrlAttendee:
      type: object
      required: [handle, self, alias, look, tribeId, avatarId, checkedInAt]
      properties:
        handle:
          type: string
          pattern: '^[A-Za-z0-9_-]{22}$'
          description: Opaque per-event handle for `POST /events/{slug}/irl/{handle}/dm`.
        self: { type: boolean, description: True for the caller's own row. }
        alias: { type: string }
        look: {}
        tribeId: { type: [string, 'null'] }
        avatarId: { type: [string, 'null'], description: The owned likeness avatar id, if any. }
        checkedInAt: { type: string, format: date-time }
    ModerationItem:
      type: object
      required: [id, targetType, targetId, reasonId, createdAt]
      properties:
        id: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        reasonId: { type: string }
        createdAt: { type: string, format: date-time }
    HomeSettings:
      type: object
      required: [visitors]
      additionalProperties: false
      properties:
        visitors:
          type: string
          enum: [open, followers, closed]
          description: '`open` (default), `followers` (mutual followers and guests only) or `closed` (owner only).'
    DistrictStandings:
      type: object
      required: [districtId, dayDate, rolloverAt, standings, myTribeId, myContribution]
      properties:
        districtId: { type: string }
        dayDate: { type: string, format: date }
        rolloverAt: { type: string, format: date-time }
        standings:
          type: array
          items:
            type: object
            required: [tribeId, score]
            properties:
              tribeId: { type: string }
              score: { type: integer }
        myTribeId: { type: [string, 'null'] }
        myContribution: { type: [integer, 'null'] }
    SeasonResult:
      type: object
      required: [seasonId, leagueId, finalRank, outcome, toLeagueId, rewards]
      properties:
        seasonId: { type: string }
        leagueId: { type: string }
        finalRank: { type: integer, minimum: 1 }
        outcome: { type: string, enum: [promoted, relegated, stayed] }
        toLeagueId: { type: [string, 'null'] }
        rewards:
          type: array
          items:
            type: object
            required: [kind, cashCents, itemId, badgeId]
            properties:
              kind: { type: string, enum: [cash, item, badge] }
              cashCents: { type: [integer, 'null'] }
              itemId: { type: [string, 'null'] }
              badgeId: { type: [string, 'null'] }
    WorldEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/WorldEvent' }
    WorldEvent:
      type: object
      required: [eventId, at, params]
      properties:
        eventId: { type: string, pattern: '^evt_[a-z0-9_]+$', description: 'From ids/events.json.' }
        at: { type: integer, description: Epoch ms when the server broadcast it. }
        params: { type: object, additionalProperties: { type: string } }
