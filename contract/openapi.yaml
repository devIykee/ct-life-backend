                endsAt: '2026-10-05T12:01:00.000Z'

  /shifts/{shiftId}/complete:
    post:
      tags: [work]
      operationId: postShiftsShiftIdComplete
      summary: Complete a shift with the per-mini-game scores.
      description: |
        Scores are capped at `maxScore` from `mini_games.json`. The shift
        cannot be completed before `endsAt` (returns `SHIFT_NOT_FINISHED`).
        XP and pay are derived from the scores and the level's pay formula.
      x-phase: 1
      parameters:
        - name: shiftId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [results]
              properties:
                results:
                  type: array
                  items:
                    type: object
                    required: [miniGameId, score]
                    properties:
                      miniGameId: { type: string }
                      score: { type: integer, minimum: 0 }
            example:
              results:
                - { miniGameId: 'discord_mod_ban', score: 8 }
      responses:
        '200':
          description: Pay and XP
          content:
            application/json:
              schema:
                type: object
                required: [payCents, xp, promoted]
                properties:
                  payCents:
                    { type: integer, description: 'Includes the ladder rank bonus, if any.' }
                  xp: { type: integer }
                  promoted: { type: boolean, description: 'The job level rose.' }
                  ladder:
                    type: object
                    description: >-
                      Present only when the shift's job is on the player's career ladder.
                      `bonusCents` is already inside `payCents`.
                    required: [ladderId, rank, title, bonusCents, xpAdded, promoted]
                    properties:
                      ladderId: { type: string }
                      rank: { type: integer }
                      title: { type: string }
                      bonusCents: { type: integer }
                      xpAdded: { type: integer }
                      promoted:
                        {
                          type: boolean,
                          description: 'The ladder rank rose (also sent as career_promoted).',
                        }
              example:
                payCents: 5500
                xp: 120
                promoted: false
        '400':
          description: Shift not finished or score invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'SHIFT_NOT_FINISHED',
                      message: 'Shift cannot be completed before durationSec has elapsed.',
                      details: { 'endsAt': '2026-10-05T12:01:00.000Z' },
                    },
                }

