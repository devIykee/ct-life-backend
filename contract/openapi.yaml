  /creator:
    put:
      tags: [voice]
      operationId: putCreator
      summary: Set the creator profile (paid-call rate and max minutes).
      description: |
        `ratePerMinUsdc` is a string of base units, between 250000 and
        50000000 (0.25 to 50 USDC). `maxMinutes` is 1 to 60.
      x-phase: 3
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, ratePerMinUsdc, maxMinutes]
              properties:
                enabled: { type: boolean }
                ratePerMinUsdc: { type: string, pattern: '^[0-9]+$' }
