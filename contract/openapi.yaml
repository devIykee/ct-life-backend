  /events/{slug}:
    get:
      tags: [liveops]
      operationId: getEventsSlug
      summary: One event with the caller's quest progress.
      description: >-
        `skinId` names the in-game venue skin (for example `london_2026` on the Conference
        Center). `streamUrl` is a link-out to the official stream; open it in the browser, never
        embed it; null until the organiser publishes one. Trivia answers are never returned.
        The answer also restores the caller's state after a relaunch: `quest.steps[].doneIds`
        (the booth or nod ids already done), the trivia `questions[]` state and `irl` (the
        caller's check-in).
      x-phase: 4
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarEventDetails' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{slug}/progress:
    post:
      tags: [liveops]
      operationId: postEventsSlugProgress
      summary: Advance the event quest chain with a proof.
      description: >-
        Steps run in order (`booths`, `trivia`, `nods` for Breakpoint 2026); a later step answers
        `EVENT_STEP_INVALID` (`reason: step_locked`) until the earlier ones are complete. For
        `booths` and `nods`, `proof.id` is the interaction id from the quest set; each id counts
        once and the server only checks that the id belongs to that step. It cannot prove the
        player stood there. For `trivia`, `proof.id` is the question id and `proof.answer` the
        choice id; it is checked against a server-only key. A right answer is final
        (`already_answered`). A wrong one is recorded (`400 EVENT_STEP_INVALID`, `reason:
        wrong_answer`, with `retryAfterSeconds` and `triedChoices`): that wrong choice can not be
        tried again on the question (`reason: already_tried`) and the question cools down for 60 s,
        then 10 min, then 60 min for the 1st, 2nd and 3rd wrong choice (`429 TRIVIA_COOLDOWN`,
        `details.retryAt`, `retryAfterSeconds`). Other questions are not affected, so a player who
        misses some can still reach the required number. The reward is still paid once per player.
        Only inside the event window.
        Idempotent: a proof already counted returns the progress with `accepted: false`.
        Completing the chain pays Cash (ledger reason `event_reward`) and grants the off-chain
        cosmetic once (`justCompleted: true` on that call). Rate limited per player (burst 8,
        then 1 call per 2 s).
      x-phase: 4
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step, proof]
              properties:
                step: { type: string, example: booths }
                proof:
                  type: object
                  required: [id]
                  properties:
                    id: { type: string, example: bp26.booth_1 }
                    answer: { type: string, example: a }
      responses:
        '200':
          description: Progress after this proof
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventProgressResult' }
        '400':
          description: Unknown step or id, step still locked, or a wrong or repeated trivia answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: EVENT_STEP_INVALID,
                      message: 'That quest step or proof is not valid for this event.',
                      details: { reason: step_locked, step: nods },
                    },
                }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The event is not live
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: EVENT_NOT_LIVE,
                      message: 'This event is not live; its quests only run inside its window.',
                      details: { slug: breakpoint-2026, status: upcoming },
                    },
                }
        '429':
          description: Rate limited, or the trivia question is cooling down after a wrong answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: TRIVIA_COOLDOWN,
                      message: 'That trivia question is cooling down after a wrong answer; try it again later.',
                      details:
                        {
                          step: trivia,
                          id: bp26.q_city,
                          retryAt: '2026-11-16T12:01:00.000Z',
                          retryAfterSeconds: 60,
                        },
                    },
                }

  /events/{slug}/checkin:
    post:
      tags: [liveops]
      operationId: postEventsSlugCheckin
      summary: Opt-in IRL check-in at the real venue (Breakpoint 2026).
      description: >-
        Send the phone's position once. The server compares it with the venue geofence (centre and
        radius in `calendar_events.json`, about 350 m around Olympia London) and discards it:
        coordinates are never stored, logged or echoed; only the fact of the check-in is kept.
        Only during the event window. Rejected with `CHECKIN_REJECTED` when `isMock` is true
        (`reason: mock_location`), `accuracyM` is above 150 (`poor_accuracy`), the account was
        created at or after the event start (`account_too_new`), the position is outside the
        geofence (`outside_geofence`) or the event has no geofence (`not_available`). The first
        accepted check-in per player per event pays a one-time reward: Cash (ledger reason
        `event_irl_bonus`, default 10000, env `EVENT_IRL_BONUS_CENTS`) and the off-chain
        cosmetics `irl_badge_breakpoint_2026` and `lanyard_breakpoint_2026_gold`. A repeat call
        returns the existing check-in with `firstCheckin: false` and pays nothing. A new check-in
        is hidden from the attendee board until the player opts in. At most 3 attempts per player
        per hour (`429`). The server cannot prove the phone is honest; see
        `docs/PRIVACY_IRL_CHECKIN.md`.
      x-phase: 4
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng, accuracyM, isMock]
              properties:
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
                accuracyM:
                  {
                    type: number,
                    minimum: 0,
                    description: 'Horizontal accuracy radius in metres from the OS.',
                  }
                isMock:
                  { type: boolean, description: 'The OS mock-location flag. true is rejected.' }
      responses:
        '200':
          description: Checked in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventCheckinResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The event is not live
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: EVENT_NOT_LIVE,
                      message: 'This event is not live; its quests only run inside its window.',
                      details: { slug: breakpoint-2026, status: upcoming },
                    },
                }
        '422':
          description: The check-in was not accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: CHECKIN_REJECTED,
                      message: 'The IRL check-in was not accepted.',
                      details: { reason: outside_geofence },
                    },
                }
        '429': { $ref: '#/components/responses/RateLimited' }

  /events/{slug}/checkin/visibility:
    put:
      tags: [liveops]
      operationId: putEventsSlugCheckinVisibility
      summary: Appear on, or leave, the IRL attendee board.
      description: >-
        Default is hidden. Needs a check-in (`404` otherwise). Turning visibility on tells the
        city (`irl_checkin`, alias only; never to a player who blocked the attendee or was blocked by them, and only while the event is live), at most once an hour per player.
      x-phase: 4
