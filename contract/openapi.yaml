  /market/coins:
    get:
      tags: [markets]
      operationId: getMarketCoins
      summary: List live coins filtered by stage.
      x-phase: 2
      parameters:
        - name: stage
          in: query
          required: false
          schema: { type: string, enum: [new, final, graduated, dead] }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Coins
          content:
            application/json:
              schema:
                type: object
