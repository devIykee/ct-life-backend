      x-phase: 4
      responses:
        '200':
          description: Caller state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FactoryMe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /factory/coins:
    post:
      tags: [markets]
      operationId: postFactoryCoins
      deprecated: true
      summary: 'Retired: answers 410 FACTORY_CASH_RETIRED. Use POST /factory/launch/prepare.'
      description: >-
        RETIRED 2026-10-26 (the Cash sandbox is gone; launches are real tokens). Every call
