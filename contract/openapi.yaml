      x-phase: 3
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Unfollowed }

  /dms:
    get:
      tags: [social]
      operationId: getDms
      summary: My inbox, one thread per peer with its newest message, newest first.
      description: Peers I blocked are left out. Up to 50 threads.
      x-phase: 3
      responses:
        '200':
