                      code: INSUFFICIENT_CASH,
                      message: 'Cash balance is insufficient.',
                      details: { have: '1200', need: '5500' },
                    },
                }
        '403':
          description: The caller is in CT Jail (`JAILED`); pay bail with `POST /heat/bail`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: JAILED,
                      message: 'You are in CT Jail. Pay bail or wait it out.',
