    post:
      tags: [work]
      operationId: postDailyFreeze
      summary: Buy a streak freeze with Cash.
      description: >-
        Debits `freezePriceCents` (ledger reason `streak_freeze`). At most `maxFreezes` (2) can
        be held. A freeze is consumed automatically by a claim that follows missed days.
      x-phase: 5
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: The new status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: Not enough Cash
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'INSUFFICIENT_CASH',
                      message: 'Cash balance is insufficient.',
                      details: { have: '1200', need: '5000' },
                    },
                }
        '409':
          description: Already holding the maximum
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: FREEZE_LIMIT_REACHED,
                      message: 'You already hold the maximum number of streak freezes.',
                      details: { max: 2 },
                    },
                }

  /me/first-session:
    post:
      tags: [player]
      operationId: postMeFirstSession
      summary: Report a first-session beat, skip it, or replay it.
      description: >-
        Exactly one of `{beat}`, `{skip: true}`, `{replay: true}`; anything else (an unknown beat,
        extra fields, two actions) is `400 VALIDATION_FAILED`. The reply is the new `FirstSession`
        (the same object as `GET /me` `flags.firstSession`). `beat` adds a beat (idempotent); the
        session becomes `done` when every applicable beat is in, where `trade` is applicable only
        while markets are live (`livePhase` 2 or more in `GET /config`); a `skipped` session only
        records the beat. `skip` sets `skipped`. `replay` sets `active`, clears the beats from
        `moved` on (`moved, shift, trade, quest, chest`), keeps `origin, character, home`, sets
        `startedAt` to now and `completedAt` to null; the starter quests are not reseeded. The server
        sets `origin` itself (on `POST /lottery/roll`), `character` (on character creation) and
        `shift`, `trade`, `chest` (from the same events as the starter quests); the client reports
        `home`, `moved` and `quest`. An account from before the release has no first session
        (it reads `done`), and `beat` and `skip` change nothing for it. Rate limited to 20 a minute.
      x-phase: 1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [beat]
                  properties:
                    beat:
                      {
                        type: string,
                        enum: [origin, character, home, moved, shift, trade, quest, chest],
                      }
                - type: object
                  additionalProperties: false
                  required: [skip]
                  properties:
                    skip: { type: boolean, enum: [true] }
                - type: object
                  additionalProperties: false
                  required: [replay]
                  properties:
                    replay: { type: boolean, enum: [true] }
      responses:
        '200':
          description: The first session after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirstSession' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /quests:
    get:
      tags: [work]
      operationId: getQuests
      summary: The starter quests, today's 3 daily quests and this week's chain of 5, with progress.
      description: >-
        The pick is deterministic per player and period (daily: user and UTC date; weekly: user
        and ISO week) from `contract/ids/quests.json`. Progress is advanced only by server
        events (a shift paid, a perp opened or closed, a prediction placed, an alpha call, a
        paid call accepted, a visit to someone else's home); the
        client never reports progress. Each change is also pushed live as the realtime
        `quest_progress`. Weekly quests have `step` 1 to 5, in rising reward. `starter` (listed
        first) holds the one-off starter quests (`pool: starter`) a NEW account is given once, never
        reseeded: First shift (`shift_start`: a Rekt Burger clock-in or `POST /shifts`), First trade
        (`trade_open`: a market buy or a perp open; only given while markets are live, `livePhase`
        2 or more) and GM (`chest_open`: the daily chest claim). Accounts from before the onboarding
        release get an empty `starter`. Claim them like any quest (`quest_reward` ledger, Season XP).
      x-phase: 5
      responses:
        '200':
          description: Quests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /quests/{id}/claim:
    post:
      tags: [work]
      operationId: postQuestsIdClaim
      summary: Claim a finished quest (idempotent).
      description: >-
        Pays `reward.cashCents` (ledger reason `quest_reward`) and records `reward.seasonXp` in
        `season_xp`. Takes no body. Only a quest in the caller's current picks can be claimed;
        any other id, including another player's, is `404`. A second claim returns
        `alreadyClaimed: true` and pays nothing.
      x-phase: 5
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: What was paid
          content:
            application/json:
              schema:
                type: object
                required: [questId, alreadyClaimed, reward]
                properties:
                  questId: { type: string }
                  alreadyClaimed: { type: boolean }
                  reward: { $ref: '#/components/schemas/QuestReward' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The target is not reached yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: QUEST_NOT_COMPLETE,
                      message: 'This quest is not finished yet.',
                      details: { questId: q_daily_shift_2, progress: 1, target: 2 },
                    },
                }

  /heat/me:
    get:
      tags: [markets]
      operationId: getHeatMe
      summary: My heat, level, police pursuit and CT Jail state (the HeatPlate).
      description: >-
        `heat` is 0..100 and halves every 24 hours. `level` is `cool` (under 10), `warm` (10),
        `hot` (35) or `wanted` (70 and up). `decayAt` is when the heat will have decayed below the
        floor of the current level (null when cool); `wantedUntil` is set only while `wanted` and is the
        later of `decayAt` and the end of the active pursuit. `pursuit` is the active police pursuit
        (null if none). `jail` is the current stay in CT Jail (venue `ct_jail`) with the bail in whole
        Cash cents (null if free). Parody, game Cash only. Rules and numbers: `docs/HEAT.md`.
      x-phase: 4
      responses:
        '200':
          description: Caller state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HeatMe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /heat/caught:
    post:
      tags: [markets]
      operationId: postHeatCaught
      summary: Report that a cruiser caught you (the server verifies it).
      description: >-
        The cruisers are client AI, so the server cannot see them; it judges the pursuit by the
        position hash and its own timers and will catch a player whose pursuit timer ends. This
        endpoint lets the client end it sooner. It is believed only when the pursuit is the caller's own
        and active (`NO_PURSUIT` otherwise), at least 10 seconds old, the server has a position for the
        player under 15 seconds old, and the reported `x`/`z` is within 15 metres of it
        (`CATCH_NOT_VERIFIED`, 422, with `details.reason` `too_early`, `position_unknown` or
        `position_mismatch`). At most 6 a minute. There is no endpoint to report an escape; the server
        decides that. On success the player is in CT Jail and the response is the new `HeatMe`.
      x-phase: 4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pursuitId, x, z]
              properties:
                pursuitId: { type: string, format: uuid }
                x: { type: number, description: 'Island metres.' }
                z: { type: number, description: 'Island metres.' }
      responses:
        '200':
          description: Jailed; the new state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HeatMe' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: There is no active pursuit for the caller with that id (`NO_PURSUIT`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: NO_PURSUIT,
                      message: 'There is no active police pursuit for you.',
                      details: {},
                    },
                }
        '422':
          description: The server could not verify the catch (`CATCH_NOT_VERIFIED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: CATCH_NOT_VERIFIED,
                      message: 'The server could not verify that the police caught you.',
                      details: { reason: 'position_mismatch' },
                    },
                }
        '429': { $ref: '#/components/responses/RateLimited' }
  /heat/bail:
    post:
      tags: [markets]
      operationId: postHeatBail
      summary: Pay bail and leave CT Jail.
      description: >-
        Debits the bail fixed at arrest (heat times 50 cents, at least 1,000; ledger reason
        `police_bail`, a Cash sink) and ends the stay. Idempotent per stay. Without bail the stay
        ends by itself when `jail.until` passes. While jailed the player cannot launch coins, buy,
        open perps, bet in the casino, drive or enter other venues (`403 JAILED`); selling, closing
        positions and reading stay open.
      x-phase: 4
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Released
          content:
            application/json:
              schema:
                type: object
                required: [released, bailCents, cashCents]
                properties:
                  released: { type: boolean, enum: [true] }
                  bailCents: { type: integer }
                  cashCents: { type: integer, description: 'Cash left.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: Not enough Cash for the bail (`INSUFFICIENT_CASH`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: INSUFFICIENT_CASH,
                      message: 'Cash balance is insufficient.',
                      details: { have: '1200', need: '4000' },
                    },
                }
        '409':
          description: The caller is not in CT Jail (`NOT_JAILED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                { error: { code: NOT_JAILED, message: 'You are not in CT Jail.', details: {} } }
  /factory/config:
