  /dms/{userId}:
    get:
      tags: [social]
      operationId: getDmsUserId
      summary: Messages with a user, newest last.
      x-phase: 3
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: before
          in: query
          required: false
          schema: { type: string, description: 'Cursor returned by a previous call.' }
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages: { type: array, items: { $ref: '#/components/schemas/DmMessage' } }
    post:
      tags: [social]
      operationId: postDmsUserId
      summary: Send a DM. 500 char cap. Blocked by the receiver returns 403.
      description: |
        `400 CONTENT_NOT_ALLOWED` (`details.field: dm`) when the text has a slur or strong profanity.
        `403 ACCOUNT_MUTED` (`details.until`) while the sender is muted; `403 ACCOUNT_BANNED` for a banned account.
      x-phase: 3
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DmMessage' }
        '403':
          description: Blocked by this user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error: { code: 'BLOCKED', message: 'You are blocked by this user.', details: {} },
                }

  /tips:
    post:
      tags: [social]
      operationId: postTips
      deprecated: true
      summary: Removed. Cash never moves between players.
      description: |
        Always answers `410 CASH_NOT_TRANSFERABLE`, whatever the body. Cash is purchasable, non-
        transferable, has no cash-out and never goes on-chain, so there are no Cash tips (and no
        tip fee). Remove the Cash tip sheet from the client. To thank a player, send an on-chain
        transfer from your wallet and record it with `POST /tips/onchain` (informational only).
      x-phase: 3
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410':
          description: Gone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: CASH_NOT_TRANSFERABLE
                  message: 'Cash never moves between players. This feature was removed; see details.reason.'
                  details: { reason: cash_tips_removed }

  /tips/onchain:
    post:
      tags: [social]
      operationId: postTipsOnchain
      summary: Record a note about an on-chain wallet-to-wallet transfer.
      description: |
        The value moves wallet to wallet, outside the game, in USDC or SOL. This only records a
        note (`status: pending`); nothing verifies it and it **never credits or moves any Cash**,
        for the sender or the recipient. Idempotent per `signature`.
      x-phase: 3
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toUserId, signature, amountLamports]
              properties:
                toUserId: { type: string, format: uuid }
                signature: { type: string, description: 'Solana transaction signature.' }
                amountLamports: { type: string, pattern: '^[0-9]+$' }
                mint: { type: [string, 'null'] }
                message: { type: string, maxLength: 200 }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashTip' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /nft/mint:
    post:
      tags: [shop]
      operationId: postNftMint
      summary: Mint a cosmetic as an NFT (only for items acquired on-chain).
      description: |
        Cash is purchasable but never converts to anything tradable. An item bought with Cash
        (inventory source `shop`) or earned in the game (`grant`) can never be minted: `403
        NFT_MINT_NOT_ALLOWED` (`details.reason` is `bought_with_cash` or `earned_in_game`). Only an
        item that was itself acquired on-chain (source `mint`) may be. The client does not call this
        today.
      x-phase: 5
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId: { type: string, format: uuid }
                network: { type: string, enum: [devnet, mainnet] }
      responses:
        '201': { description: Minted }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The item cannot be minted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: NFT_MINT_NOT_ALLOWED
                  message: 'This item cannot be minted as an NFT: it was not acquired on-chain.'
                  details: { itemId: '0192...', reason: bought_with_cash }
        '404': { $ref: '#/components/responses/NotFound' }

  /bank/repay:
    post:
      tags: [player]
      operationId: postBankRepay
      summary: Repay debt from Cash.
      description: |
        Moves `amountCents` from Cash onto debt in one ledger transaction
        (`loan_repay` on both accounts). An amount above the outstanding
        debt is capped to it; `repaidCents` is what was actually paid. A
        replayed Idempotency-Key never pays twice.
      x-phase: 3
      parameters:
