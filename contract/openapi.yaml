    get:
      tags: [work]
      operationId: getDailyStatus
      summary: gm streak status and the chest on offer.
      description: >-
        `streakDay` is the number of consecutive UTC days claimed up to now (0 when the streak
        is broken or never started; a missed day covered by a held freeze does not break it).
        `chest` is today's chest while `claimedToday` is false, tomorrow's after that. The
