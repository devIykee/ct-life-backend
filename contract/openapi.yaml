        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The challenge is no longer open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /casino/rounds:
    get:
      tags: [casino]
      operationId: getCasinoRounds
      summary: My round log (auditable).
      description: >-
        The caller's own rounds, newest first. `?mine` is accepted and implied: other players'
        rounds cannot be listed. `seedHash` is published when a round opens and `seed` is
        revealed once it settles; recompute `SHA-256(seed)` and the outcome as described in
        `docs/CASINO.md`. The seed of an open round is never returned.
      x-phase: 4
      parameters:
        - name: mine
          in: query
          required: false
          schema: { type: string, enum: ['true', '1', ''] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: before
          in: query
          required: false
          description: Return rounds created before this ISO time (the last row's `createdAt`).
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Rounds
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CasinoMeta'
                  - type: object
                    required: [rounds]
                    properties:
                      rounds:
                        type: array
                        items: { $ref: '#/components/schemas/CasinoRound' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /casino/rounds/{id}:
    get:
      tags: [casino]
      operationId: getCasinoRoundsId
      summary: One of my rounds.
      description: Owner only. Someone else's round answers `404`, the same as no round.
      x-phase: 4
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
