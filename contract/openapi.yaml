        '402':
          description: Insufficient cash
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /alpha-calls:
    get:
      tags: [markets]
      operationId: getAlphaCalls
      summary: Alpha calls by user.
      x-phase: 2
      parameters:
        - name: userId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Calls and trust score
          content:
            application/json:
              schema:
                type: object
                required: [calls, trustScore]
                properties:
                  calls:
                    type: array
                    items: { $ref: '#/components/schemas/AlphaCall' }
                  trustScore: { $ref: '#/components/schemas/TrustScore' }
    post:
      tags: [markets]
      operationId: postAlphaCalls
      summary: Post an alpha call.
      description: >-
        Calls are immutable; there is no delete endpoint. The stored entry is the coin's server
        price at placement (the body's `entryMicros` must be positive but is otherwise ignored).
        The call is accepted only while stopMicros < price < targetMicros; otherwise
        `VALIDATION_FAILED` with `details.reason` `price_outside_band` (and `details.priceMicros`),
        `unknown_coin` or `coin_dead`.
      x-phase: 2
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [coinId, entryMicros, targetMicros, stopMicros]
              properties:
                coinId: { type: string, format: uuid }
                entryMicros: { type: integer }
                targetMicros: { type: integer }
                stopMicros: { type: integer }
      responses:
        '200':
          description: Call
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlphaCall' }
        '400': { $ref: '#/components/responses/ValidationFailed' }

  /smart-money:
    get:
      tags: [markets]
      operationId: getSmartMoney
      summary: Recent trades of opted-in top traders.
      x-phase: 2
      responses:
        '200':
          description: Trades
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SmartMoneyTrade' }

  /users/{id}:
    get:
      tags: [social]
      operationId: getUser
      summary: Public profile of a user.
      x-phase: 1
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Public profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicProfile' }
        '404': { $ref: '#/components/responses/NotFound' }

  /blocks/{userId}:
    post:
      tags: [social]
      operationId: postBlocksUserId
      summary: Block a user.
      x-phase: 1
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Blocked }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [social]
      operationId: deleteBlocksUserId
      summary: Unblock a user.
      x-phase: 1
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Unblocked }

  /reports:
    post:
      tags: [social]
      operationId: postReports
      summary: Report content.
      x-phase: 1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, targetId, reasonId]
              properties:
                targetType:
                  { type: string, enum: [user, message, space, call, post, ad, npc_reply] }
                targetId: { type: string }
                reasonId: { type: string, enum: [spam, scam, harassment, impersonation, nsfw] }
                note: { type: string, maxLength: 500 }
            example:
              targetType: 'user'
              targetId: '0192a1c2-...'
              reasonId: 'harassment'
              note: 'harassing me in DMs'
      description: |
        At most 10 an hour per player (burst of 5): beyond that `429 RATE_LIMITED`. Reporting a target
        that you already have an open report on is a no-op (204). Reporting yourself is `400`.
        `npc_reply` reports an AI NPC chat reply: `targetId` is the `replyId` from `POST /llm/chat`,
        and only the player the reply was written for may report it (otherwise `400`,
        `details.reason: unknown_reply`).
      responses:
        '204': { description: Reported }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /leaderboards/{boardId}:
    get:
      tags: [social]
      operationId: getLeaderboard
      summary: A board, optionally scoped to friends or a league.
      x-phase: 1
      parameters:
        - name: boardId
          in: path
          required: true
          schema: { type: string, enum: [net_worth, weekly_pnl, weekly_return, clout, trust_score] }
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [global, friends, league] }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Board entries
          content:
            application/json:
              schema:
                type: object
                required: [entries, me]
                properties:
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/BoardEntry' }
                  me:
                    nullable: true
                    $ref: '#/components/schemas/BoardEntry'
              example:
                entries:
                  - { rank: 1, userId: '0192a1c2-...', alias: 'anon', value: 150000000 }
                  - { rank: 2, userId: '0192a1c3-...', alias: 'trencher', value: 95000000 }
                me: { rank: 17, userId: '0192a1c2-...', alias: 'anon', value: 1500000 }

  /rekt/tombstones:
    get:
      tags: [social]
      operationId: getRektTombstones
      summary: Recent liquidations, newest first.
      x-phase: 2
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
      responses:
        '200':
          description: Tombstones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tombstone' }

  /feed:
    get:
      tags: [social]
      operationId: getFeed
      summary: The Timeline (For you, Following, City). See docs/TIMELINE.md.
      x-phase: 3
      description: >-
        `foryou`: people, NPC callers and the Sleuth, with city event cards mixed in at most 1 in
        every 4 rows; when nobody has posted, the last 5 city cards and `quiet: true`. `following`:
        posts by the people and NPC callers the reader follows (no city cards). `city`: only city
        event cards (`launch`, `rug`, `liquidation`, `casino_win`), filtered by `type`. Authors the
        reader blocked are left out. The older `scope=global|following` maps to `foryou` and
        `following`.
      parameters:
        - name: tab
          in: query
          required: false
          schema: { type: string, enum: [foryou, following, city], default: foryou }
        - name: scope
          in: query
          required: false
          deprecated: true
          schema: { type: string, enum: [global, following] }
        - name: type
          in: query
          required: false
          description: City tab filter.
          schema: { type: string, enum: [all, launch, rug, liquidation, casino_win] }
        - name: before
          in: query
          required: false
          description: The previous page's `nextBefore`.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: One page of the tab.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimelinePage' }

  /feed/posts:
    post:
      tags: [social]
      operationId: postFeedPosts
      summary: Post to the in-game feed. (Not X; never awards real money for posting.)
      x-phase: 3
      description: |
        `400 CONTENT_NOT_ALLOWED` (`details.field: post`) for a slur or strong profanity; `403 ACCOUNT_MUTED` while muted.

        The server builds the action card: a coin card when the text names a real coin's `$TICKER`,
        otherwise a place card when `withPlace` is true and the server's position puts the author
        within 60 m of a venue door. The district the post counts for (tribe district rollover)
        also comes from the server's position. Never from the client. Per player: a burst of 3
        posts, then one every 20 s (`RATE_LIMITED`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 280 }
                withPlace: { type: boolean, description: 'Attach where you are (opt-in).' }
      responses:
        '201':
          description: Posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedPost' }
        '400':
          description: Validation failed, or the text is not allowed (`CONTENT_NOT_ALLOWED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: CONTENT_NOT_ALLOWED,
                      message: 'That text contains words that are not allowed.',
                      details: { field: post },
                    },
                }
        '403':
          description: Muted (`ACCOUNT_MUTED`, `details.until`) or banned (`ACCOUNT_BANNED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    { code: ACCOUNT_BANNED, message: 'This account has been banned.', details: {} },
                }

  /feed/checkins:
    post:
      tags: [social]
      operationId: postFeedCheckins
      summary: Opt-in check-in ("is at Terminal Café").
      x-phase: 3
      description: >-
        Only when the server's position puts the caller within 60 m of that venue's door
        (`VALIDATION_FAILED`, `reason: not_at_venue` otherwise; `unknown venue` for a bad id), at
        most once per 15 minutes (`RATE_LIMITED`). Nothing is ever posted automatically.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [venueId]
              properties:
                venueId: { type: string, example: terminal_cafe }
      responses:
        '201':
          description: The check-in post.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedPost' }

  /follows/{userId}:
    post:
      tags: [social]
      operationId: postFollowsUserId
      summary: Follow a user.
      x-phase: 3
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Followed }
    delete:
      tags: [social]
      operationId: deleteFollowsUserId
