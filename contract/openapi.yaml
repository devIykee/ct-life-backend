  /rtc/token:
    post:
      tags: [voice]
      operationId: postRtcToken
      summary: Mint a LiveKit access token.
      description: |
        Returns a token scoped to the room `{kind}:{id}`; `id` may be bare or
        carry its own single `{kind}:` prefix (Space ids are `space:<uuid>`),
        and a prefix of another kind is rejected. Grants are server-derived:
        for a Space, `canPublish` is true only for the host and promoted
        speakers, everyone else joins subscribe-only, and an ended, missing or
        blocked Space mints nothing (403/404). Space tokens last 10 minutes so
        each new token re-checks the role. Client permission flags are ignored.
        For `venue`, `id` is the venue instanceId (the Colyseus room id from
        `welcome`), and a token is minted only while the caller has a session
        in that venue room; otherwise 403 `NOT_IN_VENUE`. Join the venue room
        first, then ask for the token. Venue tokens last 10 minutes (needed only
        to connect; LiveKit refreshes a connected participant's token itself).
        Leaving the venue room with your last session disconnects you from its
        LiveKit room; ask for a new token on the next visit.
      x-phase: 3
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, id]
              properties:
                kind: { type: string, enum: [venue, space, call] }
                id: { type: string }
      responses:
        '200':
          description: Token
          content:
            application/json:
              schema:
                type: object
                required: [url, token, expiresAt, canPublish]
                properties:
                  url: { type: string }
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
                  canPublish: { type: boolean }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >-
            Not in that venue instance (`NOT_IN_VENUE`), or not a participant of the Space or
            call (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: NOT_IN_VENUE,
                      message: 'You are not in that venue. Join it before connecting to its voice.',
                      details: { instanceId: 'a1B2c3D4e' },
                    },
                }

