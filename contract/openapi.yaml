                    {
                      code: TICKER_TAKEN,
                      message: 'That ticker is already used by another coin.',
                      details: {},
                    },
                }
        '429':
          description: >-
            `LAUNCH_COOLDOWN` (10 minutes between launches) or `LAUNCH_LIMIT_REACHED`
