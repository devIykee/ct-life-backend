                    },
                }
        '403':
          description: AGE_REQUIRED, JAILED
        '409':
          description: TICKER_TAKEN, LAUNCH_LIMIT_REACHED
        '503':
          description: FACTORY_UNAVAILABLE
          content:
            application/json:
              example:
