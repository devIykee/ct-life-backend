                  nextCursor: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /market/coins/{coinId}:
    get:
      tags: [markets]
      operationId: getMarketCoin
      summary: Coin detail with candles and top holders.
      description: |
        `riskHint` is gated by the player's `security` skill. Low-skill
        players get a generic "do your own research" string; high-skill
        players get a more detailed rug-risk estimate.
      x-phase: 2
      parameters:
        - name: coinId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Coin detail
          content:
            application/json:
              schema:
                type: object
                required: [coin, candles1m, topHolders, riskHint]
                properties:
                  coin: { $ref: '#/components/schemas/Coin' }
                  candles1m:
                    type: array
                    items: { $ref: '#/components/schemas/Candle' }
                  topHolders:
                    type: array
                    items: { $ref: '#/components/schemas/Holder' }
                  riskHint: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /market/trades:
    post:
      tags: [markets]
      operationId: postMarketTrades
      summary: Buy or sell a coin.
      description: |
        Buy with `cashCents`, sell with `units`. The price is computed from
        the constant-product curve plus the buy/sell fee. If the executed
        price is worse than `maxSlippageBps` from the quote price, returns
        `SLIPPAGE_EXCEEDED`.
      x-phase: 2
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [coinId, side]
              properties:
                coinId: { type: string, format: uuid }
                side: { type: string, enum: [buy, sell] }
                cashCents: { type: integer, minimum: 0 }
                units: { type: string, description: 'Base units as a string.' }
                maxSlippageBps: { type: integer, minimum: 0, maximum: 10000 }
            example:
              coinId: '0192a1c2-...'
              side: 'buy'
              cashCents: 100000
              maxSlippageBps: 200
      responses:
        '200':
          description: Trade
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trade' }
              example:
                tradeId: 'trade_0192a1c2-...'
                units: '1000000'
                priceMicros: 15000
                feeCents: 100
                cashCents: 100000
        '400':
          description: Slippage exceeded or insufficient cash
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                SLIPPAGE_EXCEEDED:
                  value:
                    {
                      error:
                        {
                          code: 'SLIPPAGE_EXCEEDED',
                          message: 'Trade would execute at a worse price than your maxSlippageBps.',
                          details: { 'executedBps': 350 },
                        },
                    }
                INSUFFICIENT_CASH:
                  value:
                    {
                      error:
                        {
                          code: 'INSUFFICIENT_CASH',
                          message: 'Cash balance is insufficient.',
                          details: { 'shortfallCents': 100000 },
                        },
                    }

  /market/positions:
    get:
      tags: [markets]
      operationId: getMarketPositions
      summary: My positions with unrealized PnL.
      x-phase: 2
      responses:
        '200':
          description: Positions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Position' }

  /perps:
    get:
