            schema:
              type: object
              required: [toUserId, signature]
              properties:
                toUserId: { type: string, format: uuid }
                signature: { type: string, description: 'Solana transaction signature.' }
      responses:
        '204': { description: Recorded }

  /bank/repay:
    post:
      tags: [player]
      operationId: postBankRepay
      summary: Repay debt from Cash.
      description: |
        Moves `amountCents` from Cash onto debt in one ledger transaction
        (`loan_repay` on both accounts). An amount above the outstanding
        debt is capped to it; `repaidCents` is what was actually paid. A
        replayed Idempotency-Key never pays twice.
      x-phase: 3
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountCents]
              properties:
                amountCents: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Repaid
          content:
            application/json:
              schema:
                type: object
                required: [repaidCents, cashCents, debtCents]
                properties:
                  repaidCents: { type: integer }
                  cashCents: { type: integer }
                  debtCents: { type: integer }
        '402':
          description: Insufficient cash
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'INSUFFICIENT_CASH',
                      message: 'Cash balance is insufficient.',
                      details: { 'shortfallCents': 11000 },
                    },
                }
        '409':
          description: No debt outstanding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: NOTHING_TO_REPAY
                  message: There is no debt to repay.
                  details: {}

  /ledger:
    get:
      tags: [player]
      operationId: getLedger
      summary: My Cash history, newest first.
      description: |
        The Cash side of the ledger. `kind` is the ledger reason code
        (`topup`, `shift_pay`, `gig_pay`, `rent`, `tip`, `tip_out`,
        `trade_buy`, `trade_sell`, `perp_margin`, `perp_close`,
        `prediction`, `prediction_payout`, `business_pay`, `loan_repay`, ...);
        treat unknown kinds as generic and show `label`. Zero-amount rows
        are omitted. Pass `next` back as `before` for the next page; `next`
        is null on the last page.
      x-phase: 3
      parameters:
        - name: before
          in: query
          required: false
          schema: { type: string, pattern: '^[0-9]+$' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: A page of ledger entries
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LedgerItem' }
                  next: { type: string, nullable: true }

  /rtc/token:
    post:
      tags: [voice]
      operationId: postRtcToken
      summary: Mint a LiveKit access token.
      description: |
        Returns a token scoped to the room `{kind}:{id}`; `id` may be bare or
        carry its own single `{kind}:` prefix (Space ids are `space:<uuid>`),
        and a prefix of another kind is rejected. Grants are server-derived:
        for a Space, `canPublish` is true only for the host and promoted
        speakers, everyone else joins subscribe-only, and an ended, missing or
        blocked Space mints nothing (403/404). Space tokens last 10 minutes so
        each new token re-checks the role. Client permission flags are ignored.
      x-phase: 3
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, id]
              properties:
                kind: { type: string, enum: [venue, space, call] }
                id: { type: string }
      responses:
        '200':
          description: Token
          content:
            application/json:
              schema:
                type: object
                required: [url, token, expiresAt, canPublish]
                properties:
                  url: { type: string }
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
                  canPublish: { type: boolean }

