        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{slug}/irl:
    get:
      tags: [liveops]
      operationId: getEventsSlugIrl
      summary: Players who checked in at the venue and chose to be listed.
      description: >-
        Newest first, keyset paginated with `next`. Only players who opted in; anyone you blocked
        or who blocked you is left out. No location of any kind, and no user id: each row has an
        opaque per-event `handle` (an HMAC of the event and the user under a server key, not
        reversible, different at every event) that `POST /events/{slug}/irl/{handle}/dm` accepts.
      x-phase: 4
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: A page of attendees
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/IrlAttendee' }
                  next: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{slug}/irl/{handle}/dm:
    post:
      tags: [liveops]
      operationId: postEventsSlugIrlHandleDm
      summary: Message a listed attendee by their opaque handle.
      description: >-
        The caller must have checked in at the event. `handle` comes from `GET /events/{slug}/irl`.
        An unknown handle, a hidden attendee, someone you blocked or who blocked you, and your own
        handle all answer `404`, so the call reveals nothing about who is behind a handle; a
        caller who has not checked in gets `403`. The reply carries no user id. The text is
        delivered as an ordinary DM (`dm` realtime message), so the recipient sees who wrote, as with
        every DM. At most 10 messages an hour per player.
      x-phase: 4
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: handle
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{22}$' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '201':
          description: Sent
          content:
            application/json:
              schema:
                type: object
                required: [slug, sent, messageId, at]
                properties:
                  slug: { type: string }
                  sent: { type: boolean, enum: [true] }
                  messageId: { type: string, format: uuid }
                  at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/events/{slug}:
    put:
      tags: [admin]
      operationId: putAdminEventsSlug
      summary: Correct an event's dates, stream link or wording (admin only).
      description: >-
        Admin wallets only (`ADMIN_WALLETS`). Send any of the fields; `streamUrl` is `https://` or
        null. `geofence` sets the venue circle for the opt-in IRL check-in (all four fields,
        `lat` -90..90, `lng` -180..180, `radiusM` an integer 20..5000, `source` a non-empty
        citation) or removes it with null (check-in off). Omit it to leave it alone. Out-of-range
        values answer `VALIDATION_FAILED`. Once edited, the calendar file stops overwriting the
        event.
      x-phase: 4
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
                city: { type: string }
                realVenue: { type: string }
                streamUrl: { type: [string, 'null'] }
                sourceUrl: { type: string }
                geofence:
                  type: [object, 'null']
                  additionalProperties: false
                  required: [lat, lng, radiusM, source]
                  properties:
                    lat: { type: number, minimum: -90, maximum: 90 }
                    lng: { type: number, minimum: -180, maximum: 180 }
                    radiusM: { type: integer, minimum: 20, maximum: 5000 }
                    source: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: The updated event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarEvent' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /push/register:
    post:
      tags: [liveops]
      operationId: postPushRegister
      summary: Register a push token for the caller.
      description: >-
        Android and web devices send `fcmToken`; iOS sends `apnsToken`. A token belongs to
        exactly one account: registering a token that another account holds moves it to the
        caller in the same transaction, so the previous account can no longer receive pushes on
        this device. Call it on every sign-in, and call `DELETE` on sign-out.
      x-phase: 4
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform]
              properties:
                platform: { type: string, enum: [ios, android, web] }
                fcmToken: { type: string, nullable: true }
                apnsToken: { type: string, nullable: true }
                enabled: { type: boolean }
      responses:
        '201':
          description: The stored device row
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [liveops]
      operationId: deletePushRegister
      summary: Unregister a push token for the caller.
      description: >-
        Removes the given token (send exactly one of `fcmToken` for Android and web, `apnsToken` for iOS) from the caller's devices only. A token that belongs to someone else,
        or that does not exist, is left alone and the reply is the same `204`, so a token cannot
        be probed or deleted by guessing it. Call it on sign-out so the account stops receiving
        pushes on this phone.
      x-phase: 5
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Exactly one of `fcmToken` or `apnsToken`.
              properties:
                fcmToken: { type: string, minLength: 1, maxLength: 4096 }
                apnsToken: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '204': { description: Removed (or nothing to remove) }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /push/prefs:
    get:
      tags: [liveops]
      operationId: getPushPrefs
      summary: Quiet hours and per-type push opt-outs.
      description: >-
        Defaults when never set: quiet hours on, 22:00 to 08:00 at `tzOffsetMin` 0 (UTC). The
        client should PUT its own offset when the player grants the push permission. Push types:
        `streak_ending`, `daily_clue`, `liquidated`, `home_visit`, `event_starting`. A player
        receives at most 4 pushes per UTC day. Delivery is off until the server has Firebase
        credentials (docs/PUSH.md).
      x-phase: 5
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushPrefs' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [liveops]
      operationId: putPushPrefs
      summary: Replace the push preferences.
      x-phase: 5
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushPrefs' }
      responses:
        '200':
          description: Stored preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushPrefs' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/reports:
    get:
      tags: [admin]
      operationId: getAdminReports
      summary: The report review queue (admin).
      description: |
        Oldest first. Each row carries what was reported: `preview` is the DM or post text, or the
        player's alias for a user report, and `targetUserId` is who it is about. `openOnTarget`
        counts open reports on the same target. Page with `next` (pass it as `after`).
      x-phase: 6
      parameters:
        - {
            name: status,
            in: query,
            schema: { type: string, enum: [open, resolved, all], default: open },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - { name: after, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: Reports
          content:
            application/json:
              schema:
                type: object
                required: [reports, next]
                properties:
                  reports:
                    type: array
                    items:
                      type: object
                      required:
                        [
                          reportId,
                          reporterUserId,
                          targetType,
                          targetId,
                          reasonId,
                          createdAt,
                          openOnTarget,
                        ]
                      properties:
                        reportId: { type: integer }
                        reporterUserId: { type: string, format: uuid }
                        targetType:
                          { type: string, enum: [user, message, space, call, post, ad, npc_reply] }
                        targetId: { type: string }
                        reasonId: { type: string }
                        note: { type: [string, 'null'] }
                        createdAt: { type: string, format: date-time }
                        resolvedAt: { type: [string, 'null'], format: date-time }
                        action:
                          {
                            type: [string, 'null'],
                            enum: [dismiss, remove_content, mute, ban, null],
                          }
                        resolutionNote: { type: [string, 'null'] }
                        targetUserId: { type: [string, 'null'], format: uuid }
                        preview: { type: [string, 'null'] }
                        openOnTarget: { type: integer }
                  next: { type: [integer, 'null'] }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/reports/{reportId}/resolve:
    post:
      tags: [admin]
      operationId: postAdminReportResolve
      summary: Close a report and act on it (admin).
      description: |
        `dismiss` closes it. `remove_content` blanks the reported DM or post (`[removed]`).
        `mute` (`hours` 1..720, default 24) and `ban` act on the author of the reported
        content or the reported player. Every other open report on the same target is closed with
        the same action. An already closed report is `409 CONFLICT`. A muted player gets
        `403 ACCOUNT_MUTED` (`details.until`) on DMs, feed posts and room chat; a banned player gets
        `403 ACCOUNT_BANNED` on every request and cannot sign in.
      x-phase: 6
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              additionalProperties: false
              properties:
                action: { type: string, enum: [dismiss, remove_content, mute, ban] }
                hours: { type: integer, minimum: 1, maximum: 720 }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                type: object
                required: [action, targetUserId, closed]
                properties:
                  action: { type: string }
                  targetUserId: { type: [string, 'null'], format: uuid }
                  closed: { type: integer, description: Reports closed, this one included. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Report already resolved }

  /admin/users/{userId}/sanction:
    post:
      tags: [admin]
      operationId: postAdminUserSanction
      summary: Mute, unmute, ban or unban a player without a report (admin).
      x-phase: 6
      parameters:
