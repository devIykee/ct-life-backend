              properties:
                stakeCents: { type: integer, minimum: 100, maximum: 10000 }
                side: { type: string, enum: [heads, tails] }
      responses:
        '201':
          description: The settled round
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasinoBetResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: Not enough Cash
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: INSUFFICIENT_CASH,
                      message: 'Cash balance is insufficient.',
                      details: { have: '50', need: '500' },
                    },
                }
        '403': { $ref: '#/components/responses/CasinoRefused' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /casino/coinflip/challenges:
    post:
      tags: [casino]
      operationId: postCasinoCoinflipChallenges
      summary: Challenge a player to a head-to-head coinflip for bragging rights (no Cash).
      description: >-
        No Cash moves: Cash never goes between players, so a challenge has no stake, no escrow, no
        ledger row and no payout; the winner just gets the win. The challenged player has 120
        seconds to accept; then it expires. The coin comes from a seed committed in `seedHash` at
        creation and revealed when it settles. At most 5 open challenges per player. 18+ and
        self-exclusion apply; the daily stake caps do not (nothing is staked). A body with a
        `stakeCents` field is `400 VALIDATION_FAILED`.
      x-phase: 4
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [opponentUserId, side]
              properties:
                opponentUserId: { type: string, format: uuid }
                side: { type: string, enum: [heads, tails], description: The challenger's side. }
      responses:
        '201':
          description: The open challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasinoChallengeResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CasinoRefused' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [casino]
      operationId: getCasinoCoinflipChallenges
      summary: My challenges, incoming and outgoing.
      description: >-
        Newest first, last 50. Only challenges the caller takes part in are listed. Expired ones
        are closed before the list is built. The client polls this while in the Rug Room to see
        incoming challenges.
      x-phase: 4
      responses:
        '200':
          description: Challenges
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CasinoMeta'
                  - type: object
                    required: [challenges]
                    properties:
                      challenges:
                        type: array
                        items: { $ref: '#/components/schemas/CasinoChallenge' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /casino/coinflip/challenges/{id}/accept:
    post:
      tags: [casino]
      operationId: postCasinoCoinflipChallengesIdAccept
      summary: Accept a challenge (the challenged player only).
      description: >-
        Flips the coin from the committed seed and records the winner. No Cash moves and no
        `casino_rounds` row is written. A challenge older than 120 seconds is closed and answers
        `410 CHALLENGE_EXPIRED`. Someone
        who is not a participant gets `404`; the challenger gets `403`. The opponent must pass the
        same gates as for any stake.
      x-phase: 4
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The settled challenge (no Cash moved)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasinoChallengeResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CasinoRefused' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The challenge is no longer open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: CHALLENGE_NOT_OPEN,
                      message: 'This challenge is no longer open.',
                      details:
                        { challengeId: '0192e1f0-0000-7000-8000-000000000000', status: settled },
                    },
                }
        '410':
          description: The challenge expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: CHALLENGE_EXPIRED,
                      message: 'This challenge expired.',
                      details: { challengeId: '0192e1f0-0000-7000-8000-000000000000' },
                    },
                }
        '429': { $ref: '#/components/responses/RateLimited' }

  /casino/coinflip/challenges/{id}/decline:
    post:
      tags: [casino]
      operationId: postCasinoCoinflipChallengesIdDecline
      summary: Decline a challenge (the challenged player only).
      description: Closes the challenge. Nothing moves.
      x-phase: 4
      parameters:
        - name: id
          in: path
