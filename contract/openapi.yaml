                    error:
                      code: LAUNCH_COOLDOWN
                      message: 'Wait before launching another coin.'
                      details: { retryAfterMs: 412000 }
                dailyCap:
                  value:
                    error:
                      code: LAUNCH_LIMIT_REACHED
                      message: "You have reached today's coin launch limit."
                      details: { cap: 3, retryAfterMs: 3600000 }
    get:
