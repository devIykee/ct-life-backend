      x-phase: 5
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /daily/claim:
    post:
      tags: [work]
      operationId: postDailyClaim
      summary: Claim today's chest (idempotent per UTC day).
      description: >-
        Pays the chest in Cash (ledger reason `daily_streak`) and, on streak day 7, 14 and 30, a
        cosmetic through the cosmetics inventory with `source: grant`. Takes no body: the
        rewards and the day come from the server. A second claim on the same UTC day pays
        nothing and returns the first claim with `alreadyClaimed: true`. A missed day resets the
        streak to day 1 (`reset: true`) unless a held freeze covers every missed day, in which
        case the freezes are consumed (`freezesUsed`).
      x-phase: 5
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The claim and the new status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyClaim' }
        '401': { $ref: '#/components/responses/Unauthorized' }

