  /webhooks/helius/factory:
    post:
      tags: [markets]
      operationId: postHeliusFactoryWebhook
      summary: Helius raw webhook for our pools and creator wallets (trades, creator sells).
      description: >-
        Server-to-server. The Authorization header must equal HELIUS_FACTORY_WEBHOOK_AUTH (403
        otherwise). Body is the Helius raw delivery (an array of transactions); duplicates are
        ignored. A creator-wallet sell of a launched mint adds heat and, for 30% or more of
        their holding, one exposé post (penalties only); a transfer out adds a smaller heat.
      security: []
      x-phase: 4
      responses:
        '200': { description: '{processed, trades, creatorMoves}' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /market/coins:
    get:
