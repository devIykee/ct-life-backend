              hairIds: { type: array, items: { type: string }, uniqueItems: true }
              topIds: { type: array, items: { type: string }, uniqueItems: true }
              bottomIds: { type: array, items: { type: string }, uniqueItems: true }
              shoesIds: { type: array, items: { type: string }, uniqueItems: true }
              accIds: { type: array, items: { type: string, const: acc_none }, uniqueItems: true }
