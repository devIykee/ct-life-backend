        - { name: limit, in: query, required: false, schema: { type: integer, maximum: 200 } }
      responses:
        '200': { description: '{trades: [{signature, side, trader, tokens, sol, at}]}' }
  /factory/metadata/{id}:
    get:
      tags: [markets]
      operationId: getFactoryMetadata
      summary: Public token image or metadata JSON (metadata store `self`).
      security: []
      x-phase: 4
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The bytes (image/png or application/json) }
