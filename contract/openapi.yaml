        ticker is unique per cluster (TICKER_TAKEN); 3 launches per 24 h (LAUNCH_LIMIT_REACHED);
        5 prepares then 1 per 2 minutes (RATE_LIMITED). The image (PNG/JPEG/WebP, at most 2 MB,
        base64) is re-encoded to a 512x512 PNG and uploaded with the metadata JSON. Returns a
        legacy transaction: priority-fee instructions included, fee payer = the caller's wallet,
