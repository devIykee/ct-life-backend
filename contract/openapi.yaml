                  lastValidBlockHeight: { type: integer }
                  expiresAt: { type: string, format: date-time }
                  metadataUri: { type: string }
                  imageUri: { type: string }
        '400':
          description: VALIDATION_FAILED, NAME_NOT_ALLOWED, RISK_NOT_ACCEPTED
          content:
