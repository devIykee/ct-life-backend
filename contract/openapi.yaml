  /casino/state:
    get:
      tags: [casino]
      operationId: getCasinoState
      summary: Rug Room state, caps and paytables.
      description: >-
        Everything the UI needs before a bet: whether the caller confirmed 18+, the self-exclusion
        date, the daily stake and net-loss caps with what is left today (UTC day), the session
        length and the paytables with their RTP. Readable by a player who has not confirmed 18+
        so the client can show the age gate; nothing is staked. Play money only: Cash cannot be
        cashed out anywhere.
      x-phase: 4
      responses:
        '200':
          description: State
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasinoState' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /casino/slots/spin:
    post:
      tags: [casino]
      operationId: postCasinoSlotsSpin
      summary: Spin the slots.
      description: >-
        Three reels (rocket, diamond_hands, ape, laser_eyes, rug, wild). Debits the stake and
        pays any win in one transaction (ledger `casino_stake`, `casino_win`). The outcome comes
        from a server seed committed in `seedHash` and revealed in `seed` once the round settles;
        the client sends no outcome, seed or multiplier. RTP about 95%. Refused with `AGE_REQUIRED`
        unless 18+ is confirmed, `SELF_EXCLUDED`, `STAKE_CAP_REACHED`, `LOSS_CAP_REACHED`.
        Idempotent: a replayed key returns the same round and charges once.
      x-phase: 4
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [stakeCents]
              properties:
                stakeCents: { type: integer, minimum: 100, maximum: 10000 }
      responses:
        '201':
          description: The settled round
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasinoBetResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: Not enough Cash
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: INSUFFICIENT_CASH,
                      message: 'Cash balance is insufficient.',
                      details: { have: '50', need: '500' },
                    },
                }
        '403': { $ref: '#/components/responses/CasinoRefused' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /casino/crash/bet:
    post:
      tags: [casino]
      operationId: postCasinoCrashBet
      summary: Place a crash ("moon or rug") bet.
      description: >-
        The multiplier climbs along `e^(growthPerSecond * t)` from the round's start until it
        hits a crash point the server drew when the bet was placed (P(crash >= m) = 0.95 / m,
        capped at `maxMultiplier`). With `autoCashout` the round settles at once (win if the
        target is at or below the crash point) and the client animates the result. Without it the
        round is `open`: the answer carries `params.startedAtMs` and `params.growthPerSecond` for
        the animation but never the crash point or the seed, and the player cashes out with
        `POST /casino/crash/cashout`. One open crash round per player (`ROUND_IN_PROGRESS`); a
        round whose crash time has passed is closed as a loss by the next bet.
      x-phase: 4
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [stakeCents]
              properties:
                stakeCents: { type: integer, minimum: 100, maximum: 10000 }
                autoCashout:
                  type: number
                  minimum: 1.01
                  maximum: 100
                  description: Target multiplier with at most 2 decimals.
      responses:
        '201':
          description: The round (`settled` with an auto-cashout, else `open`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasinoBetResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: Not enough Cash
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: INSUFFICIENT_CASH,
                      message: 'Cash balance is insufficient.',
                      details: { have: '50', need: '500' },
                    },
                }
        '403': { $ref: '#/components/responses/CasinoRefused' }
        '409':
          description: A crash round is already open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: ROUND_IN_PROGRESS,
                      message: 'Finish your open crash round before starting another.',
                      details: {},
                    },
                }
        '429': { $ref: '#/components/responses/RateLimited' }

  /casino/crash/cashout:
    post:
      tags: [casino]
      operationId: postCasinoCrashCashout
      summary: Cash out of an open crash round.
      description: >-
        Decided by the server clock only: if the time since the round started has reached the
        crash point the round is lost (`200`, payout 0, `outcome.crashed: true`, the crash point
        and seed revealed); otherwise it pays the server's multiplier at that instant. Owner only
        (someone else's round is `404`). A round that already settled answers `409 ROUND_SETTLED`
        and pays nothing. Still allowed while self-excluded.
      x-phase: 4
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roundId]
              properties:
                roundId: { type: string, format: uuid }
      responses:
        '200':
          description: The settled round
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasinoBetResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The round is already settled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: ROUND_SETTLED,
                      message: 'This round is already settled.',
                      details: { roundId: '0192e1f0-0000-7000-8000-000000000000' },
                    },
                }
        '429': { $ref: '#/components/responses/RateLimited' }

  /casino/coinflip/bet:
    post:
      tags: [casino]
      operationId: postCasinoCoinflipBet
      summary: Flip a coin against the house.
      description: >-
        Call heads or tails. A win pays 1.9x the stake (RTP 95%), a loss pays nothing. Same
        rules, gates and commit-reveal as the slots.
      x-phase: 4
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [stakeCents, side]
              properties:
                stakeCents: { type: integer, minimum: 100, maximum: 10000 }
                side: { type: string, enum: [heads, tails] }
      responses:
        '201':
          description: The settled round
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasinoBetResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: Not enough Cash
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: INSUFFICIENT_CASH,
                      message: 'Cash balance is insufficient.',
                      details: { have: '50', need: '500' },
                    },
                }
        '403': { $ref: '#/components/responses/CasinoRefused' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /casino/coinflip/challenges:
    post:
      tags: [casino]
      operationId: postCasinoCoinflipChallenges
      summary: Challenge a player to a head-to-head coinflip.
      description: >-
        The challenger's stake is escrowed now (ledger `casino_stake`). The challenged player has
        120 seconds to accept; after that the stake is refunded (`casino_refund`). The winner is
        paid the pot minus a 5% house cut. The coin comes from a seed committed in `seedHash` at
        creation. At most 5 open challenges per player. Same gates as any stake.
      x-phase: 4
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [opponentUserId, stakeCents, side]
              properties:
                opponentUserId: { type: string, format: uuid }
                stakeCents: { type: integer, minimum: 100, maximum: 10000 }
                side: { type: string, enum: [heads, tails], description: The challenger's side. }
      responses:
        '201':
          description: The open challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasinoChallengeResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: Not enough Cash
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: INSUFFICIENT_CASH,
                      message: 'Cash balance is insufficient.',
                      details: { have: '50', need: '500' },
                    },
                }
        '403': { $ref: '#/components/responses/CasinoRefused' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [casino]
      operationId: getCasinoCoinflipChallenges
      summary: My challenges, incoming and outgoing.
      description: >-
        Newest first, last 50. Only challenges the caller takes part in are listed. Expired ones
        are refunded before the list is built. The client polls this while in the Rug Room to see
        incoming challenges.
      x-phase: 4
      responses:
        '200':
          description: Challenges
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CasinoMeta'
                  - type: object
                    required: [challenges]
                    properties:
                      challenges:
                        type: array
                        items: { $ref: '#/components/schemas/CasinoChallenge' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /casino/coinflip/challenges/{id}/accept:
    post:
      tags: [casino]
      operationId: postCasinoCoinflipChallengesIdAccept
      summary: Accept a challenge (the challenged player only).
      description: >-
        Debits the opponent's stake, flips the coin from the committed seed, pays the winner the
        pot minus 5% (ledger `casino_win`) and writes a `casino_rounds` row for each player. A
        challenge older than 120 seconds is refunded and answers `410 CHALLENGE_EXPIRED`. Someone
        who is not a participant gets `404`; the challenger gets `403`. The opponent must pass the
        same gates as for any stake.
      x-phase: 4
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The settled challenge and the caller's round
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CasinoChallengeResult'
                  - type: object
                    required: [round]
                    properties:
                      round: { $ref: '#/components/schemas/CasinoRound' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: Not enough Cash
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: INSUFFICIENT_CASH,
                      message: 'Cash balance is insufficient.',
                      details: { have: '50', need: '500' },
                    },
                }
        '403': { $ref: '#/components/responses/CasinoRefused' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The challenge is no longer open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: CHALLENGE_NOT_OPEN,
                      message: 'This challenge is no longer open.',
                      details:
                        { challengeId: '0192e1f0-0000-7000-8000-000000000000', status: settled },
                    },
                }
        '410':
          description: The challenge expired and the stake was refunded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: CHALLENGE_EXPIRED,
                      message: 'This challenge expired; the stake was refunded.',
                      details: { challengeId: '0192e1f0-0000-7000-8000-000000000000' },
                    },
                }
        '429': { $ref: '#/components/responses/RateLimited' }

  /casino/coinflip/challenges/{id}/decline:
    post:
      tags: [casino]
      operationId: postCasinoCoinflipChallengesIdDecline
      summary: Decline a challenge (the challenged player only).
      description: Refunds the challenger's escrowed stake (ledger `casino_refund`).
      x-phase: 4
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The closed challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasinoChallengeResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The challenge is no longer open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /casino/coinflip/challenges/{id}/cancel:
    post:
      tags: [casino]
      operationId: postCasinoCoinflipChallengesIdCancel
      summary: Cancel my open challenge (the challenger only).
      description: Refunds the escrowed stake (ledger `casino_refund`).
      x-phase: 4
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The closed challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasinoChallengeResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The challenge is no longer open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /casino/rounds:
    get:
      tags: [casino]
      operationId: getCasinoRounds
      summary: My round log (auditable).
      description: >-
        The caller's own rounds, newest first. `?mine` is accepted and implied: other players'
        rounds cannot be listed. `seedHash` is published when a round opens and `seed` is
        revealed once it settles; recompute `SHA-256(seed)` and the outcome as described in
        `docs/CASINO.md`. The seed of an open round is never returned.
      x-phase: 4
      parameters:
        - name: mine
          in: query
          required: false
          schema: { type: string, enum: ['true', '1', ''] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: before
          in: query
          required: false
          description: Return rounds created before this ISO time (the last row's `createdAt`).
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Rounds
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CasinoMeta'
                  - type: object
                    required: [rounds]
                    properties:
                      rounds:
                        type: array
                        items: { $ref: '#/components/schemas/CasinoRound' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /casino/rounds/{id}:
    get:
      tags: [casino]
      operationId: getCasinoRoundsId
      summary: One of my rounds.
      description: Owner only. Someone else's round answers `404`, the same as no round.
      x-phase: 4
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The round
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CasinoMeta'
                  - type: object
                    required: [round]
                    properties:
                      round: { $ref: '#/components/schemas/CasinoRound' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /casino/self-exclude:
    post:
      tags: [casino]
      operationId: postCasinoSelfExclude
      summary: Exclude myself from the casino for N days.
      description: >-
        New stakes are refused with `SELF_EXCLUDED` until the returned date. It can be extended
        by calling again with more days but never shortened or lifted early. An open crash round
        can still be cashed out and a pending challenge refunded. `days` is 1 to 365.
      x-phase: 4
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [days]
              properties:
                days: { type: integer, minimum: 1, maximum: 365 }
      responses:
        '200':
          description: The exclusion
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CasinoMeta'
                  - type: object
                    required: [selfExcludedUntil]
                    properties:
                      selfExcludedUntil: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUIDv4 generated by the client. The server dedupes for 24 h and
        replays the first response and status. Same key with a different
        body hash returns `VALIDATION_FAILED`. Concurrent requests with
        the same key are serialized.
      schema: { type: string, format: uuid }
    XClientVersion:
      name: X-Client-Version
      in: header
      required: false
      description: Client version. Below `minClientVersion` returns `CLIENT_OUTDATED`.
      schema: { type: string }
    XContractVersion:
      name: X-Contract-Version
      in: header
      required: false
      description: Optional override; defaults to the latest signed contract.
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the previous call.
      schema: { type: string }
  responses:
    LikenessUnavailable:
      description: Likeness pipeline is inactive; do not collect photos or initiate payment.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: LIKENESS_UNAVAILABLE
              message: Character likeness is not available yet. No photo or payment was accepted.
              details:
                reason: provider_not_configured
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error:
                { code: 'TOKEN_EXPIRED', message: 'Access token expired; refresh.', details: {} },
            }
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error:
                {
                  code: 'FORBIDDEN',
                  message: 'Caller is not allowed to perform this action.',
                  details: {},
                },
            }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: 'NOT_FOUND', message: 'Resource not found.', details: {} } }
    ValidationFailed:
      description: Body or params failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error:
                {
                  code: 'VALIDATION_FAILED',
                  message: 'Request body or params failed validation.',
                  details: { 'field': 'ageConfirmed' },
                },
            }
    CasinoRefused:
      description: >-
        The casino refused the stake: `AGE_REQUIRED` (18+ not confirmed), `SELF_EXCLUDED`,
        `STAKE_CAP_REACHED` or `LOSS_CAP_REACHED` (daily caps, UTC day). `details` carries the
        cap or the exclusion date.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            age:
              value:
                {
                  error:
                    {
                      code: AGE_REQUIRED,
                      message: 'The Rug Room is 18+. Confirm your age to play.',
                      details: {},
                    },
                }
            excluded:
              value:
                {
                  error:
                    {
                      code: SELF_EXCLUDED,
                      message: 'You have excluded yourself from the casino until the date shown.',
                      details: { until: '2026-11-01T12:00:00.000Z' },
                    },
                }
            stakeCap:
              value:
                {
                  error:
                    {
                      code: STAKE_CAP_REACHED,
                      message: 'This stake would pass your daily casino stake cap. Try again tomorrow (UTC).',
                      details:
                        {
                          capCents: 50000,
                          stakedCents: 49800,
                          resetsAt: '2026-10-25T00:00:00.000Z',
                        },
                    },
                }
            lossCap:
              value:
                {
                  error:
                    {
                      code: LOSS_CAP_REACHED,
                      message: 'This stake would pass your daily casino net-loss cap. Try again tomorrow (UTC).',
                      details:
                        {
                          capCents: 25000,
                          netLossCents: 24900,
                          resetsAt: '2026-10-25T00:00:00.000Z',
                        },
                    },
                }
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer, description: 'Seconds until retry.' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error:
                {
                  code: 'RATE_LIMITED',
                  message: 'Rate limit exceeded; try again later.',
                  details: { 'retryAfterMs': 1000 },
                },
            }
    ServerError:
      description: Server is at capacity or temporarily unavailable
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error:
                {
                  code: 'SERVER_BUSY',
                  message: 'Server is at capacity. Retry-After header carries the wait time.',
                  details: {},
                },
            }
  schemas:
    LikenessCheckoutStatus:
      type: object
      required: [intentId, modelId, status, entitlementId]
      properties:
        intentId: { type: string, format: uuid }
        modelId: { type: string }
        status: { type: string, enum: [pending, confirmed, expired, manual_review] }
        entitlementId: { type: [string, 'null'], format: uuid }
        resolution:
          {
            type: string,
            enum: [delivery_owed, delivered, manual_review, refunded, payment_review],
          }
    LikenessCheckoutQuote:
      type: object
      required:
        [
          intentId,
          modelId,
          currency,
          amountBaseUnits,
          amount,
          cluster,
          mint,
          recipient,
          reference,
          transactionBase64,
          expiresAt,
        ]
      properties:
        intentId: { type: string, format: uuid }
        modelId: { type: string }
        currency: { type: string, const: USDC }
        amountBaseUnits: { type: string, example: '3000000' }
        amount: { type: string, example: '3.000000' }
        cluster: { type: string, enum: [mainnet, devnet] }
        mint: { type: string }
        recipient: { type: string }
        reference: { type: string }
        transactionBase64: { type: string }
        expiresAt: { type: string, format: date-time }
    LikenessAvailability:
      type: object
      required:
        [
          enabled,
          reason,
          provider,
          photoUploadEnabled,
          price,
          modes,
          consentVersion,
          supportedModels,
        ]
      properties:
        checkoutAvailable: { type: boolean }
        entitlement:
          oneOf:
            - { type: 'null' }
            - type: object
              required: [id, source]
              properties:
                id: { type: string, format: uuid }
                source: { type: string, enum: [operator_evaluation, verified_purchase] }
        enabled: { type: boolean }
        reason: { type: [string, 'null'] }
        provider: { type: [string, 'null'] }
        photoUploadEnabled: { type: boolean }
        price:
          oneOf:
            - { type: 'null' }
            - type: object
              required: [amount, currency, display]
              properties:
                amount: { type: string, example: '3.00' }
                currency: { type: string, const: USDC }
                display: { type: string, example: '3.00 USDC' }
        modes: { type: array, items: { type: string, enum: [human, stylized] } }
        consentVersion: { type: string, const: likeness-v1 }
        supportedModels:
          type: array
          items:
            type: object
            required: [modelId, mode, enabled, reason]
            properties:
              modelId: { type: string }
              mode: { type: string, enum: [human, stylized] }
              enabled: { type: boolean }
              reason: { type: [string, 'null'] }
    LikenessRequest:
      type: object
      additionalProperties: false
      required: [modelId, uploadId, entitlementId, consent]
      properties:
        modelId: { type: string, pattern: '^[a-z][a-z0-9_]{1,63}$' }
        uploadId: { type: string, format: uuid }
        entitlementId: { type: string, format: uuid }
        consent:
          type: object
          additionalProperties: false
          required: [version, ownPhoto, shareWithProvider]
          properties:
            version: { type: string, const: likeness-v1 }
            ownPhoto: { type: boolean, const: true }
            shareWithProvider: { type: boolean, const: true }
    LikenessJob:
      type: object
      required:
        [id, modelId, mode, status, phase, referenceSha256, failureReason, createdAt, updatedAt]
      properties:
        source: { type: string, enum: [operator_evaluation, verified_purchase] }
        id: { type: string, format: uuid }
        modelId: { type: string }
        mode: { type: string, enum: [human, stylized] }
        status: { type: string, enum: [queued, processing, succeeded, failed, cancelled] }
        phase:
          {
            type: string,
            description: Durable pipeline phase; awaiting_reference_approval needs owner approval; awaiting_asset_validation is not playable completion; reconciliation_required must not be resubmitted.,
          }
        referenceSha256:
          { type: [string, 'null'], description: SHA-256 of the preview being approved }
        failureReason:
          {
            type: [string, 'null'],
            description: Stable sanitized reason; never provider response text,
          }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LikenessManifest:
      type: object
      required:
        [
          jobId,
          modelId,
          sha256,
          bytes,
          triangles,
          joints,
          humanoidBones,
          heightMeters,
          validatorVersion,
        ]
      properties:
        jobId: { type: string, format: uuid }
        modelId: { type: string }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        bytes: { type: integer, minimum: 1, maximum: 16777216 }
        triangles: { type: integer, minimum: 1, maximum: 12000 }
        joints: { type: integer, minimum: 15, maximum: 150 }
        humanoidBones: { type: object, additionalProperties: { type: string } }
        heightMeters: { type: number, const: 1.75 }
        validatorVersion: { type: string, const: ctlife-human-glb-v1 }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: 'One of the codes in contract/ids/errors.json.' }
            message: { type: string }
            details: { type: object, additionalProperties: true }
    AuthChallenge:
      type: object
      required: [nonce, domain, statement, uri, version, chainId, issuedAt, expirationTime]
      properties:
        nonce: { type: string }
        domain: { type: string }
        statement: { type: string }
        uri: { type: string, format: uri }
        version: { type: string }
        chainId: { type: string }
        issuedAt: { type: string, format: date-time }
        expirationTime: { type: string, format: date-time }
    AuthVerifyRequest:
      type: object
      required: [address, signedMessage, signature, nonce]
      properties:
        address: { type: string }
        signedMessage: { type: string }
        signature: { type: string, description: 'base64' }
        nonce: { type: string }
    AuthVerifyResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, wallet, isSeeker, hasCharacter]
      properties:
        id: { type: string, format: uuid }
        wallet: { type: string }
        isSeeker: { type: boolean }
        hasCharacter: { type: boolean }
        skrName: { type: string, nullable: true }
    Me:
      type: object
      required: [user, character, needs, skills, cashCents, debtCents, homeId, minerTier, flags]
      properties:
        user: { $ref: '#/components/schemas/User' }
        character: { $ref: '#/components/schemas/Character' }
        needs: { $ref: '#/components/schemas/Needs' }
        skills: { $ref: '#/components/schemas/Skills' }
        cashCents: { type: integer }
        debtCents: { type: integer }
        debtDueAt:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: Next instalment deadline (Sunday Unlock,
            Sun 20:00 UTC); null with no debt.,
          }
        debtWeeklyDueCents:
          {
            type: integer,
            nullable: true,
            description: Instalment due by debtDueAt,
            capped at debtCents; null with no debt.,
          }
        homeId: { type: string }
        home:
          oneOf:
            - $ref: '#/components/schemas/MeHome'
            - type: 'null'
          description: >-
            The current lease: the newest active or overdue home, else the newest evicted one;
            null for a player with no home (street).
        minerTier: { type: string, enum: [none, prospector, miner, refiner] }
        flags: { type: 'object', additionalProperties: true }
    Character:
      type: object
      required: [alias, look, tribeId, traitIds, dreamId]
      properties:
        likenessJobId:
          {
            type: [string, 'null'],
            format: uuid,
            description: Owned accepted personal avatar; stock Look remains its declared base.,
          }
        alias: { type: string }
        look: { $ref: '#/components/schemas/Look' }
        tribeId: { type: string }
        traitIds: { type: array, items: { type: string }, minItems: 2, maxItems: 2 }
        dreamId: { type: string }
    Look:
      type: object
      additionalProperties: false
