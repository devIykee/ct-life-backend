openapi: 3.1.0
info:
  title: CT Life REST API
  version: 1.0.0-rc1
  description: |
    REST v1 for the CT Life backend. Every endpoint is keyed by `x-phase` (1-6)
    and lists the error codes it can return, the auth policy, the idempotency
    contract, the headers it reads, and at least one example response.

    The contract is the source of truth; the Unity client consumes it. Breaking
    changes bump the major version; additive changes bump the minor version
    and are recorded in `contract/CHANGELOG.md`.

    All money is `bigint` cents (field names end in `Cents`) or string base
    units (token amounts). Times are ISO-8601 UTC for REST, epoch milliseconds
    for realtime. The week runs Mon 00:00 to Sun 23:59:59 UTC.
  contact:
    name: deviykee
    url: https://github.com/devIykee/ct-life-backend
  license:
    name: MIT
    url: https://github.com/devIykee/ct-life-backend/blob/main/LICENSE

servers:
  - url: https://api.ctlife.dev/v1
    description: prod
  - url: https://staging-api.ctlife.dev/v1
    description: staging
  - url: http://localhost:4010/v1
    description: local

tags:
  - name: auth
    description: Sign In With Solana, JWT, refresh, JWKS. Phases 1+.
  - name: player
    description: Profile, character, lottery, needs, homes. Phase 1+ except where noted.
  - name: work
    description: Careers, shifts, gigs, daily clue. Phase 1+ except where noted.
  - name: markets
    description: Coin trades, perps, predictions, alpha calls, smart money. Phase 2+.
  - name: social
    description: Public profile, blocks, reports, leaderboards, tombstones, feed, DMs, tips. Phase 1+ except where noted.
  - name: voice
    description: RTC tokens, spaces, free video calls, creator profile, paid calls. Phase 3+.
  - name: payments
    description: Top-up, cosmetic, ad booking, season pass intents. Phase 2+.
  - name: shop
    description: Shop, inventory. Phase 4+.
  - name: casino
    description: The Rug Room, a Cash-only play-money casino (18+). Phase 4+.
  - name: ads
    description: Ad slots, uploads, bookings, live creatives. Phase 5+.
  - name: ore
    description: ORE board, my ORE, stake transaction builder. Phase 2+.
  - name: liveops
    description: Active events, weekly meta, push registration. Phase 1+ except where noted.
  - name: admin
    description: Moderation, ad approval, force-price, skill overrides. Backend-only.
  - name: webhooks
    description: Helius and LiveKit signed webhooks. Backend-only.

security:
  - bearerAuth: []

paths:
  /likeness:
    get:
      tags: [player]
      operationId: getLikenessAvailability
      summary: Read paid likeness availability before character creation.
      description: Authenticated; no photo collection or payment. The current provider pipeline is inactive.
      x-phase: 1
      responses:
        '200':
          description: Availability and supported base identities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikenessAvailability' }
              example:
                enabled: false
                reason: provider_not_configured
                provider: null
                photoUploadEnabled: false
                price: { amount: '3.00', currency: USDC, display: '3.00 USDC' }
                modes: [human, stylized]
                consentVersion: likeness-v1
                supportedModels:
                  [
                    {
                      modelId: head_snow,
                      mode: human,
                      enabled: false,
                      reason: provider_not_configured,
                    },
                  ]
        '401': { $ref: '#/components/responses/Unauthorized' }
  /likeness/checkout:
    post:
      tags: [player]
      operationId: postLikenessCheckout
      summary: Create an immutable server-priced USDC payment quote.
      description: Disabled until public generation is configured and permitted. Wallet signs the returned unsigned transaction. Existing owed delivery blocks a new charge.
      x-phase: 1
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [modelId]
              properties:
                modelId: { type: string, enum: [head_snow, head_rain, head_ubc_m, head_ubc_f] }
      responses:
        '200':
          description: Immutable unsigned payment quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikenessCheckoutQuote' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /likeness/checkout/current:
    get:
      tags: [player]
      operationId: getCurrentLikenessCheckout
      summary: Resume owned payment and recover finalized reference payments after app termination.
      x-phase: 1
      responses:
        '200':
          description: Last owned active receipt or null
          content:
            application/json:
              schema:
                type: object
                required: [checkout]
                properties:
                  checkout:
                    oneOf:
                      - { type: 'null' }
                      - { $ref: '#/components/schemas/LikenessCheckoutStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /likeness/checkout/{id}:
    get:
      tags: [player]
      operationId: getLikenessCheckout
      summary: Verify the owned finalized payment and report delivery state.
      x-phase: 1
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Owned receipt state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikenessCheckoutStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /likeness/checkout/{id}/submitted:
    post:
      tags: [player]
      operationId: submitLikenessPaymentSignature
      summary: Record a wallet signature; only finalized verified payment grants entitlement.
      x-phase: 1
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [signature]
              properties:
                signature: { type: string, pattern: '^[1-9A-HJ-NP-Za-km-z]{64,88}$' }
      responses:
        '200':
          description: Verified or pending owned receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikenessCheckoutStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /likeness/jobs:
    get:
      tags: [player]
      operationId: listLikenessJobs
      summary: Resume up to twenty owned jobs, including while new generation is disabled.
      x-phase: 1
      responses:
        '200':
          description: Owned jobs and accepted selection
          content:
            application/json:
              schema:
                type: object
                required: [jobs, acceptedJobId]
                properties:
                  jobs: { type: array, items: { $ref: '#/components/schemas/LikenessJob' } }
                  acceptedJobId: { type: [string, 'null'], format: uuid }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [player]
      operationId: postLikenessJob
      summary: Reserve one generation job against a verified likeness purchase.
      description: |
        Requires a server-verified dedicated purchase and verified owned private upload.
        Server derives mode from the approved model registry. No image URL, payment claim,
        provider key or user ID is accepted. The current production composition returns 503
        and never uploads, charges or submits generation. Durable per-owner idempotency
        outlives the generic response cache; each entitlement can create only one job.
      x-phase: 1
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LikenessRequest' }
      responses:
        '202':
          description: The durable job, including the same job on an identical retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikenessJob' }
              example:
                {
                  id: '00000000-0000-4000-8000-000000000001',
                  modelId: head_snow,
                  mode: human,
                  status: queued,
                  phase: sources,
                  referenceSha256: null,
                  failureReason: null,
                  createdAt: '2026-10-11T12:00:00Z',
                  updatedAt: '2026-10-11T12:00:00Z',
                }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/LikenessUnavailable' }
  /likeness/jobs/{id}:
    get:
      tags: [player]
      operationId: getLikenessJob
      summary: Read an owned likeness job.
      description: Does not expose private upload keys, provider credentials, payment proof or another user's job. Owned status remains readable when new generation is disabled.
      x-phase: 1
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Owned job state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikenessJob' }
              example:
                {
                  id: '00000000-0000-4000-8000-000000000001',
                  modelId: head_snow,
                  mode: human,
                  status: queued,
                  phase: sources,
                  referenceSha256: null,
                  failureReason: null,
                  createdAt: '2026-10-11T12:00:00Z',
                  updatedAt: '2026-10-11T12:00:00Z',
                }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/LikenessUnavailable' }
    delete:
      tags: [player]
      operationId: cancelLikenessJob
      summary: Cancel an owned likeness job and queue private artifact cleanup.
      description: Stops new stages. A provider request already in flight is retained for reconciliation; no provider refund is implied.
      x-phase: 1
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204': { description: Owned job cancelled or identical request replayed }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /likeness/photos:
    post:
      tags: [player]
      operationId: postLikenessPhoto
      summary: Normalize one consented photo into private, expiring storage.
      description: |
        Authenticated before buffering. The default composition returns 503 before
        decoding or storing photos. When explicitly configured, accepts PNG/JPEG bytes
        only (8 MiB maximum), decodes and strips metadata, and stores a normalized JPEG
        under an opaque private key. One active photo per owner. Identical retries
        replay the original upload; changed bytes with the same key are rejected.
      x-phase: 1
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - {
            name: X-Likeness-Consent-Version,
            in: header,
            required: true,
            schema: { type: string, const: likeness-v1 },
          }
        - {
            name: X-Likeness-Own-Photo,
            in: header,
            required: true,
            schema: { type: string, const: 'true' },
          }
        - {
            name: X-Likeness-Share-With-Provider,
            in: header,
            required: true,
            schema: { type: string, const: 'true' },
          }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
      responses:
        '201':
          description: Owned normalized photo; raw originals are not retained
          content:
            application/json:
              schema:
                type: object
                required: [uploadId, expiresAt]
                properties:
                  uploadId: { type: string, format: uuid }
                  expiresAt: { type: string, format: date-time }
              example:
                {
                  uploadId: '00000000-0000-4000-8000-000000000001',
                  expiresAt: '2026-10-12T12:00:00Z',
                }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: IN_FLIGHT while the same upload is processing; retry the identical request
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '413': { $ref: '#/components/responses/ValidationFailed' }
        '415': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/LikenessUnavailable' }
  /likeness/photos/{id}:
    delete:
      tags: [player]
      operationId: deleteLikenessPhoto
      summary: Withdraw source consent and delete an owned private photo.
      description: Blocks subsequent generation stages before deletion; failed deletion remains journaled for cleanup. Does not claim to delete copies already held by the provider.
      x-phase: 1
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204': { description: Owned source deletion completed or already completed }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/LikenessUnavailable' }
  /likeness/jobs/{id}/reference:
    get:
      tags: [player]
      operationId: getLikenessReference
      summary: Read the owned conditioned character preview before 3D generation.
      description: Authenticated private JPEG; no public URL or provider token. Failed/cancelled jobs are inaccessible.
      x-phase: 1
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Private normalized reference with Cache-Control private,no-store and X-Content-Sha256
          content:
            image/jpeg: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/LikenessUnavailable' }
  /likeness/jobs/{id}/reference/approve:
    post:
      tags: [player]
      operationId: approveLikenessReference
      summary: Approve the exact owned preview before mesh generation.
      description: Durable idempotency and content hash bind consent to the preview actually shown. Does not start a second purchase or accept payment claims.
      x-phase: 1
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [referenceSha256]
              properties:
                referenceSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
      responses:
        '204': { description: Approval recorded or identical request replayed }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /likeness/jobs/{id}/result:
    get:
      tags: [player]
      operationId: getLikenessResult
      summary: Read an owned, validated playable GLB result.
      description: |
        Only status succeeded and phase completed can return bytes. The current worker
        stops at awaiting_asset_validation; structural checks are insufficient for
        runtime readiness, so those files cannot be downloaded through this endpoint.
      x-phase: 1
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Private validated GLB with Cache-Control private,no-store and X-Content-Sha256
          content:
            model/gltf-binary: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/LikenessUnavailable' }
  /likeness/jobs/{id}/manifest:
    get:
      tags: [player]
      operationId: getLikenessManifest
      summary: Read the owned validated humanoid manifest.
      x-phase: 1
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Validated artifact identity, limits and exact bone mapping
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikenessManifest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /likeness/jobs/{id}/accept:
    post:
      tags: [player]
      operationId: acceptLikenessAsset
      summary: Persist an owned validated personal avatar selection.
      description: Accepts an empty object. Does not validate assets, grant purchases or trigger generation. Client must first build and validate its runtime Humanoid Avatar.
      x-phase: 1
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: Persisted selection manifest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikenessManifest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /likeness/jobs/{id}/preview:
    get:
      tags: [player]
      operationId: getLikenessMeshPreview
      summary: Read an owned generated GLB before humanoid acceptance.
      description: A preview is not approval for gameplay. Private, no-store; X-Content-Sha256 identifies the bytes.
      x-phase: 1
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Private mesh preview
          content:
            model/gltf-binary:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/LikenessUnavailable' }
  /auth/challenge:
    get:
      tags: [auth]
      operationId: getAuthChallenge
      summary: Issue a SIWS challenge (nonce + SIWS message fields).
      description: |
        Returns a single-use nonce (5 min) and the SIWS message fields. The
        client builds `sign_in_payload` for the wallet, signs it, and posts
        the result to `POST /auth/verify`. Anonymous.
      x-phase: 1
      security: []
      responses:
        '200':
          description: Challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthChallenge' }
              example:
                nonce: '4e9c7b27-1f0a-4d3e-9a5e-2c7e0d4b3a8f'
                domain: 'ctlife.dev'
                statement: 'Sign in to CT Life'
                uri: 'https://ctlife.dev'
                version: '1'
                chainId: 'solana:devnet'
                issuedAt: '2026-10-05T12:00:00.000Z'
                expirationTime: '2026-10-05T12:05:00.000Z'
        '5xx':
          $ref: '#/components/responses/ServerError'

  /auth/verify:
    post:
      tags: [auth]
      operationId: postAuthVerify
      summary: Verify a SIWS signature and issue a JWT pair.
      description: |
        Verifies the Ed25519 signature against the nonce, looks up the Seeker
        Genesis Token on mainnet via Helius, upserts the user, and returns
        `{ accessToken, refreshToken, user }`. Anonymous.
      x-phase: 1
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthVerifyRequest' }
            example:
              address: 'Dgw3c4GbQnZe1FeaCa29vXtoyv6fxmxAVyynQw8mN2gZ'
              signedMessage: 'ctlife.dev wants you to sign in with your Solana account...'
              signature: 'base64-encoded-ed25519-signature'
              nonce: '4e9c7b27-1f0a-4d3e-9a5e-2c7e0d4b3a8f'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthVerifyResponse' }
              example:
                accessToken: 'eyJhbGciOiJSUzI1NiIs...'
                refreshToken: 'rt_8f4...'
                user:
                  id: '0192a1c2-...'
                  wallet: 'Dgw3c4GbQnZe1FeaCa29vXtoyv6fxmxAVyynQw8mN2gZ'
                  isSeeker: true
                  hasCharacter: false
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: Nonce invalid, signature invalid, or expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                NONCE_INVALID:
                  value:
                    {
                      error:
                        {
                          code: 'NONCE_INVALID',
                          message: 'Nonce is missing, used, or expired.',
                          details: {},
                        },
                    }
                SIGNATURE_INVALID:
                  value:
                    {
                      error:
                        {
                          code: 'SIGNATURE_INVALID',
                          message: 'Ed25519 signature did not verify.',
                          details: {},
                        },
                    }
                TOKEN_EXPIRED:
                  value:
                    {
                      error:
                        {
                          code: 'TOKEN_EXPIRED',
                          message: 'Access token expired; refresh.',
                          details: {},
                        },
                    }
        '409':
          description: SGT already linked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'SGT_ALREADY_LINKED',
                      message: 'This Seeker Genesis Token is already linked to another account.',
                      details: {},
                    },
                }
        '5xx': { $ref: '#/components/responses/ServerError' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: postAuthRefresh
      summary: Rotate the refresh token and issue a new pair.
      x-phase: 1
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
            example:
              refreshToken: 'rt_8f4...'
      responses:
        '200':
          description: New pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthVerifyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: postAuthLogout
      summary: Revoke the refresh token.
      x-phase: 1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/jwks:
    get:
      tags: [auth]
      operationId: getAuthJwks
      summary: Public keys for verifying access tokens.
      x-phase: 1
      security: []
      responses:
        '200':
          description: JWKS
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items: { type: object }
              example:
                keys:
                  - kty: 'RSA'
                    kid: 'ctlife-1'
                    use: 'sig'
                    alg: 'RS256'
                    n: '0vx7agoebGcQSuuU...'
                    e: 'AQAB'

  /auth/dev:
    post:
      tags: [auth]
      operationId: postAuthDev
      summary: Dev-only auth (no signature). Disabled in staging and prod.
      x-phase: 1
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wallet]
              properties:
                wallet: { type: string }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthVerifyResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404':
          description: ENABLE_DEV_AUTH is not on, or APP_ENV is staging/prod
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'NOT_FOUND',
                      message: 'Endpoint disabled in this environment.',
                      details: {},
                    },
                }

  /config:
    get:
      tags: [player]
      operationId: getConfig
      summary: All registries and game config.
      description: |
        Returns the full contract snapshot: every ID registry, every config
        file. Cached by `version` and `minClientVersion` (ETag). The
        `degraded` field lists features currently in degraded mode (kill
        switches). Clients with `X-Client-Version` below `minClientVersion`
        receive `CLIENT_OUTDATED` and must update.
      x-phase: 1
      security: []
      parameters:
        - $ref: '#/components/parameters/XClientVersion'
      responses:
        '200':
          description: Config
          headers:
            ETag:
              schema: { type: string }
              description: Strong ETag. Send `If-None-Match` to get 304.
            Cache-Control:
              schema: { type: string }
              example: 'public, max-age=60'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigResponse' }
              example:
                version: '1.0.0-rc1'
                minClientVersion: '1.0.0-rc1'
                degraded: []
                venues: { 'timeline_square': { 'name': 'Timeline Square', 'maxClients': 50 } }
        '304': { description: Not modified; ETag matches. }
        '426':
          description: Client outdated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'CLIENT_OUTDATED',
                      message: 'Update required. X-Client-Version is below minClientVersion.',
                      details: { 'minClientVersion': '1.0.0-rc1' },
                    },
                }
        '5xx': { $ref: '#/components/responses/ServerError' }

  /me:
    get:
      tags: [player]
      operationId: getMe
      summary: Current player state.
      x-phase: 1
      responses:
        '200':
          description: Me
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              example:
                user:
                  id: '0192a1c2-...'
                  wallet: 'Dgw3c4GbQnZe1FeaCa29vXtoyv6fxmxAVyynQw8mN2gZ'
                  isSeeker: true
                  skrName: 'anon'
                character:
                  alias: 'anon'
                  look:
                    {
                      skinTone: 'tan',
                      headId: 'head_skull_visor',
                      hairId: 'hair_mohawk_pink',
                      topId: 'top_hoodie_black',
                      bottomId: 'bottom_jeans_indigo',
                      shoesId: 'shoes_sneakers_white',
                      accId: 'acc_aviators',
                    }
                  tribeId: 'trencher'
                  traitIds: ['fast_talker', 'iron_will']
                  dreamId: 'make_10k'
                needs: { energy: 50, hunger: 50, fun: 50, hygiene: 50, sanity: 50 }
                skills: { clout: 1, coding: 1, trading: 1, writing: 1, design: 1, security: 1 }
                cashCents: 150000
                debtCents: 0
                homeId: 'hacker_house'
                minerTier: 'none'
                flags: {}
        '401': { $ref: '#/components/responses/Unauthorized' }

  /characters:
    post:
      tags: [player]
      operationId: postCharacter
      summary: Create the character for the current user.
      description: |
        Allowed once per user. `ageConfirmed: true` is required. The lottery
        roll is forced before the character is created on a later milestone
        (call `POST /lottery/roll`). The character's look is locked until
        `PATCH /characters/me/look` in Phase 4.
      x-phase: 1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCharacterRequest' }
            example:
              alias: 'anon'
              look:
                skinTone: 'tan'
                headId: 'head_skull_visor'
                hairId: 'hair_mohawk_pink'
                topId: 'top_hoodie_black'
                bottomId: 'bottom_jeans_indigo'
                shoesId: 'shoes_sneakers_white'
                accId: 'acc_aviators'
              traitIds: ['fast_talker', 'iron_will']
              dreamId: 'make_10k'
              tribeId: 'trencher'
              ageConfirmed: true
      responses:
        '200':
          description: Character
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Character' }
        '400':
          description: Validation failed (ageConfirmed missing, invalid look, etc.)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'VALIDATION_FAILED',
                      message: 'Request body or params failed validation.',
                      details: { 'field': 'ageConfirmed' },
                    },
                }
        '409':
          description: Alias already taken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: 'ALIAS_TAKEN', message: 'Alias is taken.', details: {} } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /lottery/roll:
    post:
      tags: [player]
      operationId: postLotteryRoll
      summary: Roll the birth lottery once.
      description: |
        Returns one of `seeker` (only if the wallet has a verified Seeker
        Genesis Token), `insider`, or `exit_liquidity`. The weights in
        `lottery.json` decide the outcome. Allowed once per account.
      x-phase: 1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Outcome
          content:
            application/json:
              schema:
                type: object
                required: [outcome, cashCents, debtCents, homeId]
                properties:
                  outcome: { type: string, enum: [seeker, insider, exit_liquidity] }
                  cashCents: { type: integer }
                  debtCents: { type: integer }
                  homeId: { type: string }
              example:
                outcome: 'insider'
                cashCents: 300000
                debtCents: 0
                homeId: 'studio'
        '409':
          description: Already rolled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'ALREADY_ROLLED',
                      message: 'Birth lottery has already been rolled for this account.',
                      details: {},
                    },
                }

  /needs/actions:
    post:
      tags: [player]
      operationId: postNeedsAction
      summary: Apply a needs action (eat, sleep, shower, touch_grass, party).
      x-phase: 1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actionId]
              properties:
                actionId: { type: string, enum: [eat, sleep, shower, touch_grass, party] }
            example: { actionId: 'eat' }
      responses:
        '200':
          description: Updated needs and cash
          content:
            application/json:
              schema:
                type: object
                required: [needs, cashCents]
                properties:
                  needs: { $ref: '#/components/schemas/Needs' }
                  cashCents: { type: integer }
              example:
                needs: { energy: 50, hunger: 80, fun: 50, hygiene: 50, sanity: 50 }
                cashCents: 150000
        '400':
          description: Action not allowed here (party requires club venue) or invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'VALIDATION_FAILED',
                      message: "Action 'party' is only allowed in club venues.",
                      details: { 'venueId': 'timeline_square' },
                    },
                }
        '402':
          description: Insufficient cash (e.g. restaurant order in M4)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'INSUFFICIENT_CASH',
                      message: 'Cash balance is insufficient.',
                      details: { 'shortfallCents': 50000 },
                    },
                }

  /me/entitlements:
    get:
      tags: [player]
      operationId: getMyEntitlements
      summary: Item keys the player owns that unlock something in the game.
      description: |
        The first key is `vehicle.hovercar`, the scarce right-to-drive pass for the
        `roadstar` vehicle kind (the hovercar). It is granted while the player's wallet
        holds an asset in the `HOVERCAR_COLLECTION` Metaplex Core collection (checked
        through Helius DAS on this call, at most once a minute) or by an ops grant, and
        revoked when the asset leaves the wallet. Game Cash never grants it. Without it,
        the vehicles room refuses a `roadstar` lease with `NOT_ENTITLED`.
      x-phase: 2
      responses:
        '200':
          description: Entitlements
          content:
            application/json:
              schema:
                type: object
                required: [items, updatedAt]
                properties:
                  items:
                    type: array
                    items: { type: string, pattern: '^[a-z]+\.[a-z0-9_]+$' }
                  updatedAt: { type: string, format: date-time }
              example:
                items: ['vehicle.hovercar']
                updatedAt: '2026-10-22T05:00:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '5xx': { $ref: '#/components/responses/ServerError' }

  /characters/me/look:
    patch:
      tags: [player]
      operationId: patchCharactersMeLook
      summary: Change the character's look.
      x-phase: 4
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Look' }
      responses:
        '200':
          description: Character
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Character' }
        '400': { $ref: '#/components/responses/ValidationFailed' }

  /homes:
    get:
      tags: [player]
      operationId: getHomes
      summary: List available homes.
      x-phase: 4
      responses:
        '200':
          description: Homes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Home' }
              example:
                - {
                    id: 'parents_basement',
                    name: "Parent's Basement",
                    rentCents: 2000,
                    nextDueAt: '2026-10-12T20:00:00.000Z',
                  }
                - {
                    id: 'hacker_house',
                    name: 'Hacker House',
                    rentCents: 6000,
                    nextDueAt: '2026-10-12T20:00:00.000Z',
                  }

    post:
      tags: [player]
      operationId: postHomes
      summary: Lease a home.
      description: >-
        Debits the first week of rent and takes a free unit (door) of the home's tier. Tiers:
        `parents_basement` is `basement`, `hacker_house` and `studio` are `flat`, `penthouse`
        and `marina_villa` are `penthouse`. A tier with no units in `contract/ids/home_units.json`
        leases without a door (`unitId` null). Leasing a kind you already live in returns that home.
      x-phase: 4
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [parents_basement, hacker_house, studio, penthouse, marina_villa]
      responses:
        '200':
          description: The leased home
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeasedHome' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409':
          description: Every unit of the tier is taken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: NO_FREE_UNIT,
                      message: 'Every unit of this home tier is taken; try again later or pick another tier.',
                      details: { tier: 'flat' },
                    },
                }

  /homes/{homeId}/rent:
    post:
      tags: [player]
      operationId: postHomesHomeIdRent
      summary: Pay the weekly rent for the given home.
      description: >-
        Debits one week of rent, clears an `overdue` state, and returns the Home. A lease
        from before doors existed takes a free unit now if its tier has one. Only the owner
        may pay; a moved-out or evicted home is refused with `400 VALIDATION_FAILED`.
      x-phase: 4
      parameters:
        - name: homeId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Lease signed
          content:
            application/json:
              schema:
                type: object
                required: [homeId, rentCents, nextDueAt]
                properties:
                  homeId: { type: string }
                  rentCents: { type: integer }
                  nextDueAt: { type: string, format: date-time }
                  unitId: { type: [string, 'null'] }
                  status: { $ref: '#/components/schemas/HomeStatus' }
                  missedWeeks: { type: integer }
        '402':
          description: Insufficient cash for deposit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'INSUFFICIENT_CASH',
                      message: 'Cash balance is insufficient.',
                      details: { 'shortfallCents': 2000 },
                    },
                }

  /homes/{homeId}/move-out:
    post:
      tags: [player]
      operationId: postHomesHomeIdMoveOut
      summary: Give the home up.
      description: >-
        Owner only. The home becomes `moved_out`, its unit is free for the next lease and its
        guests are removed. Moving out of a home that is already over is a no-op. Unpaid debt stays.
      x-phase: 4
      parameters:
        - name: homeId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The home, now `moved_out` (`unitId` null)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeasedHome' }
        '403':
          description: Not the owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: NOT_HOME_OWNER,
                      message: "Only the home's owner can do this.",
                      details: { homeId: 'home:0192a1c2-...' },
                    },
                }
        '404': { $ref: '#/components/responses/NotFound' }

  /homes/{homeId}/guests/{userId}:
    post:
      tags: [player]
      operationId: postHomesHomeIdGuestsUserId
      summary: Let a player through the home's door.
      description: >-
        Owner only; idempotent. Guests can enter the unit and visit. A unit holds `capacity`
        people including the owner. Returns the guest list.
      x-phase: 4
      parameters:
        - name: homeId
          in: path
          required: true
          schema: { type: string }
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Guest list after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeGuests' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403':
          description: Not the owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: NOT_HOME_OWNER,
                      message: "Only the home's owner can do this.",
                      details: { homeId: 'home:0192a1c2-...' },
                    },
                }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The unit is at capacity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: UNIT_FULL,
                      message: 'The unit is at capacity; remove a guest first.',
                      details: { unitId: 'flat:midrise_01:0', capacity: 2 },
                    },
                }
    delete:
      tags: [player]
      operationId: deleteHomesHomeIdGuestsUserId
      summary: Take a player off the home's guest list.
      description: Owner only; idempotent. Returns the guest list.
      x-phase: 4
      parameters:
        - name: homeId
          in: path
          required: true
          schema: { type: string }
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Guest list after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeGuests' }
        '403':
          description: Not the owner (NOT_HOME_OWNER)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /units/{unitId}/access:
    get:
      tags: [player]
      operationId: getUnitsUnitIdAccess
      summary: Can I open this door?
      description: >-
        Answers for the caller only; it never names who lives there. Owners and the owner's
        guests of a live home can enter. An evicted owner cannot (`reason: evicted`); everyone
        else meets a locked door (`locked`, or `vacant` when nobody lives there).
      x-phase: 4
      parameters:
        - name: unitId
          in: path
          required: true
          schema: { type: string }
          description: A door id from `contract/ids/home_units.json`, e.g. `flat:midrise_01:0`.
      responses:
        '200':
          description: Access verdict
          content:
            application/json:
              schema:
                type: object
                required: [canEnter, reason]
                properties:
                  canEnter: { type: boolean }
                  reason: { type: string, enum: [owner, guest, locked, vacant, evicted] }
              example: { canEnter: false, reason: locked }
        '404': { $ref: '#/components/responses/NotFound' }

  /homes/{ownerId}/visit:
    post:
      tags: [player]
      operationId: postHomesOwnerIdVisit
      summary: Visit a player's home and join their `home` room.
      description: >-
        A home with a door (`unitId` set) is open only to its owner and the owner's guests;
        anyone else gets `403 FORBIDDEN` and no visit is logged. A home without a door stays
        open. The 200 body is the visit row plus the door and interior to stream.
      x-phase: 4
      parameters:
        - name: ownerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Visit logged. Join the `home` room with `homeId`; stream `roomType` at `unitId`.
          content:
            application/json:
              schema:
                type: object
                required: [visitId, homeId, visitorUserId, visitedAt, unitId, roomType]
                properties:
                  visitId: { type: string, format: uuid }
                  homeId:
                    {
                      type: string,
                      description: 'Pass as `homeId` to `joinOrCreate("home", ...)`.',
                    }
                  visitorUserId: { type: string, format: uuid }
                  visitedAt: { type: string, format: date-time }
                  unitId:
                    {
                      type: [string, 'null'],
                      description: 'The door to open; null for a home without one.',
                    }
                  roomType:
                    {
                      type: [string, 'null'],
                      description: 'The interior to stream, e.g. apartment_modern.',
                    }
              example:
                {
                  visitId: '0192a1c2-...',
                  homeId: 'home:0192a1c2-...',
                  visitorUserId: '0192a1c3-...',
                  visitedAt: '2026-10-23T10:00:00.000Z',
                  unitId: 'flat:midrise_01:0',
                  roomType: 'apartment_modern',
                }
        '403':
          description: The door is locked for this caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'FORBIDDEN',
                      message: 'Caller is not allowed to perform this action.',
                      details: { reason: 'locked' },
                    },
                }

  /businesses:
    get:
      tags: [player]
      operationId: getBusinesses
      summary: My open businesses with their pending payouts.
      x-phase: 4
      responses:
        '200':
          description: Owned businesses, newest first
          content:
            application/json:
              schema:
                type: object
                required: [owned]
                properties:
                  owned: { type: array, items: { $ref: '#/components/schemas/Business' } }
    post:
      tags: [player]
      operationId: postBusinesses
      summary: Buy a business from config/businesses.json for its costCents.
      x-phase: 4
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kindId]
              properties:
                kindId: { type: string, description: 'A businesses.json id.' }
      responses:
        '201':
          description: Bought
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Business' }
        '402':
          description: Cash below costCents
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'INSUFFICIENT_CASH',
                      message: 'Cash balance is insufficient.',
                      details: { 'have': '100', 'need': '30000000' },
                    },
                }
        '403':
          description: Already own maxOwned of this kind
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'FORBIDDEN',
                      message: 'Forbidden.',
                      details: { 'reason': 'max_owned', 'maxOwned': 1 },
                    },
                }

  /businesses/{id}:
    get:
      tags: [player]
      operationId: getBusinessesId
      summary: One of my businesses and its last 30 payouts.
      x-phase: 4
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Business
          content:
            application/json:
              schema:
                type: object
                required: [business, recentDays]
                properties:
                  business: { $ref: '#/components/schemas/Business' }
                  recentDays: { type: array, items: { $ref: '#/components/schemas/BusinessDay' } }

  /businesses/{id}/collect:
    post:
      tags: [player]
      operationId: postBusinessesIdCollect
      summary: Move every pending payout to Cash.
      description: |
        A business earns one payout per payoutPeriodHours from purchase,
        rolled against its bad-day table. At most maxPendingPayouts
        periods pile up. Nothing pending answers collectedCents 0.
      x-phase: 4
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Collected
          content:
            application/json:
              schema:
                type: object
                required: [collectedCents, cashCents, days]
                properties:
                  collectedCents: { type: integer }
                  cashCents: { type: integer }
                  days: { type: array, items: { $ref: '#/components/schemas/BusinessDay' } }

  /businesses/{id}/sell:
    post:
      tags: [player]
      operationId: postBusinessesIdSell
      summary: Sell back for sellBackBps of the cost. Pending payouts are collected first.
      x-phase: 4
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Sold
          content:
            application/json:
              schema:
                type: object
                required: [refundCents, collectedCents, cashCents]
                properties:
                  refundCents: { type: integer }
                  collectedCents: { type: integer }
                  cashCents: { type: integer }

  /characters/me/tribe:
    patch:
      tags: [player]
      operationId: patchCharactersMeTribe
      summary: Change tribe (once per season).
      x-phase: 6
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tribeId]
              properties:
                tribeId: { type: string }
      responses:
        '200':
          description: Character
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Character' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /careers:
    get:
      tags: [work]
      operationId: getCareers
      summary: All careers with my level and XP.
      x-phase: 1
      responses:
        '200':
          description: Careers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, level, xp, active]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    level: { type: integer, minimum: 0, maximum: 5 }
                    xp: { type: integer, minimum: 0 }
                    active: { type: boolean }

  /careers/{careerId}/apply:
    post:
      tags: [work]
      operationId: postCareersCareerIdApply
      summary: Apply for a career.
      x-phase: 1
      parameters:
        - name: careerId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /shifts:
    post:
      tags: [work]
      operationId: postShifts
      summary: Start a shift.
      x-phase: 1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [careerId]
              properties:
                careerId: { type: string }
      responses:
        '200':
          description: Shift
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
              example:
                shiftId: 'shift_0192a1c2-...'
                miniGameIds: ['discord_mod_ban']
                endsAt: '2026-10-05T12:01:00.000Z'

  /shifts/{shiftId}/complete:
    post:
      tags: [work]
      operationId: postShiftsShiftIdComplete
      summary: Complete a shift with the per-mini-game scores.
      description: |
        Scores are capped at `maxScore` from `mini_games.json`. The shift
        cannot be completed before `endsAt` (returns `SHIFT_NOT_FINISHED`).
        XP and pay are derived from the scores and the level's pay formula.
      x-phase: 1
      parameters:
        - name: shiftId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [results]
              properties:
                results:
                  type: array
                  items:
                    type: object
                    required: [miniGameId, score]
                    properties:
                      miniGameId: { type: string }
                      score: { type: integer, minimum: 0 }
            example:
              results:
                - { miniGameId: 'discord_mod_ban', score: 8 }
      responses:
        '200':
          description: Pay and XP
          content:
            application/json:
              schema:
                type: object
                required: [payCents, xp, promoted]
                properties:
                  payCents: { type: integer }
                  xp: { type: integer }
                  promoted: { type: boolean }
              example:
                payCents: 5500
                xp: 120
                promoted: false
        '400':
          description: Shift not finished or score invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'SHIFT_NOT_FINISHED',
                      message: 'Shift cannot be completed before durationSec has elapsed.',
                      details: { 'endsAt': '2026-10-05T12:01:00.000Z' },
                    },
                }

  /gigs:
    get:
      tags: [work]
      operationId: getGigs
      summary: All gigs available to the current user.
      x-phase: 4
      responses:
        '200':
          description: Gigs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Gig' }

  /gigs/{gigId}/run:
    post:
      tags: [work]
      operationId: postGigsGigIdRun
