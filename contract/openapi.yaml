        energy: { type: integer, minimum: 0, maximum: 100 }
        hunger: { type: integer, minimum: 0, maximum: 100 }
        fun: { type: integer, minimum: 0, maximum: 100 }
        hygiene: { type: integer, minimum: 0, maximum: 100 }
        sanity: { type: integer, minimum: 0, maximum: 100 }
    Skills:
      type: object
      required: [clout, coding, trading, writing, design, security]
      properties:
        clout: { type: integer, minimum: 1, maximum: 10 }
        coding: { type: integer, minimum: 1, maximum: 10 }
        trading: { type: integer, minimum: 1, maximum: 10 }
        writing: { type: integer, minimum: 1, maximum: 10 }
        design: { type: integer, minimum: 1, maximum: 10 }
        security: { type: integer, minimum: 1, maximum: 10 }
    Home:
      type: object
      required: [id, name, rentCents, nextDueAt]
      properties:
        id: { type: string }
        name: { type: string }
      allOf:
        - properties:
            rentCents: { type: integer }
            nextDueAt: { type: string, format: date-time }
    HomeStatus:
      type: string
      enum: [active, overdue, evicted, moved_out]
      description: >-
        `active` to `overdue` on a missed weekly rent, to `evicted` after 4 missed weeks in a
        row. `moved_out` is the owner's choice. Only active and overdue homes hold a unit.
    HomeTier:
      type: string
      enum: [basement, flat, penthouse]
    LeasedHome:
      type: object
      required:
        [
          homeId,
          ownerUserId,
          kind,
          unitId,
          tier,
          roomType,
          status,
          missedWeeks,
          rentCentsPerWeek,
          createdAt,
        ]
      properties:
        homeId: { type: string, description: 'Instance id, `home:<uuid>`; not the kind.' }
        ownerUserId: { type: string, format: uuid }
        kind: { type: string }
        unitId:
          {
            type: [string, 'null'],
            description: 'The door this lease holds; null for a tier without doors, or once given up.',
          }
        tier: { $ref: '#/components/schemas/HomeTier' }
        roomType: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/HomeStatus' }
        missedWeeks: { type: integer, minimum: 0 }
        rentCentsPerWeek: { type: integer }
        decoratedAt: { type: [string, 'null'], format: date-time }
        lastRentPaidAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    MeHome:
      type: object
      required: [homeId, unitId, tier, roomType, status, missedWeeks]
      properties:
        homeId:
          {
            type: string,
            description: 'Instance id, `home:<uuid>`; use it for the /homes/{homeId}/... routes.',
          }
        unitId: { type: [string, 'null'] }
        tier: { $ref: '#/components/schemas/HomeTier' }
        roomType: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/HomeStatus' }
        missedWeeks: { type: integer, minimum: 0 }
    HomeGuests:
      type: object
      required: [homeId, guests]
      properties:
        homeId: { type: string }
        guests: { type: array, items: { type: string, format: uuid } }
    Job:
      type: object
      required: [careerId, level, xp]
      properties:
        careerId: { type: string }
        level: { type: integer, minimum: 1, maximum: 5 }
        xp: { type: integer, minimum: 0 }
    Shift:
      type: object
      required: [shiftId, miniGameIds, endsAt]
      properties:
        shiftId: { type: string }
        miniGameIds: { type: array, items: { type: string } }
        endsAt: { type: string, format: date-time }
    Gig:
      type: object
      required: [id, name, durationSec, payCents, cooldownSec]
      properties:
        id: { type: string }
        name: { type: string }
        durationSec: { type: integer }
        payCents: { type: integer }
        cooldownSec: { type: integer }
    ConfigResponse:
      type: object
      required: [version, minClientVersion, degraded]
      properties:
        version: { type: string }
        minClientVersion: { type: string }
        degraded:
          type: array
          description: |
            List of features currently in degraded mode. Read on every
            `/config` response and disable those surfaces. Possible values:
            `voice`, `llm`, `feed`, `npc_density`, `venue_cap`, `board_refresh`,
            `smart_money`, `dms`, `ore_reader`, `signup`, `rate_limit`,
            `login`, `price_feed`, `helius`, `ledger_freeze`, `login_ip_only`.
          items: { type: string }
        venues: { type: object, additionalProperties: true }
        archetypes: { type: object, additionalProperties: true }
        tribes: { type: object, additionalProperties: true }
        careers: { type: object, additionalProperties: true }
        market: { type: object, additionalProperties: true }
        events: { type: object, additionalProperties: true }
        npc_lines: { type: object, additionalProperties: true }
        ads: { type: object, additionalProperties: true }
        ore: { type: object, additionalProperties: true }
        meta: { type: object, additionalProperties: true }
        characterPalettes:
          $ref: '#/components/schemas/CharacterPalettes'
    CharacterPalettes:
      type: object
      additionalProperties: false
      required: [version, models]
      properties:
        version: { type: integer, const: 1 }
        models:
          type: array
          description: Finite independent recolour choices bound to an authored head/body identity. A fresh server response confirms support; cache alone does not.
          items:
            type: object
            additionalProperties: false
            required: [headId, skinTones, hairIds, topIds, bottomIds, shoesIds, accIds]
            properties:
              headId: { type: string, enum: [head_ubc_m, head_ubc_f] }
              skinTones: { type: array, items: { type: string }, uniqueItems: true }
              hairIds: { type: array, items: { type: string }, uniqueItems: true }
              topIds: { type: array, items: { type: string }, uniqueItems: true }
              bottomIds: { type: array, items: { type: string }, uniqueItems: true }
              shoesIds: { type: array, items: { type: string }, uniqueItems: true }
              accIds: { type: array, items: { type: string, const: acc_none }, uniqueItems: true }
    PublicProfile:
      type: object
      required: [id, alias, skrName, isSeeker, tribeId, minerTier, look, netWorthCents]
      properties:
        id: { type: string, format: uuid }
        alias: { type: string }
        skrName: { type: string, nullable: true }
        isSeeker: { type: boolean }
        tribeId: { type: string }
        minerTier: { type: string, enum: [none, prospector, miner, refiner] }
        look: { $ref: '#/components/schemas/Look' }
        netWorthCents: { type: integer }
    Coin:
      type: object
      required:
        [
          coinId,
          ticker,
          name,
          stage,
          priceMicros,
          mcapCents,
          vol5mCents,
          change5mBps,
          holders,
          launchedAt,
        ]
      properties:
        coinId: { type: string, format: uuid }
        ticker: { type: string }
        name: { type: string }
        stage: { type: string, enum: [new, final, graduated, dead] }
        priceMicros: { type: integer }
        mcapCents: { type: integer }
        vol5mCents: { type: integer }
        change5mBps: { type: integer }
        holders: { type: integer }
        launchedAt: { type: string, format: date-time }
    Candle:
      type: object
