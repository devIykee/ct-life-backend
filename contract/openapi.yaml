                amountCents: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Repaid
          content:
            application/json:
              schema:
                type: object
                required: [repaidCents, cashCents, debtCents]
                properties:
                  repaidCents: { type: integer }
                  cashCents: { type: integer }
