  /groups/{id}/members:
    get:
      tags: [groups]
      operationId: getGroupMembers
      summary: Members (owner, mods, then by join time).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties:
                    {
                      members:
                        {
                          type: array,
                          items:
                            {
                              type: object,
                              properties:
                                {
                                  userId: { type: string, format: uuid },
                                  alias: { type: string },
                                  role: { type: string, enum: [owner, mod, member] },
                                  joinedAt: { type: string, format: date-time },
                                },
                            },
                        },
                    },
                }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /groups/{id}/members/{userId}/remove:
    post:
      tags: [groups]
      operationId: postGroupMemberRemove
      summary: Remove a member (owner or mod); they cannot rejoin by invite.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Removed }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /groups/{id}/members/{userId}/role:
    post:
      tags: [groups]
      operationId: postGroupMemberRole
      summary: Make a member a mod or back (owner only).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [mod, member] }
      responses:
        '204': { description: Changed }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /groups/{id}/leave:
    post:
      tags: [groups]
      operationId: postGroupLeave
      summary: Leave. The owner hands over to the oldest mod, else member; tribe chats cannot be left (mute them).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Left }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /groups/{id}/mute:
    post:
      tags: [groups]
      operationId: postGroupMute
      summary: Mute banners for N hours (0 unmutes).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hours]
              properties:
                hours: { type: integer, minimum: 0, maximum: 8760 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties: { mutedUntil: { type: string, format: date-time, nullable: true } },
                }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /groups/{id}/read:
    post:
      tags: [groups]
      operationId: postGroupRead
      summary: Mark the group read (clears unread).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Read }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /groups/{id}/report:
    post:
      tags: [groups]
      operationId: postGroupReport
      summary: Report a group (a member or an invitee; once per player). Three different reporters hide it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonId]
              properties:
                reasonId: { type: string, description: 'report_reasons.json id' }
                note: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Reported
          content:
            application/json:
              schema: { type: object, properties: { hidden: { type: boolean } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /groups/{id}/invites:
    post:
      tags: [groups]
      operationId: postGroupInvites
      summary: 'A shareable invite link (friends: any member; alpha: owner or mod; tribe: none). Sharing earns nothing.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                maxUses: { type: integer, minimum: 1, maximum: 1000, default: 25 }
                ttlHours: { type: integer, minimum: 1, maximum: 720, default: 168 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupInviteLink' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /groups/{id}/invites/user:
    post:
      tags: [groups]
      operationId: postGroupInviteUser
      summary: Invite one player directly (realtime `group_invite`). Blocked pairs get `BLOCKED`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema: { type: object, properties: { code: { type: string } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /invites/{code}:
    get:
      tags: [groups]
      operationId: getInvite
      summary: Preview an invite (group, size, caller and Trust score for alpha groups, valid).
      parameters:
        - {
            name: code,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[A-Za-z0-9]{10}$' },
          }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupInvitePreview' }
        '404': { $ref: '#/components/responses/NotFound' }

  /invites/{code}/accept:
    post:
      tags: [groups]
      operationId: postInviteAccept
      summary: 'Join with an invite. Atomic: the cap and max uses hold under concurrent joins (`CONFLICT`, `reason: group_full`; `FORBIDDEN` `invite_expired`, `removed_from_group`, `group_hidden`).'
      parameters:
        - {
            name: code,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[A-Za-z0-9]{10}$' },
          }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupSummary' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /invites/{code}/decline:
    post:
      tags: [groups]
      operationId: postInviteDecline
      summary: Decline a direct invite.
      parameters:
        - {
            name: code,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[A-Za-z0-9]{10}$' },
          }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Declined }
        '404': { $ref: '#/components/responses/NotFound' }

  /groups/{id}/messages:
    get:
      tags: [groups]
      operationId: getGroupMessages
      summary: A topic's messages, newest first (50). Authors I blocked are left out; call cards show the server's grade and the live price.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: topic,
            in: query,
            required: false,
            schema: { type: string, enum: [chat, calls, wins], default: chat },
          }
        - { name: before, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties:
                    {
                      messages:
                        { type: array, items: { $ref: '#/components/schemas/GroupMessage' } },
                      nextBefore: { type: string, format: date-time, nullable: true },
                    },
                }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [groups]
      operationId: postGroupMessages
      summary: Post to a topic.
      description: >-
        `chat` {text}: any member (friends and tribe groups have chat only). `calls` {coinId, targetX 1.05..100, stopPct 1..95, text?}: alpha groups, owner only; creates an alpha call with the server price as entry, graded by the existing evaluator. `wins` {coinId, text?}: alpha groups; needs realized profit on that coin. Links, e-mails, phones and wallet addresses are masked. Slow mode per topic (`RATE_LIMITED`, `details.slowModeSeconds`; owners and mods exempt) and a per-player burst of 10, then 1/s.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic]
              properties:
                topic: { type: string, enum: [chat, calls, wins] }
                text: { type: string, maxLength: 500 }
                coinId: { type: string, format: uuid }
                targetX: { type: number, minimum: 1.05, maximum: 100 }
                stopPct: { type: number, minimum: 1, maximum: 95 }
      responses:
        '201':
          description: Posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupMessage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /groups/{id}/messages/{messageId}:
    delete:
      tags: [groups]
      operationId: deleteGroupMessage
      summary: Delete a message (its author, or an owner or mod).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /venues/{venueId}/booths:
    get:
      tags: [groups]
      operationId: getVenueBooths
      summary: A venue's booths and the alpha group holding each, with how many members are there now.
      parameters:
        - {
            name: venueId,
            in: path,
            required: true,
            schema: { type: string, enum: [cabal_lounge, discord_heights] },
          }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties:
                    { booths: { type: array, items: { $ref: '#/components/schemas/VenueBooth' } } },
                }
        '404': { $ref: '#/components/responses/NotFound' }

  /groups/{id}/booth:
    post:
      tags: [groups]
      operationId: postGroupBooth
      summary: Claim a booth for an alpha group (owner; one booth per group; `CONFLICT` booth_taken).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [venueId, boothId]
              properties:
                venueId: { type: string, enum: [cabal_lounge, discord_heights] }
                boothId:
                  {
                    type: string,
                    description: 'cabal_lounge: booth_1..booth_6; discord_heights: general, alpha_maybe, gm, wen_token, support_ticket, memes',
                  }
      responses:
        '201':
          description: Claimed
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties: { venueId: { type: string }, boothId: { type: string } },
                }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [groups]
      operationId: deleteGroupBooth
      summary: Give the booth back (owner).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Released }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /districts/{id}/standings:
    get:
      tags: [competition]
      operationId: getDistrictStandings
      summary: Today's tribe scores in a district and my contribution.
      description: >-
        Live for the current UTC day, with the same formula the daily rollover writes: the default
        holder's `base_score_per_day` plus player posts and check-ins in the district by each
        tribe's members, at most 3 per player. The rollover at 00:05 UTC (`rolloverAt`) gives the
        district to the top tribe of the day that ended. `standings` is highest score first.
        `myContribution` is my capped count today, null for the `anon` tribe (hidden) or without a
        character. Capability `districtStandings`: `503 CAPABILITY_OFF` while it is off.
      x-phase: 6
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Standings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistrictStandings' }
              example:
                districtId: 'the_trenches'
                dayDate: '2026-10-30'
                rolloverAt: '2026-10-31T00:05:00.000Z'
                standings:
                  - { tribeId: 'trencher', score: 104 }
                  - { tribeId: 'perp_degen', score: 12 }
                myTribeId: 'perp_degen'
                myContribution: 3
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/CapabilityOff' }

  /me/season-results:
    get:
      tags: [competition]
      operationId: getMeSeasonResults
      summary: How my last (or a given) finished season ended, for the share card.
      description: >-
        Seasons are ISO weeks (`2026-W43`). Without `seasonId`, the latest finished season I was
        in. `outcome` compares my league with the next season's (written at the Monday rollover):
        `promoted`/`relegated` with `toLeagueId`, or `stayed` (also when the next rollover has not
        run yet) with `toLeagueId: null`. `finalRank` is my place in that league by net worth at
        the end of the season (the start-of-season rank when no later row exists). `rewards` lists
        what the ledger paid for that season (`reason: season_reward`); nothing pays one yet, so it
        is `[]`. `404 NOT_FOUND` when I have no finished season (or `seasonId` is the current or a
        future one). Capability `seasonResults`: `503 CAPABILITY_OFF` while it is off.
      x-phase: 6
      parameters:
        - name: seasonId
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}-W\d{2}$' }
      responses:
        '200':
          description: Season result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeasonResult' }
              example:
                seasonId: '2026-W43'
                leagueId: 'silver'
                finalRank: 12
                outcome: 'promoted'
                toLeagueId: 'gold'
                rewards: []
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/CapabilityOff' }

  /homes/move:
    post:
      tags: [player]
      operationId: postHomesMove
      summary: Move home (upgrade or downsize) in one step.
      description: >-
        Capability `homeMove` (unlock D1). Atomic: every live lease of the caller (active or
        overdue) becomes `moved_out` (its unit frees and its guests are removed), a free unit of
        the new kind's tier is taken, the first week of the new rent is debited and the new lease
        starts. If any step fails nothing changes. Nothing of the old week is refunded and debt
        from missed weeks stays. From the street (no home) it simply leases. Homes open at
        release phase 4; before that the route answers `403 FORBIDDEN {reason: phase_locked}`.
      x-phase: 4
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              additionalProperties: false
              properties:
                kind:
                  type: string
                  enum: [parents_basement, hacker_house, studio, penthouse, marina_villa]
      responses:
        '200':
          description: The new lease and the lease that ended
          content:
            application/json:
              schema:
                type: object
                required: [home, movedOutHomeId]
                properties:
                  home: { $ref: '#/components/schemas/LeasedHome' }
                  movedOutHomeId:
                    type: [string, 'null']
                    description: The home id that ended; null when the caller had no home.
              example:
                {
                  home:
                    {
                      homeId: 'home:0192b3c4-0000-7000-8000-000000000001',
                      ownerUserId: '0192a1c2-0000-7000-8000-000000000001',
                      kind: 'studio',
                      unitId: 'flat:bld_residences_02:1',
                      tier: 'flat',
                      roomType: 'studio_a',
                      status: 'active',
                      missedWeeks: 0,
                      rentCentsPerWeek: 18000,
                      decoratedAt: null,
                      lastRentPaidAt: '2026-10-30T12:00:00.000Z',
                      createdAt: '2026-10-30T12:00:00.000Z',
                    },
                  movedOutHomeId: 'home:0192a1c2-0000-7000-8000-0000000000aa',
                }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: Not enough Cash for the first week of the new rent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: INSUFFICIENT_CASH,
                      message: 'Cash balance is insufficient.',
                      details: { have: '8000', need: '18000', shortfallCents: 10000 },
                    },
                }
        '403':
          description: '`FORBIDDEN {reason: phase_locked}` before homes open'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`CONFLICT {reason: same_home}` or `CONFLICT {reason: no_unit_free, tier}`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: CONFLICT,
                      message: 'Resource conflict.',
                      details: { reason: 'no_unit_free', tier: 'flat' },
                    },
                }
        '503': { $ref: '#/components/responses/CapabilityOff' }

  /homes/me/settings:
    get:
      tags: [player]
      operationId: getHomesMeSettings
      summary: Who may visit my home.
      description: >-
        Capability `visitorPolicy` (unlock D2). `open` (default): the door rules alone decide.
        `followers`: only mutual followers (you follow each other) and your guests. `closed`: nobody
        but you. Under every policy a player either of you blocked is refused with `BLOCKED`. The
        policy is per player, so it survives a move, and it narrows access only: a home with a door
        still needs the owner or a guest to open it.
      x-phase: 4
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeSettings' }
              example: { visitors: 'followers' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/CapabilityOff' }
    put:
      tags: [player]
      operationId: putHomesMeSettings
      summary: Set who may visit my home.
      description: >-
        Capability `visitorPolicy` (unlock D2). Enforced in `POST /homes/{ownerId}/visit` and when
        joining the `home` room: `closed` refuses with `403 HOME_CLOSED`, `followers` with
        `403 FORBIDDEN {reason: followers_only}` (unless mutual follower or guest), and a block in
        either direction with `403 BLOCKED` under every policy. Visitors already inside who no longer qualify are
        shown out of the room.
      x-phase: 4
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HomeSettings' }
      responses:
        '200':
          description: The stored settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeSettings' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >-
            Not returned by this route; listed for the visit route and the home room, which refuse
            a visitor with `HOME_CLOSED` (closed home) or `FORBIDDEN {reason: followers_only}`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    { code: HOME_CLOSED, message: 'This home is closed to visitors.', details: {} },
                }
        '503': { $ref: '#/components/responses/CapabilityOff' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUIDv4 generated by the client. The server dedupes for 24 h and
        replays the first response and status. Same key with a different
        body hash returns `VALIDATION_FAILED`. Concurrent requests with
        the same key are serialized.
      schema: { type: string, format: uuid }
    XClientVersion:
      name: X-Client-Version
      in: header
      required: false
      description: Client version. Below `minClientVersion` returns `CLIENT_OUTDATED`.
      schema: { type: string }
    XContractVersion:
      name: X-Contract-Version
      in: header
      required: false
      description: Optional override; defaults to the latest signed contract.
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the previous call.
      schema: { type: string }
  responses:
    LikenessUnavailable:
      description: Likeness pipeline is inactive; do not collect photos or initiate payment.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: LIKENESS_UNAVAILABLE
              message: Character likeness is not available yet. No photo or payment was accepted.
              details:
                reason: provider_not_configured
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error:
                { code: 'TOKEN_EXPIRED', message: 'Access token expired; refresh.', details: {} },
            }
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error:
                {
                  code: 'FORBIDDEN',
                  message: 'Caller is not allowed to perform this action.',
                  details: {},
                },
            }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: 'NOT_FOUND', message: 'Resource not found.', details: {} } }
    ValidationFailed:
      description: Body or params failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error:
                {
                  code: 'VALIDATION_FAILED',
                  message: 'Request body or params failed validation.',
                  details: { 'field': 'ageConfirmed' },
                },
            }
    CasinoRefused:
      description: >-
        The casino refused the stake: `AGE_REQUIRED` (18+ not confirmed), `SELF_EXCLUDED`,
        `STAKE_CAP_REACHED` or `LOSS_CAP_REACHED` (daily caps, UTC day). `details` carries the
        cap or the exclusion date.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            age:
              value:
                {
                  error:
                    {
                      code: AGE_REQUIRED,
                      message: 'The Rug Room is 18+. Confirm your age to play.',
                      details: {},
                    },
                }
            excluded:
              value:
                {
                  error:
                    {
                      code: SELF_EXCLUDED,
                      message: 'You have excluded yourself from the casino until the date shown.',
                      details: { until: '2026-11-01T12:00:00.000Z' },
                    },
                }
            stakeCap:
              value:
                {
                  error:
                    {
                      code: STAKE_CAP_REACHED,
                      message: 'This stake would pass your daily casino stake cap. Try again tomorrow (UTC).',
                      details:
                        {
                          capCents: 50000,
                          stakedCents: 49800,
                          resetsAt: '2026-10-25T00:00:00.000Z',
                        },
                    },
                }
            lossCap:
              value:
                {
                  error:
                    {
                      code: LOSS_CAP_REACHED,
                      message: 'This stake would pass your daily casino net-loss cap. Try again tomorrow (UTC).',
                      details:
                        {
                          capCents: 25000,
                          netLossCents: 24900,
                          resetsAt: '2026-10-25T00:00:00.000Z',
                        },
                    },
                }
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer, description: 'Seconds until retry.' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error:
                {
                  code: 'RATE_LIMITED',
                  message: 'Rate limit exceeded; try again later.',
                  details: { 'retryAfterMs': 1000 },
                },
            }
    ServerError:
      description: Server is at capacity or temporarily unavailable
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error:
                {
                  code: 'SERVER_BUSY',
                  message: 'Server is at capacity. Retry-After header carries the wait time.',
                  details: {},
                },
            }
    CapabilityOff:
      description: >-
        The feature behind this route is not turned on on this deployment yet (its name is not in
        `CAPABILITIES_ON`; see `capabilities` in `GET /config`). `details.capability` names it.
        Not retryable until the config changes.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              error:
                {
                  code: CAPABILITY_OFF,
                  message: 'This feature is not turned on on this server yet.',
                  details: { capability: 'worldEvents' },
                },
            }
  schemas:
    FactoryToken:
      type: object
      properties:
        mint: { type: string }
        pool: { type: string }
        cluster: { type: string, enum: [devnet, mainnet] }
        name: { type: string }
        ticker: { type: string }
        imageUri: { type: string }
        metadataUri: { type: string }
        creator:
          type: object
          properties:
            userId: { type: string, format: uuid }
            alias: { type: string }
            wallet: { type: string }
        launchedAt: { type: string, format: date-time }
        signature: { type: string }
        priceSol: { type: number, nullable: true, description: 'SOL per whole token' }
        marketCapSol: { type: number, nullable: true, description: 'priceSol x 1,000,000,000' }
        quoteReserveSol: { type: number, nullable: true }
        progressBps:
          { type: integer, nullable: true, description: 'Curve progress to graduation, 0..10000' }
        migrated: { type: boolean, description: 'Graduated to a DAMM v2 pool' }
        rugged: { type: boolean, description: 'The creator sold 30%+ of their holding' }
        volume24hSol: { type: number }
        trades24h: { type: integer }
        stateAt: { type: string, format: date-time, nullable: true }
    GroupSummary:
      type: object
      required:
        [groupId, kind, name, role, memberCount, memberCap, unread, muted, lastMessage, booth]
      properties:
        groupId: { type: string, format: uuid }
        kind: { type: string, enum: [friends, alpha, tribe] }
        name: { type: string }
        role: { type: string, enum: [owner, mod, member] }
        memberCount: { type: integer }
        memberCap: { type: integer, description: 'friends 12, alpha 50, tribe 200' }
        unread: { type: integer, maximum: 99 }
        muted: { type: boolean }
        mutedUntil: { type: string, format: date-time, nullable: true }
        lastMessage:
          type: object
          nullable: true
          properties:
            topic: { type: string, enum: [chat, calls, wins] }
            authorAlias: { type: string }
            preview: { type: string }
            at: { type: string, format: date-time }
        booth:
          type: object
          nullable: true
          properties: { venueId: { type: string }, boothId: { type: string } }
    GroupInfo:
      type: object
      properties:
        groupId: { type: string, format: uuid }
        kind: { type: string, enum: [friends, alpha, tribe] }
        name: { type: string }
        rules: { type: string }
        role: { type: string, enum: [owner, mod, member] }
        memberCount: { type: integer }
        memberCap: { type: integer }
        topics: { type: array, items: { type: string, enum: [calls, chat, wins] } }
        slowMode: { type: object, additionalProperties: { type: integer } }
        owner:
          type: object
          nullable: true
          properties: { userId: { type: string, format: uuid }, alias: { type: string } }
        trust:
          type: object
          nullable: true
          description: "Alpha groups: the caller's server-graded record (GET /alpha-calls trust)."
          properties:
            hitRate: { type: number }
            avgReturnBps: { type: integer }
            maxDrawdownBps: { type: integer }
            heldBagPct: { type: number }
        booth:
          type: object
          nullable: true
          properties: { venueId: { type: string }, boothId: { type: string } }
        hereWithYou:
          { type: integer, description: 'Members within 60 m of you now (server positions).' }
        muted: { type: boolean }
    GroupMessage:
      type: object
      required: [messageId, groupId, topic, authorUserId, authorAlias, text, card, at]
      properties:
        messageId: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        topic: { type: string, enum: [chat, calls, wins] }
        authorUserId: { type: string, format: uuid }
        authorAlias: { type: string }
        text: { type: string, maxLength: 500 }
        card:
          type: object
          nullable: true
          description: >-
            `call`: {type, callId, coinId, ticker, entryMicros, targetMicros, stopMicros, status
            (open | hit_target | hit_stop | expired), priceMicros, deepLink}. `pnl`: {type, coinId,
            ticker, realizedCents, deepLink}.
          additionalProperties: true
        at: { type: string, format: date-time }
    GroupInviteLink:
      type: object
      properties:
        code: { type: string }
        deepLink: { type: string, example: 'ctlife://invite/Ab3dEf7hJk' }
        groupId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        maxUses: { type: integer }
        uses: { type: integer }
    GroupInvitePreview:
      type: object
      properties:
        code: { type: string }
        groupId: { type: string, format: uuid }
        groupName: { type: string }
        kind: { type: string, enum: [friends, alpha, tribe] }
        memberCount: { type: integer }
        memberCap: { type: integer }
        from:
          {
            type: object,
            properties: { userId: { type: string, format: uuid }, alias: { type: string } },
          }
        owner:
          type: object
          nullable: true
          properties: { userId: { type: string, format: uuid }, alias: { type: string } }
        trust: { type: object, nullable: true, additionalProperties: true }
        expiresAt: { type: string, format: date-time }
        valid: { type: boolean }
    VenueBooth:
      type: object
      properties:
        venueId: { type: string }
        boothId: { type: string }
        group:
          type: object
          nullable: true
          properties:
            groupId: { type: string, format: uuid }
            name: { type: string }
            memberCount: { type: integer }
            here: { type: integer, description: 'Members within 60 m of the venue door now.' }
    LikenessCheckoutStatus:
      type: object
      required: [intentId, modelId, status, entitlementId]
      properties:
        intentId: { type: string, format: uuid }
        modelId: { type: string }
        status: { type: string, enum: [pending, confirmed, expired, manual_review] }
        entitlementId: { type: [string, 'null'], format: uuid }
        resolution:
          {
            type: string,
            enum: [delivery_owed, delivered, manual_review, refunded, payment_review],
          }
    LikenessCheckoutQuote:
      type: object
      required:
        [
          intentId,
          modelId,
          currency,
          amountBaseUnits,
          amount,
          cluster,
          mint,
          recipient,
          reference,
          transactionBase64,
          expiresAt,
        ]
      properties:
        intentId: { type: string, format: uuid }
        modelId: { type: string }
        currency: { type: string, const: USDC }
        amountBaseUnits: { type: string, example: '3000000' }
        amount: { type: string, example: '3.000000' }
        cluster: { type: string, enum: [mainnet, devnet] }
        mint: { type: string }
        recipient: { type: string }
        reference: { type: string }
        transactionBase64: { type: string }
        expiresAt: { type: string, format: date-time }
    LikenessAvailability:
      type: object
      required:
        [
          enabled,
          reason,
          provider,
          photoUploadEnabled,
          price,
          modes,
          consentVersion,
          supportedModels,
        ]
      properties:
        checkoutAvailable: { type: boolean }
        entitlement:
          oneOf:
            - { type: 'null' }
            - type: object
              required: [id, source]
              properties:
                id: { type: string, format: uuid }
                source: { type: string, enum: [operator_evaluation, verified_purchase] }
        enabled: { type: boolean }
        reason: { type: [string, 'null'] }
        provider: { type: [string, 'null'] }
        photoUploadEnabled: { type: boolean }
        price:
          oneOf:
            - { type: 'null' }
            - type: object
              required: [amount, currency, display]
              properties:
                amount: { type: string, example: '3.00' }
                currency: { type: string, const: USDC }
                display: { type: string, example: '3.00 USDC' }
        modes: { type: array, items: { type: string, enum: [human, stylized] } }
        consentVersion: { type: string, const: likeness-v1 }
        supportedModels:
          type: array
          items:
            type: object
            required: [modelId, mode, enabled, reason]
            properties:
              modelId: { type: string }
              mode: { type: string, enum: [human, stylized] }
              enabled: { type: boolean }
              reason: { type: [string, 'null'] }
    LikenessRequest:
      type: object
      additionalProperties: false
      required: [modelId, uploadId, entitlementId, consent]
      properties:
        modelId: { type: string, pattern: '^[a-z][a-z0-9_]{1,63}$' }
        uploadId: { type: string, format: uuid }
        entitlementId: { type: string, format: uuid }
        consent:
          type: object
          additionalProperties: false
          required: [version, ownPhoto, shareWithProvider]
          properties:
            version: { type: string, const: likeness-v1 }
            ownPhoto: { type: boolean, const: true }
            shareWithProvider: { type: boolean, const: true }
    LikenessJob:
      type: object
      required:
        [id, modelId, mode, status, phase, referenceSha256, failureReason, createdAt, updatedAt]
      properties:
        source: { type: string, enum: [operator_evaluation, verified_purchase] }
        id: { type: string, format: uuid }
        modelId: { type: string }
        mode: { type: string, enum: [human, stylized] }
        status: { type: string, enum: [queued, processing, succeeded, failed, cancelled] }
        phase:
          {
            type: string,
            description: Durable pipeline phase; awaiting_reference_approval needs owner approval; awaiting_asset_validation is not playable completion; reconciliation_required must not be resubmitted.,
          }
        referenceSha256:
          { type: [string, 'null'], description: SHA-256 of the preview being approved }
        failureReason:
          {
            type: [string, 'null'],
            description: Stable sanitized reason; never provider response text,
          }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LikenessManifest:
      type: object
      required:
        [
          jobId,
          modelId,
          sha256,
          bytes,
          triangles,
          joints,
          humanoidBones,
          heightMeters,
          validatorVersion,
        ]
      properties:
        jobId: { type: string, format: uuid }
        modelId: { type: string }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        bytes: { type: integer, minimum: 1, maximum: 16777216 }
        triangles: { type: integer, minimum: 1, maximum: 12000 }
        joints: { type: integer, minimum: 15, maximum: 150 }
        humanoidBones: { type: object, additionalProperties: { type: string } }
        heightMeters: { type: number, const: 1.75 }
        validatorVersion: { type: string, const: ctlife-human-glb-v1 }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: 'One of the codes in contract/ids/errors.json.' }
            message: { type: string }
            details: { type: object, additionalProperties: true }
    AuthChallenge:
      type: object
      required: [nonce, domain, statement, uri, version, chainId, issuedAt, expirationTime]
      properties:
        nonce: { type: string }
        domain: { type: string }
        statement: { type: string }
        uri: { type: string, format: uri }
        version: { type: string }
        chainId: { type: string }
        issuedAt: { type: string, format: date-time }
        expirationTime: { type: string, format: date-time }
    AuthVerifyRequest:
      type: object
      required: [address, signedMessage, signature, nonce]
      properties:
        address: { type: string }
        signedMessage: { type: string }
        signature: { type: string, description: 'base64' }
        nonce: { type: string }
    AuthVerifyResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, wallet, isSeeker, hasCharacter]
      properties:
        id: { type: string, format: uuid }
        wallet: { type: string }
        isSeeker: { type: boolean }
        hasCharacter: { type: boolean }
        skrName: { type: string, nullable: true }
    Me:
      type: object
      required: [user, character, needs, skills, cashCents, debtCents, homeId, minerTier, flags]
      properties:
        user: { $ref: '#/components/schemas/User' }
        character: { $ref: '#/components/schemas/Character' }
        needs: { $ref: '#/components/schemas/Needs' }
        skills: { $ref: '#/components/schemas/Skills' }
        cashCents: { type: integer }
        debtCents: { type: integer }
        debtDueAt:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: Next instalment deadline (Sunday Unlock,
            Sun 20:00 UTC); null with no debt.,
          }
        debtWeeklyDueCents:
          {
            type: integer,
            nullable: true,
            description: Instalment due by debtDueAt,
            capped at debtCents; null with no debt.,
          }
        homeId: { type: string }
        home:
          oneOf:
            - $ref: '#/components/schemas/MeHome'
            - type: 'null'
          description: >-
            The current lease: the newest active or overdue home, else the newest evicted one;
            null for a player with no home (street).
        minerTier: { type: string, enum: [none, prospector, miner, refiner] }
        flags:
          type: object
          additionalProperties: true
          properties:
            firstSession: { $ref: '#/components/schemas/FirstSession' }
    FirstSession:
      type: object
      required: [state, startedAt, completedAt, beats]
      properties:
        state:
          type: string
          enum: [active, skipped, done]
          description: >-
            A new account starts `active`. An account from before the onboarding release reads
            `done` (with null times and no beats). `skipped` after `{skip: true}`.
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        beats:
          type: array
          description: The beats reached, in this order of the set.
          items:
            { type: string, enum: [origin, character, home, moved, shift, trade, quest, chest] }
    Character:
      type: object
      required: [alias, look, tribeId, traitIds, dreamId]
      properties:
        likenessJobId:
          {
            type: [string, 'null'],
            format: uuid,
            description: Owned accepted personal avatar; stock Look remains its declared base.,
          }
        alias: { type: string }
        look: { $ref: '#/components/schemas/Look' }
        tribeId: { type: string }
        traitIds: { type: array, items: { type: string }, minItems: 2, maxItems: 2 }
        dreamId: { type: string }
    Look:
      type: object
      additionalProperties: false
      required: [skinTone, headId, hairId, topId, bottomId, shoesId, accId]
      properties:
        skinTone: { type: string }
        headId: { type: string }
        hairId: { type: string }
        topId: { type: string }
        bottomId: { type: string }
        shoesId: { type: string }
        accId: { type: string }
    CreateCharacterRequest:
      allOf:
        - $ref: '#/components/schemas/Character'
        - type: object
          required: [ageConfirmed]
          properties:
            ageConfirmed: { type: boolean, const: true }
    Needs:
      type: object
      required: [energy, hunger, fun, hygiene, sanity]
      properties:
        energy: { type: integer, minimum: 0, maximum: 100 }
        hunger: { type: integer, minimum: 0, maximum: 100 }
        fun: { type: integer, minimum: 0, maximum: 100 }
        hygiene: { type: integer, minimum: 0, maximum: 100 }
        sanity: { type: integer, minimum: 0, maximum: 100 }
    Skills:
      type: object
      required: [clout, coding, trading, writing, design, security]
      properties:
        clout: { type: integer, minimum: 1, maximum: 10 }
        coding: { type: integer, minimum: 1, maximum: 10 }
        trading: { type: integer, minimum: 1, maximum: 10 }
        writing: { type: integer, minimum: 1, maximum: 10 }
        design: { type: integer, minimum: 1, maximum: 10 }
        security: { type: integer, minimum: 1, maximum: 10 }
    Home:
      type: object
      required: [id, name, rentCents, nextDueAt]
      properties:
        id: { type: string }
        name: { type: string }
      allOf:
        - properties:
            rentCents: { type: integer }
            nextDueAt: { type: string, format: date-time }
    HomeStatus:
      type: string
      enum: [active, overdue, evicted, moved_out]
      description: >-
        `active` to `overdue` on a missed weekly rent, to `evicted` after 4 missed weeks in a
        row. `moved_out` is the owner's choice. Only active and overdue homes hold a unit.
    HomeTier:
      type: string
      enum: [basement, flat, penthouse]
    LeasedHome:
      type: object
      required:
        [
          homeId,
          ownerUserId,
          kind,
          unitId,
          tier,
          roomType,
          status,
          missedWeeks,
          rentCentsPerWeek,
          createdAt,
        ]
      properties:
        homeId: { type: string, description: 'Instance id, `home:<uuid>`; not the kind.' }
        ownerUserId: { type: string, format: uuid }
        kind: { type: string }
        unitId:
          {
            type: [string, 'null'],
            description: 'The door this lease holds; null for a tier without doors, or once given up.',
          }
        tier: { $ref: '#/components/schemas/HomeTier' }
        roomType: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/HomeStatus' }
        missedWeeks: { type: integer, minimum: 0 }
        rentCentsPerWeek: { type: integer }
        decoratedAt: { type: [string, 'null'], format: date-time }
        lastRentPaidAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    MeHome:
      type: object
      required: [homeId, unitId, tier, roomType, status, missedWeeks]
      properties:
        homeId:
          {
            type: string,
            description: 'Instance id, `home:<uuid>`; use it for the /homes/{homeId}/... routes.',
          }
        unitId: { type: [string, 'null'] }
        tier: { $ref: '#/components/schemas/HomeTier' }
        roomType: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/HomeStatus' }
        missedWeeks: { type: integer, minimum: 0 }
    HomeGuests:
      type: object
      required: [homeId, guests]
      properties:
        homeId: { type: string }
        guests: { type: array, items: { type: string, format: uuid } }
    CareerJobList:
      type: array
      items:
        type: object
        required: [id, name, level, xp, active]
        properties:
          id: { type: string }
          name: { type: string }
          level: { type: integer, minimum: 0, maximum: 5 }
          xp: { type: integer, minimum: 0 }
          active: { type: boolean }
    LadderRank:
      type: object
      required: [rank, id, title, xpRequired, payBonusBps, venueAccess, cosmeticId, status]
      properties:
        rank: { type: integer, minimum: 1, maximum: 7 }
        id: { type: string, description: 'intern, junior, mid, senior, lead, head, legend' }
        title: { type: string }
        xpRequired: { type: integer, description: 'Cumulative ladder XP to hold this rank.' }
        payBonusBps:
          type: integer
          description: Extra pay on shifts of the ladder's jobs, in basis points (700 = +7%), rounded down to whole cents.
        venueAccess:
          type: array
          items: { type: string, example: 'perp_pit:high_roller_floor' }
          description: 'Venue-area flags this rank unlocks, `venueId:area`.'
        cosmeticId:
          {
            type: string,
            nullable: true,
            description: 'A `reward_career_*` cosmetic granted on reaching this rank.',
          }
        status: { type: string, enum: [achieved, current, next, locked] }
    LadderView:
      type: object
      required:
        [
          id,
          name,
          tribeIds,
          jobIds,
          active,
          suggested,
          xp,
          rank,
          title,
          payBonusBps,
          nextRank,
          xpToNext,
          ranks,
