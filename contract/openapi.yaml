            schema: { type: string, enum: [new, trending, mine] },
          }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 50 },
          }
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens: { type: array, items: { $ref: '#/components/schemas/FactoryToken' } }
  /factory/tokens/{mint}:
    get:
      tags: [markets]
      operationId: getFactoryToken
      summary: One real token with numbers from the on-chain pool (refreshed at most every 15 s).
      x-phase: 4
      parameters:
        - { name: mint, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FactoryToken' }
        '404': { $ref: '#/components/responses/NotFound' }
  /factory/tokens/{mint}/trades:
