                  ageGate: { type: integer }
                  limits: { type: object, additionalProperties: { type: integer } }
                  estimatedCostSol: { type: number }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /factory/me:
    get:
      tags: [markets]
      operationId: getFactoryMe
      summary: My heat and launch allowance.
      description: >-
        `heat` is 0..100 and halves every 24 hours; at `wanted` the police start a pursuit (see
