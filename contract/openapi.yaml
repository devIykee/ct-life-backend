      description: >-
        The items of `contract/ids/shop_items.json`, with the locker fee and the delivery
        windows. Everything here is bought with game Cash, delivered to the door or a lobby
        locker, and owned off-chain: not an NFT, never tradable. `footprint` (metres) is set
        only for `placeable` items.
      x-phase: 4
      parameters:
        - name: category
          in: query
          required: false
          schema: { type: string, enum: [furniture, decor, appliance, food, clothing] }
      responses:
        '200':
          description: Catalogue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopCatalog' }
        '400': { $ref: '#/components/responses/ValidationFailed' }

  /shop/orders:
    post:
      tags: [shop]
      operationId: postShopOrders
      summary: Order goods for delivery.
      description: >-
        Debits Cash in the same transaction that creates the order: the catalogue price times
        the quantity of every line (the server ignores any client price), plus the locker fee
        for `destination: locker`. Ledger reason `shop_order`. The order is `placed` with an
        `etaAt` of 10 (`asap`), 30 or 60 minutes from now. `door` needs a home with a door;
        a player on the street must use `locker`. At most 10 lines, 10 of each, 20 units per
        order, and 5 orders in flight. A replay with the same `Idempotency-Key` returns the
        same order without charging again. Nothing, real money included, shortens the wait.
      x-phase: 4
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, window, destination]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    required: [itemId, qty]
                    properties:
                      itemId: { type: string }
                      qty: { type: integer, minimum: 1, maximum: 10 }
                window: { type: string, enum: [asap, 30m, 1h] }
                destination: { type: string, enum: [door, locker] }
      responses:
        '201':
          description: The placed order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopOrder' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '402':
          description: Not enough Cash for the items and fee
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: INSUFFICIENT_CASH,
                      message: 'Cash balance is insufficient.',
                      details: { have: '1200', need: '24900' },
                    },
                }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The door needs a home with a door (use `locker`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: NO_HOME_DOOR,
                      message: 'Delivery to the door needs a home with a door; pick the lobby locker.',
                      details: {},
                    },
                }

    get:
      tags: [shop]
      operationId: getShopOrders
      summary: My Duo Shop orders, newest first.
      x-phase: 4
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ShopOrder' }

  /shop/orders/{id}:
    get:
      tags: [shop]
      operationId: getShopOrdersId
      summary: One of my orders.
      description: Owner only. Someone else's order answers `404`, the same as no order.
      x-phase: 4
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopOrder' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }

  /shop/orders/{id}/cancel:
    post:
      tags: [shop]
      operationId: postShopOrdersIdCancel
      summary: Cancel an order that is still `placed`.
      description: >-
        Owner only; full refund (items and locker fee, ledger reason `shop_refund`). Once the
        courier is out (`out_for_delivery`) or the order is `delivered` it can no longer be
        cancelled. Cancelling a cancelled order returns it without a second refund. A cancelled
        order is never delivered.
      x-phase: 4
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The cancelled order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopOrder' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The order is out for delivery or delivered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: ORDER_NOT_CANCELLABLE,
                      message: 'Only an order that is still placed can be cancelled.',
                      details: { status: out_for_delivery },
                    },
                }

  /me/items:
    get:
      tags: [shop]
      operationId: getMeItems
      summary: Items I own (delivered Duo Shop orders).
      description: >-
        One entry per physical unit. Off-chain: bought with Cash, not an NFT, not tradable.
        `placedHomeId` is the home an item stands in, or null.
      x-phase: 4
      responses:
        '200':
          description: Owned items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PlayerItem' }

  /season:
    get:
      tags: [season]
      operationId: getSeason
      summary: The current season, my Season XP and both tracks.
      description: >-
        Season definitions are the contract file `season_tracks.json`. Tier `n` unlocks at
        `n * xpPerTier` Season XP earned inside the season window. Each tier has one reward
        (`cashCents`, `cosmeticId` or `furnitureItemId`); all rewards are off-chain, never
        tradable and never NFTs. Tier `status`: `locked`, `claimable`, `claimed`, or
        `pass_required` (reached on the paid track without a live season pass). XP comes
        from the daily/weekly quests and from nod finds (`nodXp` each); the client never
        sends XP. `404 NOT_FOUND` when no season is running.
      x-phase: 4
      responses:
        '200':
          description: The season
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeasonView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /season/tiers/{n}/claim:
    post:
      tags: [season]
      operationId: postSeasonTiersNClaim
      summary: Claim a tier reward on the free or the paid track.
      description: >-
        Idempotent: a tier pays once; a repeat answers `200` with `alreadyClaimed: true` and
        pays nothing (a replayed `Idempotency-Key` returns the first response). Cash is
        credited with ledger reason `season_reward`; a cosmetic goes to `GET /inventory`
        (source `grant`); furniture goes to `GET /me/items`. The paid track needs a live
        season pass (`403 PASS_REQUIRED`), checked at claim time. Not enough XP is
        `409 TIER_LOCKED`; a tier that is not in the track is `404`.
      x-phase: 4
      parameters:
        - name: n
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: track
          in: query
          required: true
          schema: { type: string, enum: [free, paid] }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeasonClaim' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The paid track needs an active season pass
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: PASS_REQUIRED,
                      message: 'The paid track needs an active season pass.',
                      details: { track: paid, tier: 1 },
                    },
                }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not enough Season XP for this tier yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: TIER_LOCKED,
                      message: 'Not enough Season XP for this tier yet.',
                      details: { tier: 1, track: free, xp: 249, xpRequired: 250 },
                    },
                }

  /season-pass/buy:
    post:
      tags: [season]
      operationId: postSeasonPassBuy
      summary: 'Retired: answers 410 GONE. Buy the pass with POST /payments/intents.'
      description: >-
        The season pass is a real-money product bought through a payment intent
        (`{kind: season_pass, sku: season_pass, currency: USDC}`); it is never bought with
        Cash. Always `410 GONE {reason: buy_with_intent, use: 'POST /v1/payments/intents'}`.
      x-phase: 4
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410':
          description: Retired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: GONE,
                      message: 'This endpoint was removed; see details.use for its replacement.',
                      details: { reason: buy_with_intent, use: 'POST /v1/payments/intents' },
                    },
                }

  /nods:
    get:
      tags: [nods]
      operationId: getNods
      summary: My nods collection book, by set.
      description: >-
        Every set with its member nods, whether I found each, and whether the set reward was
        granted. World positions are never returned.
      x-phase: 4
      responses:
        '200':
          description: The book
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodsBook' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /nods/{nodId}/collect:
    post:
      tags: [nods]
      operationId: postNodsNodIdCollect
      summary: Photograph a nod (collect it once).
      description: >-
        The proof is the nod id plus the client-reported position (island metres). Anti-cheat:
        the find is decided by the SERVER's last position for the player (the one the street,
        venue and vehicles rooms keep in presence), which must be fresh (30 s) and within the
        nod's radius (15 m by default) of the registry position. The client position is only
        a consistency check (more than 30 m from the server position is `400`). No fresh
        server position is `409 POSITION_UNKNOWN`; too far is `409 NOD_TOO_FAR`. Attempts are
        rate limited per player (10 burst, 12 a minute; `429 RATE_LIMITED`). Each nod counts
        once: a repeat answers `200` with `alreadyCollected: true`, no XP and no position
        needed. A new find awards `nodXp` Season XP and, if it fills the set, grants the set
        cosmetic once (`setReward`).
      x-phase: 4
      parameters:
        - name: nodId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proof]
              properties:
                proof:
                  type: object
                  required: [nodId, x, z]
                  properties:
                    nodId: { type: string, description: Must equal the path id. }
                    x: { type: number }
                    z: { type: number }
      responses:
        '200':
          description: The find
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodCollect' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: No fresh server position (`POSITION_UNKNOWN`) or too far from the nod (`NOD_TOO_FAR`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: NOD_TOO_FAR,
                      message: "The server's last position for you is more than the collect radius from this nod.",
                      details: { radiusM: 15, distanceM: 40 },
                    },
                }
        '429': { $ref: '#/components/responses/RateLimited' }

  /nods/leaderboard:
    get:
      tags: [nods]
      operationId: getNodsLeaderboard
      summary: The Hunter board.
      description: >-
        Top 50 by nods found; ties go to whoever reached the count first. `me` is my row with
        my rank even outside the top 50, or null when I have found none.
      x-phase: 4
      responses:
        '200':
          description: The board
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodsLeaderboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /homes/{homeId}/placements:
    put:
      tags: [shop]
      operationId: putHomesHomeIdPlacements
      summary: Set where my items stand in my home.
      description: >-
        Owner only; replaces the whole set (an empty list clears the home). Every item must be
        one of the caller's, `placeable`, and listed once. `x` and `z` are metres in the home's
        interior frame (at most 200 either way), `rotY` is a yaw in radians; at most 200
        placements. An item still placed in a home the caller left moves to this one; one
        placed in another live home is refused.
      x-phase: 4
      parameters:
        - name: homeId
          in: path
          required: true
          description: 'Instance id, `home:<uuid>`.'
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [placements]
              properties:
                placements:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [itemInstanceId, x, z, rotY]
                    properties:
                      itemInstanceId: { type: string, format: uuid }
                      x: { type: number }
                      z: { type: number }
                      rotY: { type: number }
      responses:
        '200':
          description: The home's placements after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomePlacements' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403':
          description: Not the owner of the home, or an item that is not yours
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                notHomeOwner:
                  value:
                    {
                      error:
                        {
                          code: NOT_HOME_OWNER,
                          message: "Only the home's owner can do this.",
                          details: { homeId: 'home:0192a1c2-...' },
                        },
                    }
                itemNotOwned:
                  value:
                    {
                      error:
                        {
                          code: ITEM_NOT_OWNED,
                          message: 'You do not own this item.',
                          details: { itemInstanceId: '0192a1c2-...' },
                        },
                    }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The item is not placeable, or is already placed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                itemNotPlaceable:
                  value:
                    {
                      error:
                        {
                          code: ITEM_NOT_PLACEABLE,
                          message: 'This item cannot be placed in a home.',
                          details: { itemInstanceId: '0192a1c2-...' },
                        },
                    }
                itemAlreadyPlaced:
                  value:
                    {
                      error:
                        {
                          code: ITEM_ALREADY_PLACED,
                          message: 'This item is already placed (in the request twice, or in another home).',
                          details: { itemInstanceId: '0192a1c2-...' },
                        },
                    }

    get:
      tags: [shop]
      operationId: getHomesHomeIdPlacements
      summary: Read a home's placements.
      description: >-
        For anyone who may enter the home's door: the owner and its guests (a home without a
        door is open, like the `home` room). Others get `403 FORBIDDEN`.
      x-phase: 4
      parameters:
        - name: homeId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Placements
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomePlacements' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ads/live:
    get:
      tags: [ads]
      operationId: getAdsLive
      summary: Active creatives by slot. Cache for 5 minutes.
      x-phase: 5
      responses:
        '200':
          description: Live ads
          headers:
            Cache-Control:
              schema: { type: string }
              example: 'public, max-age=300'
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    slotId: { type: string }
                    imageUrl: { type: string }
                    link: { type: string, nullable: true }
                    sponsored: { type: boolean }

  /ads/slots:
    get:
      tags: [ads]
      operationId: getAdsSlots
      summary: Ad slot kinds, terms, USDC prices.
      x-phase: 5
      responses:
        '200':
          description: Slots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdSlot' }

  /uploads:
    post:
      tags: [ads]
      operationId: postUploads
      summary: Upload an ad creative (raw PNG/JPEG body <= 1 MiB).
      description: |
        The body is the raw image bytes with `Content-Type: image/png` or
        `image/jpeg`. The server decodes and re-encodes it (metadata such as
        EXIF is dropped) and binds the upload to the caller; bookings read
        MIME, size and object key from this record.
      x-phase: 5
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                required: [uploadId, url, imageKey, mimeType, sizeBytes, uploadedAt]
                properties:
                  uploadId: { type: string, format: uuid }
                  creativeId: { type: string, format: uuid, description: 'Same as uploadId.' }
                  url: { type: string, description: 'Short-lived signed URL of the stored image.' }
                  imageKey: { type: string }
                  mimeType: { type: string, enum: [image/png, image/jpeg] }
                  sizeBytes: { type: integer }
                  uploadedAt: { type: string, format: date-time }
        '400': { description: Not a valid single-frame PNG/JPEG }
        '413': { description: Larger than 1 MiB }
        '415': { description: Not image/png or image/jpeg }

  /ads/bookings:
    post:
      tags: [ads]
      operationId: postAdsBookings
      summary: Book an ad slot (builds the payment intent).
      description: |
        Reserves the slot's next free window for an owned, unused upload and
        returns a server-priced USDC intent. The booking stays
        `awaiting_payment` until the payment is verified on chain, then moves
        to `pending_review`; only an admin approval makes it `live`. Unpaid
        holds expire with their intent and free the window.
      x-phase: 5
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotId, termId, uploadId, link]
              properties:
                slotId: { type: string }
                termId: { type: string }
                uploadId: { type: string, format: uuid }
                link:
                  type: string
                  description: 'http(s) URL, stored only; never fetched (SSRF safety).'
      responses:
        '201':
          description: Booking
          content:
            application/json:
              schema:
                type: object
                required: [bookingId, intent, booking]
                properties:
                  bookingId: { type: string, format: uuid }
                  intent: { $ref: '#/components/schemas/PaymentIntent' }
                  booking: { $ref: '#/components/schemas/AdBooking' }
                  creative: { type: object }
    get:
      tags: [ads]
      operationId: getAdsBookings
      summary: My bookings, newest first.
      x-phase: 5
      responses:
        '200':
          description: Bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings: { type: array, items: { $ref: '#/components/schemas/AdBooking' } }

  /ads/bookings/{id}:
    get:
      tags: [ads]
      operationId: getAdsBookingsId
      summary: One of my bookings, including any refund receipt.
      x-phase: 5
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Booking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdBooking' }
        '404': { description: Not found or not mine }

  /ads/bookings/{id}/cancel:
    post:
      tags: [ads]
      operationId: postAdsBookingsIdCancel
      summary: Cancel before the ad is live.
      description: Frees the window. A paid booking records its price as an owed refund.
      x-phase: 5
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Cancelled booking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdBooking' }
        '403': { description: Already live or decided }

  /ads/slots/{id}/availability:
    get:
      tags: [ads]
      operationId: getAdsSlotsIdAvailability
      summary: The window and price a booking made now would get.
      x-phase: 5
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: termId, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Availability
          content:
            application/json:
              schema:
                type: object
                required: [slotId, available, nextStartAt, terms]
                properties:
                  slotId: { type: string }
                  available: { type: boolean }
                  nextStartAt: { type: string, format: date-time }
                  terms:
                    type: array
                    items:
                      type: object
                      properties:
                        termId: { type: string }
                        priceUsdc: { type: number }
                        startsAt: { type: string, format: date-time }
                        endsAt: { type: string, format: date-time }

  /ore/board:
    get:
      tags: [ore]
      operationId: getOreBoard
      summary: Current ORE board state (cached 2s).
      x-phase: 2
      responses:
        '200':
          description: Board
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OreBoard' }
              example:
                roundId: 1
                endsAt: '2026-10-05T12:05:00.000Z'
                endsAtSlot: 350000000
                squares: [{ deployedLamports: '1000000000' }, { deployedLamports: '0' }]
                motherlodeOre: '55000000000'
                cityStakedOre: '120000000000'
                priceUsd: '135.20'
        '503':
          description: ORE reader off, or mainnet unreadable with no board from the last 10 minutes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: 'SERVER_BUSY',
                      message: 'Server is at capacity. Retry-After header carries the wait time.',
                      details: { reason: 'ore_reader' },
                    },
                }

  /ore/me:
    get:
      tags: [ore]
      operationId: getOreMe
      summary: My ORE position.
      x-phase: 2
      responses:
        '200':
          description: My ORE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OreMe' }
              example:
                balance: '0'
                staked: '0'
                stOre: '0'
                minerTier: 'none'

  /ore/stake/tx:
    post:
      tags: [ore]
      operationId: postOreStakeTx
      summary: Build an unsigned stake transaction for MWA.
      x-phase: 2
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [deposit, withdraw, claim, compound] }
                amount: { type: string, description: 'Base units. Required for deposit/withdraw.' }
            example:
              action: 'deposit'
              amount: '1000000000'
      responses:
        '200':
          description: Built
          content:
            application/json:
              schema:
