      description: >-
        Takes no body. The first deliberate join is free; moving to a different ladder needs
        `joinCooldownHours` (72) since the last deliberate join, else `409
        CAREER_SWITCH_COOLDOWN` with `details.retryAt`. XP and rank are kept per ladder, so
