      operationId: getShopCatalog
      summary: Duo Shop catalogue (Cash goods and furniture).
      description: >-
        The items of `contract/ids/shop_items.json`, with the locker fee and the delivery
        windows. Everything here is bought with game Cash, delivered to the door or a lobby
        locker, and owned off-chain: not an NFT, never tradable. `footprint` (metres) is set
