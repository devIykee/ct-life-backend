openapi: 3.1.0
info:
  title: CT Life REST API
  version: 1.0.0-rc1
  description: |
    REST v1 for the CT Life backend. Every endpoint is keyed by `x-phase` (1-6)
    and lists the error codes it can return, the auth policy, the idempotency
    contract, the headers it reads, and at least one example response.

    The contract is the source of truth; the Unity client consumes it. Breaking
    changes bump the major version; additive changes bump the minor version
    and are recorded in `contract/CHANGELOG.md`.

    All money is `bigint` cents (field names end in `Cents`) or string base
    units (token amounts). Times are ISO-8601 UTC for REST, epoch milliseconds
    for realtime. The week runs Mon 00:00 to Sun 23:59:59 UTC.
  contact:
    name: deviykee
    url: https://github.com/devIykee/ct-life-backend
  license:
    name: MIT
    url: https://github.com/devIykee/ct-life-backend/blob/main/LICENSE

servers:
  - url: https://api.ctlife.dev/v1
    description: prod
  - url: https://staging-api.ctlife.dev/v1
    description: staging
  - url: http://localhost:4010/v1
    description: local

tags:
  - name: auth
    description: Sign In With Solana, JWT, refresh, JWKS. Phases 1+.
  - name: player
    description: Profile, character, lottery, needs, homes. Phase 1+ except where noted.
  - name: work
    description: Careers, shifts, gigs, daily clue. Phase 1+ except where noted.
  - name: markets
    description: Coin trades, perps, predictions, alpha calls, smart money. Phase 2+.
  - name: social
    description: Public profile, blocks, reports, leaderboards, tombstones, feed, DMs, tips. Phase 1+ except where noted.
  - name: voice
    description: RTC tokens, spaces, free video calls, creator profile, paid calls. Phase 3+.
  - name: payments
    description: Top-up, cosmetic, ad booking, season pass intents. Phase 2+.
  - name: shop
    description: Shop, inventory. Phase 4+.
  - name: ads
    description: Ad slots, uploads, bookings, live creatives. Phase 5+.
  - name: ore
    description: ORE board, my ORE, stake transaction builder. Phase 2+.
  - name: liveops
    description: Active events, weekly meta, push registration. Phase 1+ except where noted.
  - name: admin
    description: Moderation, ad approval, force-price, skill overrides. Backend-only.
  - name: webhooks
    description: Helius and LiveKit signed webhooks. Backend-only.

security:
  - bearerAuth: []

paths:
  /auth/challenge:
    get:
      tags: [auth]
      operationId: getAuthChallenge
      summary: Issue a SIWS challenge (nonce + SIWS message fields).
      description: |
        Returns a single-use nonce (5 min) and the SIWS message fields. The
        client builds `sign_in_payload` for the wallet, signs it, and posts
        the result to `POST /auth/verify`. Anonymous.
      x-phase: 1
      security: []
      responses:
        "200":
          description: Challenge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthChallenge" }
              example:
                nonce: "4e9c7b27-1f0a-4d3e-9a5e-2c7e0d4b3a8f"
                domain: "ctlife.dev"
                statement: "Sign in to CT Life"
                uri: "https://ctlife.dev"
                version: "1"
                chainId: "solana:devnet"
                issuedAt: "2026-10-05T12:00:00.000Z"
                expirationTime: "2026-10-05T12:05:00.000Z"
        "5xx":
          $ref: "#/components/responses/ServerError"

  /auth/verify:
    post:
      tags: [auth]
      operationId: postAuthVerify
      summary: Verify a SIWS signature and issue a JWT pair.
      description: |
        Verifies the Ed25519 signature against the nonce, looks up the Seeker
        Genesis Token on mainnet via Helius, upserts the user, and returns
        `{ accessToken, refreshToken, user }`. Anonymous.
      x-phase: 1
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthVerifyRequest" }
            example:
              address: "Dgw3c4GbQnZe1FeaCa29vXtoyv6fxmxAVyynQw8mN2gZ"
              signedMessage: "ctlife.dev wants you to sign in with your Solana account..."
              signature: "base64-encoded-ed25519-signature"
              nonce: "4e9c7b27-1f0a-4d3e-9a5e-2c7e0d4b3a8f"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthVerifyResponse" }
              example:
                accessToken: "eyJhbGciOiJSUzI1NiIs..."
                refreshToken: "rt_8f4..."
                user:
                  id: "0192a1c2-..."
                  wallet: "Dgw3c4GbQnZe1FeaCa29vXtoyv6fxmxAVyynQw8mN2gZ"
                  isSeeker: true
                  hasCharacter: false
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401":
          description: Nonce invalid, signature invalid, or expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                NONCE_INVALID:
                  value: { error: { code: "NONCE_INVALID", message: "Nonce is missing, used, or expired.", details: {} } }
                SIGNATURE_INVALID:
                  value: { error: { code: "SIGNATURE_INVALID", message: "Ed25519 signature did not verify.", details: {} } }
                TOKEN_EXPIRED:
                  value: { error: { code: "TOKEN_EXPIRED", message: "Access token expired; refresh.", details: {} } }
        "409":
          description: SGT already linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: "SGT_ALREADY_LINKED", message: "This Seeker Genesis Token is already linked to another account.", details: {} } }
        "5xx": { $ref: "#/components/responses/ServerError" }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: postAuthRefresh
      summary: Rotate the refresh token and issue a new pair.
      x-phase: 1
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
            example:
              refreshToken: "rt_8f4..."
      responses:
        "200":
          description: New pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthVerifyResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: postAuthLogout
      summary: Revoke the refresh token.
      x-phase: 1
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/jwks:
    get:
      tags: [auth]
      operationId: getAuthJwks
      summary: Public keys for verifying access tokens.
      x-phase: 1
      security: []
      responses:
        "200":
          description: JWKS
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items: { type: object }
              example:
                keys:
                  - kty: "RSA"
                    kid: "ctlife-1"
                    use: "sig"
                    alg: "RS256"
                    n: "0vx7agoebGcQSuuU..."
                    e: "AQAB"

  /auth/dev:
    post:
      tags: [auth]
      operationId: postAuthDev
      summary: Dev-only auth (no signature). Disabled in staging and prod.
      x-phase: 1
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wallet]
              properties:
                wallet: { type: string }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthVerifyResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404":
          description: ENABLE_DEV_AUTH is not on, or APP_ENV is staging/prod
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: "NOT_FOUND", message: "Endpoint disabled in this environment.", details: {} } }

  /config:
    get:
      tags: [player]
      operationId: getConfig
      summary: All registries and game config.
      description: |
        Returns the full contract snapshot: every ID registry, every config
        file. Cached by `version` and `minClientVersion` (ETag). The
        `degraded` field lists features currently in degraded mode (kill
        switches). Clients with `X-Client-Version` below `minClientVersion`
        receive `CLIENT_OUTDATED` and must update.
      x-phase: 1
      security: []
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
      responses:
        "200":
          description: Config
          headers:
            ETag:
              schema: { type: string }
              description: Strong ETag. Send `If-None-Match` to get 304.
            Cache-Control:
              schema: { type: string }
              example: "public, max-age=60"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigResponse" }
              example:
                version: "1.0.0-rc1"
                minClientVersion: "1.0.0-rc1"
                degraded: []
                venues: { "timeline_square": { "name": "Timeline Square", "maxClients": 50 } }
        "304": { description: Not modified; ETag matches. }
        "426":
          description: Client outdated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: "CLIENT_OUTDATED", message: "Update required. X-Client-Version is below minClientVersion.", details: { "minClientVersion": "1.0.0-rc1" } } }
        "5xx": { $ref: "#/components/responses/ServerError" }

  /me:
    get:
      tags: [player]
      operationId: getMe
      summary: Current player state.
      x-phase: 1
      responses:
        "200":
          description: Me
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
              example:
                user:
                  id: "0192a1c2-..."
                  wallet: "Dgw3c4GbQnZe1FeaCa29vXtoyv6fxmxAVyynQw8mN2gZ"
                  isSeeker: true
                  skrName: "anon"
                character:
                  alias: "anon"
                  look: { skinTone: "tan", headId: "head_skull_visor", hairId: "hair_mohawk_pink", topId: "top_hoodie_black", bottomId: "bottom_jeans_indigo", shoesId: "shoes_sneakers_white", accId: "acc_aviators" }
                  tribeId: "trencher"
                  traitIds: ["fast_talker", "iron_will"]
                  dreamId: "make_10k"
                needs: { energy: 50, hunger: 50, fun: 50, hygiene: 50, sanity: 50 }
                skills: { clout: 1, coding: 1, trading: 1, writing: 1, design: 1, security: 1 }
                cashCents: 150000
                debtCents: 0
                homeId: "hacker_house"
                minerTier: "none"
                flags: {}
        "401": { $ref: "#/components/responses/Unauthorized" }

  /characters:
    post:
      tags: [player]
      operationId: postCharacter
      summary: Create the character for the current user.
      description: |
        Allowed once per user. `ageConfirmed: true` is required. The lottery
        roll is forced before the character is created on a later milestone
        (call `POST /lottery/roll`). The character's look is locked until
        `PATCH /characters/me/look` in Phase 4.
      x-phase: 1
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCharacterRequest" }
            example:
              alias: "anon"
              look:
                skinTone: "tan"
                headId: "head_skull_visor"
                hairId: "hair_mohawk_pink"
                topId: "top_hoodie_black"
                bottomId: "bottom_jeans_indigo"
                shoesId: "shoes_sneakers_white"
                accId: "acc_aviators"
              traitIds: ["fast_talker", "iron_will"]
              dreamId: "make_10k"
              tribeId: "trencher"
              ageConfirmed: true
      responses:
        "200":
          description: Character
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Character" }
        "400":
          description: Validation failed (ageConfirmed missing, invalid look, etc.)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: "VALIDATION_FAILED", message: "Request body or params failed validation.", details: { "field": "ageConfirmed" } } }
        "409":
          description: Alias already taken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: "ALIAS_TAKEN", message: "Alias is taken.", details: {} } }
        "429": { $ref: "#/components/responses/RateLimited" }

  /lottery/roll:
    post:
      tags: [player]
      operationId: postLotteryRoll
      summary: Roll the birth lottery once.
      description: |
        Returns one of `seeker` (only if the wallet has a verified Seeker
        Genesis Token), `insider`, or `exit_liquidity`. The weights in
        `lottery.json` decide the outcome. Allowed once per account.
      x-phase: 1
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Outcome
          content:
            application/json:
              schema:
                type: object
                required: [outcome, cashCents, debtCents, homeId]
                properties:
                  outcome: { type: string, enum: [seeker, insider, exit_liquidity] }
                  cashCents: { type: integer }
                  debtCents: { type: integer }
                  homeId: { type: string }
              example:
                outcome: "insider"
                cashCents: 300000
                debtCents: 0
                homeId: "studio"
        "409":
          description: Already rolled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: "ALREADY_ROLLED", message: "Birth lottery has already been rolled for this account.", details: {} } }

  /needs/actions:
    post:
      tags: [player]
      operationId: postNeedsAction
      summary: Apply a needs action (eat, sleep, shower, touch_grass, party).
      x-phase: 1
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actionId]
              properties:
                actionId: { type: string, enum: [eat, sleep, shower, touch_grass, party] }
            example: { actionId: "eat" }
      responses:
        "200":
          description: Updated needs and cash
          content:
            application/json:
              schema:
                type: object
                required: [needs, cashCents]
                properties:
                  needs: { $ref: "#/components/schemas/Needs" }
                  cashCents: { type: integer }
              example:
                needs: { energy: 50, hunger: 80, fun: 50, hygiene: 50, sanity: 50 }
                cashCents: 150000
        "400":
          description: Action not allowed here (party requires club venue) or invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: "VALIDATION_FAILED", message: "Action 'party' is only allowed in club venues.", details: { "venueId": "timeline_square" } } }
        "402":
          description: Insufficient cash (e.g. restaurant order in M4)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: "INSUFFICIENT_CASH", message: "Cash balance is insufficient.", details: { "shortfallCents": 50000 } } }

  /characters/me/look:
    patch:
      tags: [player]
      operationId: patchCharactersMeLook
      summary: Change the character's look.
      x-phase: 4
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Look" }
      responses:
        "200":
          description: Character
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Character" }
        "400": { $ref: "#/components/responses/ValidationFailed" }

  /homes:
    get:
      tags: [player]
      operationId: getHomes
      summary: List available homes.
      x-phase: 4
      responses:
        "200":
          description: Homes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Home" }
              example:
                - { id: "parents_basement", name: "Parent's Basement", rentCents: 2000, nextDueAt: "2026-10-12T20:00:00.000Z" }
                - { id: "hacker_house", name: "Hacker House", rentCents: 6000, nextDueAt: "2026-10-12T20:00:00.000Z" }

  /homes/{homeId}/rent:
    post:
      tags: [player]
      operationId: postHomesHomeIdRent
      summary: Sign a lease for the given home.
      x-phase: 4
      parameters:
        - name: homeId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Lease signed
          content:
            application/json:
              schema:
                type: object
                required: [homeId, rentCents, nextDueAt]
                properties:
                  homeId: { type: string }
                  rentCents: { type: integer }
                  nextDueAt: { type: string, format: date-time }
        "402":
          description: Insufficient cash for deposit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: "INSUFFICIENT_CASH", message: "Cash balance is insufficient.", details: { "shortfallCents": 2000 } } }

  /homes/{ownerId}/visit:
    post:
      tags: [player]
      operationId: postHomesOwnerIdVisit
      summary: Visit a player's home and join their `home` room.
      x-phase: 4
      parameters:
        - name: ownerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Room to join
          content:
            application/json:
              schema:
                type: object
                required: [roomId]
                properties:
                  roomId: { type: string, description: "Pass to `client.joinById(roomId)`." }
              example: { roomId: "home:0192a1c2-..." }

  /characters/me/tribe:
    patch:
      tags: [player]
      operationId: patchCharactersMeTribe
      summary: Change tribe (once per season).
      x-phase: 6
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tribeId]
              properties:
                tribeId: { type: string }
      responses:
        "200":
          description: Character
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Character" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /careers:
    get:
      tags: [work]
      operationId: getCareers
      summary: All careers with my level and XP.
      x-phase: 1
      responses:
        "200":
          description: Careers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, level, xp, active]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    level: { type: integer, minimum: 0, maximum: 5 }
                    xp: { type: integer, minimum: 0 }
                    active: { type: boolean }

  /careers/{careerId}/apply:
    post:
      tags: [work]
      operationId: postCareersCareerIdApply
      summary: Apply for a career.
      x-phase: 1
      parameters:
        - name: careerId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /shifts:
    post:
      tags: [work]
      operationId: postShifts
      summary: Start a shift.
      x-phase: 1
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [careerId]
              properties:
                careerId: { type: string }
      responses:
        "200":
          description: Shift
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shift" }
              example:
                shiftId: "shift_0192a1c2-..."
                miniGameIds: ["discord_mod_ban"]
                endsAt: "2026-10-05T12:01:00.000Z"

  /shifts/{shiftId}/complete:
    post:
      tags: [work]
      operationId: postShiftsShiftIdComplete
      summary: Complete a shift with the per-mini-game scores.
      description: |
        Scores are capped at `maxScore` from `mini_games.json`. The shift
        cannot be completed before `endsAt` (returns `SHIFT_NOT_FINISHED`).
        XP and pay are derived from the scores and the level's pay formula.
      x-phase: 1
      parameters:
        - name: shiftId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [results]
              properties:
                results:
                  type: array
                  items:
                    type: object
                    required: [miniGameId, score]
                    properties:
                      miniGameId: { type: string }
                      score: { type: integer, minimum: 0 }
            example:
              results:
                - { miniGameId: "discord_mod_ban", score: 8 }
      responses:
        "200":
          description: Pay and XP
          content:
            application/json:
              schema:
                type: object
                required: [payCents, xp, promoted]
                properties:
                  payCents: { type: integer }
                  xp: { type: integer }
                  promoted: { type: boolean }
              example:
                payCents: 5500
                xp: 120
                promoted: false
        "400":
          description: Shift not finished or score invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: "SHIFT_NOT_FINISHED", message: "Shift cannot be completed before durationSec has elapsed.", details: { "endsAt": "2026-10-05T12:01:00.000Z" } } }

  /gigs:
    get:
      tags: [work]
      operationId: getGigs
      summary: All gigs available to the current user.
      x-phase: 4
      responses:
        "200":
          description: Gigs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Gig" }

  /gigs/{gigId}/run:
    post:
      tags: [work]
      operationId: postGigsGigIdRun
      summary: Run a gig.
      x-phase: 4
      parameters:
        - name: gigId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Gig result
          content:
            application/json:
              schema:
                type: object
                required: [payCents, outcomeId]
                properties:
                  payCents: { type: integer }
                  outcomeId: { type: string }
        "429":
          description: Cooldown not elapsed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: "RATE_LIMITED", message: "Rate limit exceeded; try again later.", details: { "retryAfterMs": 30000 } } }

  /daily-clue:
    get:
      tags: [work]
      operationId: getDailyClue
      summary: Today's clue.
      x-phase: 4
      responses:
        "200":
          description: Clue
          content:
            application/json:
              schema:
                type: object
                required: [clueText, expiresAt]
                properties:
                  clueText: { type: string }
                  expiresAt: { type: string, format: date-time }

  /daily-clue/answer:
    post:
      tags: [work]
      operationId: postDailyClueAnswer
      summary: Submit the daily clue answer.
      x-phase: 4
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { type: string }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
                required: [correct, prizeCents]
                properties:
                  correct: { type: boolean }
                  prizeCents: { type: integer }
              example: { correct: true, prizeCents: 5000 }

  /market/coins:
    get:
      tags: [markets]
      operationId: getMarketCoins
      summary: List live coins filtered by stage.
      x-phase: 2
      parameters:
        - name: stage
          in: query
          required: false
          schema: { type: string, enum: [new, final, graduated, dead] }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Coins
          content:
            application/json:
              schema:
                type: object
                required: [coins, nextCursor]
                properties:
                  coins:
                    type: array
                    items: { $ref: "#/components/schemas/Coin" }
                  nextCursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /market/coins/{coinId}:
    get:
      tags: [markets]
      operationId: getMarketCoin
      summary: Coin detail with candles and top holders.
      description: |
        `riskHint` is gated by the player's `security` skill. Low-skill
        players get a generic "do your own research" string; high-skill
        players get a more detailed rug-risk estimate.
      x-phase: 2
      parameters:
        - name: coinId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Coin detail
          content:
            application/json:
              schema:
                type: object
                required: [coin, candles1m, topHolders, riskHint]
                properties:
                  coin: { $ref: "#/components/schemas/Coin" }
                  candles1m:
                    type: array
                    items: { $ref: "#/components/schemas/Candle" }
                  topHolders:
                    type: array
                    items: { $ref: "#/components/schemas/Holder" }
                  riskHint: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /market/trades:
    post:
      tags: [markets]
      operationId: postMarketTrades
      summary: Buy or sell a coin.
      description: |
        Buy with `cashCents`, sell with `units`. The price is computed from
        the constant-product curve plus the buy/sell fee. If the executed
        price is worse than `maxSlippageBps` from the quote price, returns
        `SLIPPAGE_EXCEEDED`.
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [coinId, side]
              properties:
                coinId: { type: string, format: uuid }
                side: { type: string, enum: [buy, sell] }
                cashCents: { type: integer, minimum: 0 }
                units: { type: string, description: "Base units as a string." }
                maxSlippageBps: { type: integer, minimum: 0, maximum: 10000 }
            example:
              coinId: "0192a1c2-..."
              side: "buy"
              cashCents: 100000
              maxSlippageBps: 200
      responses:
        "200":
          description: Trade
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trade" }
              example:
                tradeId: "trade_0192a1c2-..."
                units: "1000000"
                priceMicros: 15000
                feeCents: 100
                cashCents: 100000
        "400":
          description: Slippage exceeded or insufficient cash
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                SLIPPAGE_EXCEEDED:
                  value: { error: { code: "SLIPPAGE_EXCEEDED", message: "Trade would execute at a worse price than your maxSlippageBps.", details: { "executedBps": 350 } } }
                INSUFFICIENT_CASH:
                  value: { error: { code: "INSUFFICIENT_CASH", message: "Cash balance is insufficient.", details: { "shortfallCents": 100000 } } }

  /market/positions:
    get:
      tags: [markets]
      operationId: getMarketPositions
      summary: My positions with unrealized PnL.
      x-phase: 2
      responses:
        "200":
          description: Positions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Position" }

  /perps:
    get:
      tags: [markets]
      operationId: getPerps
      summary: My perps filtered by status.
      x-phase: 2
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [open, closed] }
      responses:
        "200":
          description: Perps
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Perp" }
    post:
      tags: [markets]
      operationId: postPerps
      summary: Open a perp.
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [coinId, side, leverage, marginCents]
              properties:
                coinId: { type: string, format: uuid }
                side: { type: string, enum: [long, short] }
                leverage: { type: integer, minimum: 1, maximum: 20 }
                marginCents: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Perp
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Perp" }
        "400":
          description: Leverage exceeds the cap from Trading skill + tribe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: "LEVERAGE_NOT_ALLOWED", message: "Leverage exceeds the cap from your Trading skill and tribe.", details: { "requested": 5, "max": 2 } } }
        "402":
          description: Insufficient cash
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: "INSUFFICIENT_CASH", message: "Cash balance is insufficient.", details: { "shortfallCents": 50000 } } }

  /perps/{perpId}/close:
    post:
      tags: [markets]
      operationId: postPerpsPerpIdClose
      summary: Close a perp.
      x-phase: 2
      parameters:
        - name: perpId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Closed perp with realized PnL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Perp" }
        "404": { $ref: "#/components/responses/NotFound" }

  /predictions:
    get:
      tags: [markets]
