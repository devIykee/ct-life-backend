          description: Call
          content:
            application/json:
              schema:
                type: object
                required: [callId]
                properties:
                  callId: { type: string, format: uuid }

  /creator:
    put:
      tags: [voice]
      operationId: putCreator
      summary: Set the creator profile (paid-call rate and max minutes).
      description: |
        `ratePerMinUsdc` is a string of base units, between 250000 and
        50000000 (0.25 to 50 USDC). `maxMinutes` is 1 to 60.
      x-phase: 3
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, ratePerMinUsdc, maxMinutes]
              properties:
                enabled: { type: boolean }
                ratePerMinUsdc: { type: string, pattern: "^[0-9]+$" }
                maxMinutes: { type: integer, minimum: 1, maximum: 60 }
            example:
              enabled: true
              ratePerMinUsdc: "2000000"
              maxMinutes: 10
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorProfile" }
        "400":
          description: Rate out of range
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: "VALIDATION_FAILED", message: "ratePerMinUsdc must be between 250000 and 50000000.", details: {} } }

  /paid-calls:
    post:
      tags: [voice]
      operationId: postPaidCalls
      summary: Open a paid call (builds the open_session transaction).
      description: |
        Returns `{ callId, sessionPda, tx }` where `tx` is an unsigned v0
        base64 transaction to be signed with MWA `sign_and_send_transactions`.
      x-phase: 3
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [creatorId, minutes]
              properties:
                creatorId: { type: string, format: uuid }
                minutes: { type: integer, minimum: 1, maximum: 60 }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [callId, sessionPda, tx]
                properties:
                  callId: { type: string, format: uuid }
                  sessionPda: { type: string }
                  tx: { type: string, description: "base64 v0 transaction." }

  /paid-calls/{id}/submitted:
    post:
      tags: [voice]
      operationId: postPaidCallsIdSubmitted
      summary: Report the open_session signature.
      x-phase: 3
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signature]
              properties:
                signature: { type: string }
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaidCall" }

  /paid-calls/{id}/accept:
    post:
      tags: [voice]
      operationId: postPaidCallsIdAccept
      summary: Creator accepts the call.
      x-phase: 3
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaidCall" }

  /paid-calls/{id}/decline:
    post:
      tags: [voice]
      operationId: postPaidCallsIdDecline
      summary: Creator declines the call.
      x-phase: 3
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Declined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaidCall" }

  /paid-calls/{id}/end:
    post:
      tags: [voice]
      operationId: postPaidCallsIdEnd
      summary: End the call early.
      x-phase: 3
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Ended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaidCall" }

  /paid-calls/{id}:
    get:
      tags: [voice]
      operationId: getPaidCall
      summary: Paid-call status.
      x-phase: 3
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Paid call
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaidCall" }
              example:
                callId: "0192a1c2-..."
                status: "live"
                minutesUsed: 5
                creatorAmount: "10000000"
                refundAmount: "0"

  /payments/intents:
    post:
      tags: [payments]
      operationId: postPaymentsIntents
      summary: Build a payment intent.
      description: |
        The intent locks in the live quote and the bonus bps at the time
        of creation. The client signs `tx` with MWA, polls
        `GET /payments/intents/{id}`, and the city room emits
        `payment_confirmed` once the on-chain transfer is verified.
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, sku, currency]
              properties:
                kind: { type: string, enum: [topup, cosmetic, ad, season_pass] }
                sku: { type: string }
                currency: { type: string, enum: [USDC, SOL, SKR, ORE] }
            example:
              kind: "topup"
              sku: "whale"
              currency: "USDC"
      responses:
        "200":
          description: Intent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntent" }
              example:
                intentId: "0192a1c2-..."
                currency: "USDC"
                recipient: "Dgw3c4GbQ..."
                mint: "EPjFWdd5..."
                amount: "10000000"
                cashCents: 700000
                bonusBps: 0
                reference: "ref_..."
                memo: "0192a1c2-..."
                tx: "base64..."
                solanaPayUrl: "solana:..."
                expiresAt: "2026-10-05T12:10:00.000Z"
        "429":
          description: Top-up cap reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: "TOPUP_CAP_REACHED", message: "100 USDC of top-ups per wallet per day exceeded.", details: { "dayTotalCents": 1000000 } } }
        "503":
          description: Price feed down
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: "SERVER_BUSY", message: "Server is at capacity. Retry-After header carries the wait time.", details: {} } }

  /payments/intents/{id}:
    get:
      tags: [payments]
      operationId: getPaymentsIntentsId
      summary: Poll the intent status.
      x-phase: 2
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Intent
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [pending, confirmed, expired, failed] }
                  signature: { type: string, nullable: true }
        "410":
          description: Intent expired before confirmation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: "PAYMENT_EXPIRED", message: "Payment intent expired before it was confirmed.", details: {} } }

  /shop:
    get:
      tags: [shop]
      operationId: getShop
      summary: Shop listings (Cash items only).
      x-phase: 4
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShopItem" }

  /shop/purchase:
    post:
      tags: [shop]
      operationId: postShopPurchase
      summary: Buy a Cash item.
      x-phase: 4
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId: { type: string }
      responses:
        "200":
          description: Inventory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inventory" }
        "402":
          description: Insufficient cash
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /inventory:
    get:
      tags: [shop]
      operationId: getInventory
      summary: My inventory.
      x-phase: 4
      responses:
        "200":
          description: Inventory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inventory" }

  /ads/live:
    get:
      tags: [ads]
      operationId: getAdsLive
      summary: Active creatives by slot. Cache for 5 minutes.
      x-phase: 5
      responses:
        "200":
          description: Live ads
          headers:
            Cache-Control:
              schema: { type: string }
              example: "public, max-age=300"
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
