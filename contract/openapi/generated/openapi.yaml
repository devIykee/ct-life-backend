  /ads/bookings:
    post:
      tags: [ads]
      operationId: postAdsBookings
      summary: Book an ad slot (builds the payment intent).
      x-phase: 5
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotId, termId, uploadId]
              properties:
                slotId: { type: string }
                termId: { type: string }
                uploadId: { type: string, format: uuid }
                link: { type: string, description: "Stored only; never fetched (SSRF safety)." }
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema:
                type: object
                required: [bookingId, intent]
                properties:
                  bookingId: { type: string, format: uuid }
                  intent: { $ref: "#/components/schemas/PaymentIntent" }

  /ore/board:
    get:
      tags: [ore]
      operationId: getOreBoard
      summary: Current ORE board state (cached 2s).
      x-phase: 2
      responses:
        "200":
          description: Board
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OreBoard" }
              example:
                roundId: 1
                endsAt: "2026-10-05T12:05:00.000Z"
                endsAtSlot: 350000000
                squares: [{ deployedLamports: "1000000000" }, { deployedLamports: "0" }]
                motherlodeOre: "55000000000"
                cityStakedOre: "120000000000"
                priceUsd: "135.20"

  /ore/me:
    get:
      tags: [ore]
      operationId: getOreMe
      summary: My ORE position.
      x-phase: 2
      responses:
        "200":
          description: My ORE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OreMe" }
              example:
                balance: "0"
                staked: "0"
                stOre: "0"
                minerTier: "none"

  /ore/stake/tx:
    post:
      tags: [ore]
      operationId: postOreStakeTx
      summary: Build an unsigned stake transaction for MWA.
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [deposit, withdraw, claim, compound] }
                amount: { type: string, description: "Base units. Required for deposit/withdraw." }
            example:
              action: "deposit"
              amount: "1000000000"
      responses:
        "200":
          description: Built
          content:
            application/json:
              schema:
                type: object
                required: [tx]
                properties:
                  tx: { type: string, description: "base64 v0 transaction" }

  /events/active:
    get:
      tags: [liveops]
      operationId: getEventsActive
      summary: Server events currently active.
      x-phase: 1
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServerEvent" }

  /meta/current:
    get:
      tags: [liveops]
      operationId: getMetaCurrent
      summary: The Weekly Meta bonus for this week.
      x-phase: 4
      responses:
        "200":
          description: Meta
