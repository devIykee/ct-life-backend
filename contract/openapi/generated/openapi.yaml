  /admin/bans:
    post:
      tags: [admin]
      operationId: postAdminBans
      summary: Ban a user.
      x-phase: 1
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, reasonId, until]
              properties:
                userId: { type: string, format: uuid }
                reasonId: { type: string }
                until: { type: string, format: date-time }
      responses:
        "204": { description: Banned }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/ads/approve:
    post:
      tags: [admin]
      operationId: postAdminAdsApprove
      summary: Approve a pending ad booking.
      x-phase: 5
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookingId]
              properties:
                bookingId: { type: string, format: uuid }
      responses:
        "204": { description: Approved }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/market/force-price:
    post:
      tags: [admin]
      operationId: postAdminMarketForcePrice
      summary: Force a coin's price (staging only).
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [coinId, priceMicros]
              properties:
                coinId: { type: string, format: uuid }
                priceMicros: { type: integer, minimum: 1 }
      responses:
        "204": { description: Forced }
        "403":
          description: Disabled in prod
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/users/{id}/skills:
    post:
      tags: [admin]
      operationId: postAdminUsersIdSkills
      summary: Override a user's skills (staging only).
      x-phase: 2
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clout: { type: integer, minimum: 1, maximum: 10 }
                coding: { type: integer, minimum: 1, maximum: 10 }
                trading: { type: integer, minimum: 1, maximum: 10 }
                writing: { type: integer, minimum: 1, maximum: 10 }
                design: { type: integer, minimum: 1, maximum: 10 }
                security: { type: integer, minimum: 1, maximum: 10 }
      responses:
        "204": { description: Updated }
        "403":
          description: Disabled in prod
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /webhooks/helius:
    post:
      tags: [webhooks]
      operationId: postWebhooksHelius
      summary: Helius webhook (HMAC verified).
      x-phase: 2
      responses:
        "200": { description: Acknowledged }
        "401":
          description: HMAC invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /webhooks/livekit:
    post:
      tags: [webhooks]
      operationId: postWebhooksLivekit
      summary: LiveKit webhook (JWT verified).
      x-phase: 3
      responses:
        "200": { description: Acknowledged }
        "401":
          description: JWT invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUIDv4 generated by the client. The server dedupes for 24 h and
        replays the first response and status. Same key with a different
        body hash returns `VALIDATION_FAILED`. Concurrent requests with
        the same key are serialized.
      schema: { type: string, format: uuid }
    XClientVersion:
      name: X-Client-Version
      in: header
      required: false
      description: Client version. Below `minClientVersion` returns `CLIENT_OUTDATED`.
      schema: { type: string }
    XContractVersion:
      name: X-Contract-Version
      in: header
      required: false
      description: Optional override; defaults to the latest signed contract.
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the previous call.
      schema: { type: string }
  responses:
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: "TOKEN_EXPIRED", message: "Access token expired; refresh.", details: {} } }
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: "FORBIDDEN", message: "Caller is not allowed to perform this action.", details: {} } }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: "NOT_FOUND", message: "Resource not found.", details: {} } }
    ValidationFailed:
      description: Body or params failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: "VALIDATION_FAILED", message: "Request body or params failed validation.", details: { "field": "ageConfirmed" } } }
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer, description: "Seconds until retry." }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: "RATE_LIMITED", message: "Rate limit exceeded; try again later.", details: { "retryAfterMs": 1000 } } }
    ServerError:
      description: Server is at capacity or temporarily unavailable
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: "SERVER_BUSY", message: "Server is at capacity. Retry-After header carries the wait time.", details: {} } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: "One of the codes in contract/ids/errors.json." }
            message: { type: string }
            details: { type: object, additionalProperties: true }
    AuthChallenge:
      type: object
      required: [nonce, domain, statement, uri, version, chainId, issuedAt, expirationTime]
      properties:
        nonce: { type: string }
        domain: { type: string }
        statement: { type: string }
        uri: { type: string, format: uri }
        version: { type: string }
        chainId: { type: string }
        issuedAt: { type: string, format: date-time }
        expirationTime: { type: string, format: date-time }
    AuthVerifyRequest:
      type: object
      required: [address, signedMessage, signature, nonce]
      properties:
        address: { type: string }
        signedMessage: { type: string }
        signature: { type: string, description: "base64" }
        nonce: { type: string }
    AuthVerifyResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user: { $ref: "#/components/schemas/User" }
    User:
      type: object
      required: [id, wallet, isSeeker, hasCharacter]
      properties:
        id: { type: string, format: uuid }
        wallet: { type: string }
        isSeeker: { type: boolean }
        hasCharacter: { type: boolean }
        skrName: { type: string, nullable: true }
    Me:
      type: object
      required: [user, character, needs, skills, cashCents, debtCents, homeId, minerTier, flags]
      properties:
        user: { $ref: "#/components/schemas/User" }
        character: { $ref: "#/components/schemas/Character" }
        needs: { $ref: "#/components/schemas/Needs" }
        skills: { $ref: "#/components/schemas/Skills" }
        cashCents: { type: integer }
        debtCents: { type: integer }
        homeId: { type: string }
        minerTier: { type: string, enum: [none, prospector, miner, refiner] }
        flags: { type: "object", additionalProperties: true }
    Character:
      type: object
      required: [alias, look, tribeId, traitIds, dreamId]
      properties:
        alias: { type: string }
        look: { $ref: "#/components/schemas/Look" }
        tribeId: { type: string }
        traitIds: { type: array, items: { type: string }, minItems: 2, maxItems: 2 }
        dreamId: { type: string }
    Look:
      type: object
      required: [skinTone, headId, hairId, topId, bottomId, shoesId, accId]
      properties:
        skinTone: { type: string }
        headId: { type: string }
        hairId: { type: string }
        topId: { type: string }
        bottomId: { type: string }
        shoesId: { type: string }
        accId: { type: string }
    CreateCharacterRequest:
      allOf:
        - $ref: "#/components/schemas/Character"
        - type: object
          required: [ageConfirmed]
          properties:
            ageConfirmed: { type: boolean, const: true }
    Needs:
      type: object
      required: [energy, hunger, fun, hygiene, sanity]
      properties:
        energy: { type: integer, minimum: 0, maximum: 100 }
        hunger: { type: integer, minimum: 0, maximum: 100 }
        fun: { type: integer, minimum: 0, maximum: 100 }
        hygiene: { type: integer, minimum: 0, maximum: 100 }
        sanity: { type: integer, minimum: 0, maximum: 100 }
    Skills:
      type: object
      required: [clout, coding, trading, writing, design, security]
      properties:
        clout: { type: integer, minimum: 1, maximum: 10 }
        coding: { type: integer, minimum: 1, maximum: 10 }
        trading: { type: integer, minimum: 1, maximum: 10 }
        writing: { type: integer, minimum: 1, maximum: 10 }
        design: { type: integer, minimum: 1, maximum: 10 }
        security: { type: integer, minimum: 1, maximum: 10 }
    Home:
      type: object
      required: [id, name, rentCents, nextDueAt]
      properties:
        id: { type: string }
        name: { type: string }
      allOf:
        - properties:
            rentCents: { type: integer }
            nextDueAt: { type: string, format: date-time }
    Job:
      type: object
      required: [careerId, level, xp]
      properties:
        careerId: { type: string }
        level: { type: integer, minimum: 1, maximum: 5 }
        xp: { type: integer, minimum: 0 }
    Shift:
      type: object
      required: [shiftId, miniGameIds, endsAt]
      properties:
        shiftId: { type: string }
        miniGameIds: { type: array, items: { type: string } }
        endsAt: { type: string, format: date-time }
    Gig:
      type: object
      required: [id, name, durationSec, payCents, cooldownSec]
      properties:
        id: { type: string }
        name: { type: string }
        durationSec: { type: integer }
        payCents: { type: integer }
        cooldownSec: { type: integer }
    ConfigResponse:
      type: object
      required: [version, minClientVersion, degraded]
      properties:
        version: { type: string }
        minClientVersion: { type: string }
        degraded:
          type: array
          description: |
            List of features currently in degraded mode. Read on every
            `/config` response and disable those surfaces. Possible values:
            `voice`, `llm`, `feed`, `npc_density`, `venue_cap`, `board_refresh`,
            `smart_money`, `dms`, `ore_reader`, `signup`, `rate_limit`,
            `login`, `price_feed`, `helius`, `ledger_freeze`, `login_ip_only`.
          items: { type: string }
        venues: { type: object, additionalProperties: true }
        archetypes: { type: object, additionalProperties: true }
        tribes: { type: object, additionalProperties: true }
        careers: { type: object, additionalProperties: true }
        market: { type: object, additionalProperties: true }
        events: { type: object, additionalProperties: true }
        npc_lines: { type: object, additionalProperties: true }
        ads: { type: object, additionalProperties: true }
        ore: { type: object, additionalProperties: true }
        meta: { type: object, additionalProperties: true }
    PublicProfile:
      type: object
      required: [id, alias, skrName, isSeeker, tribeId, minerTier, look, netWorthCents]
      properties:
        id: { type: string, format: uuid }
        alias: { type: string }
        skrName: { type: string, nullable: true }
        isSeeker: { type: boolean }
        tribeId: { type: string }
        minerTier: { type: string, enum: [none, prospector, miner, refiner] }
        look: { $ref: "#/components/schemas/Look" }
        netWorthCents: { type: integer }
    Coin:
      type: object
      required: [coinId, ticker, name, stage, priceMicros, mcapCents, vol5mCents, change5mBps, holders, launchedAt]
      properties:
        coinId: { type: string, format: uuid }
        ticker: { type: string }
        name: { type: string }
        stage: { type: string, enum: [new, final, graduated, dead] }
        priceMicros: { type: integer }
        mcapCents: { type: integer }
        vol5mCents: { type: integer }
        change5mBps: { type: integer }
        holders: { type: integer }
        launchedAt: { type: string, format: date-time }
    Candle:
      type: object
      required: [openTime, open, high, low, close, volume]
      properties:
        openTime: { type: string, format: date-time }
        open: { type: integer }
        high: { type: integer }
        low: { type: integer }
        close: { type: integer }
        volume: { type: integer }
    Holder:
      type: object
      required: [userId, alias, units, pct]
      properties:
        userId: { type: string, format: uuid }
        alias: { type: string }
        units: { type: string }
        pct: { type: integer, description: "Billionths of total supply." }
    Trade:
      type: object
      required: [tradeId, units, priceMicros, feeCents, cashCents]
      properties:
        tradeId: { type: string }
        units: { type: string }
        priceMicros: { type: integer }
        feeCents: { type: integer }
        cashCents: { type: integer }
    Position:
      type: object
      required: [positionId, coinId, units, costBasisCents, unrealizedCents]
      properties:
        positionId: { type: string, format: uuid }
        coinId: { type: string, format: uuid }
        units: { type: string }
        costBasisCents: { type: integer }
        unrealizedCents: { type: integer }
    Perp:
      type: object
      required: [perpId, coinId, side, leverage, marginCents, entryMicros, liqMicros, status]
      properties:
        perpId: { type: string, format: uuid }
        coinId: { type: string, format: uuid }
        side: { type: string, enum: [long, short] }
        leverage: { type: integer }
        marginCents: { type: integer }
        entryMicros: { type: integer }
        liqMicros: { type: integer }
        status: { type: string, enum: [open, closed, liquidated] }
        realizedCents: { type: integer }
        closedAt: { type: string, format: date-time, nullable: true }
    PredictionMarket:
      type: object
      required: [id, question, outcomes, closesAt, status]
      properties:
        id: { type: string, format: uuid }
        question: { type: string }
        outcomes: { type: array, items: { type: object, properties: { id: { type: string }, label: { type: string } } } }
        closesAt: { type: string, format: date-time }
        status: { type: string, enum: [open, closed] }
    Bet:
      type: object
      required: [betId, predictionId, outcomeId, stakeCents]
      properties:
        betId: { type: string }
        predictionId: { type: string, format: uuid }
        outcomeId: { type: string }
        stakeCents: { type: integer }
    AlphaCall:
      type: object
      required: [callId, userId, coinId, entryMicros, targetMicros, stopMicros, at]
      properties:
        callId: { type: string }
        userId: { type: string, format: uuid }
        coinId: { type: string, format: uuid }
        entryMicros: { type: integer }
        targetMicros: { type: integer }
        stopMicros: { type: integer }
        at: { type: string, format: date-time }
    TrustScore:
      type: object
      required: [hitRate, avgReturnBps, maxDrawdownBps, heldBagPct]
      properties:
        hitRate: { type: number }
        avgReturnBps: { type: integer }
        maxDrawdownBps: { type: integer }
        heldBagPct: { type: integer }
    SmartMoneyTrade:
      type: object
      required: [userId, alias, coinId, side, cashCents, at]
      properties:
        userId: { type: string, format: uuid }
        alias: { type: string }
        coinId: { type: string, format: uuid }
        side: { type: string, enum: [buy, sell] }
        cashCents: { type: integer }
        at: { type: string, format: date-time }
    BoardEntry:
      type: object
      required: [rank, userId, alias, value]
      properties:
        rank: { type: integer, minimum: 1 }
        userId: { type: string, format: uuid }
        alias: { type: string }
        value: { type: integer }
    Tombstone:
      type: object
      required: [userId, alias, lossCents, coinId, at]
      properties:
        userId: { type: string, format: uuid }
        alias: { type: string }
        lossCents: { type: integer }
        coinId: { type: string, format: uuid }
        at: { type: string, format: date-time }
    FeedPost:
      type: object
      required: [postId, userId, alias, text, at]
      properties:
        postId: { type: string }
        userId: { type: string, format: uuid }
        alias: { type: string }
        text: { type: string, maxLength: 280 }
        at: { type: string, format: date-time }
    DmThread:
      type: object
      required: [userId, alias, lastMessage, lastAt]
      properties:
        userId: { type: string, format: uuid }
        alias: { type: string }
        lastMessage: { type: string }
        lastAt: { type: string, format: date-time }
    DmMessage:
      type: object
      required: [messageId, fromUserId, toUserId, text, at]
      properties:
        messageId: { type: string }
        fromUserId: { type: string, format: uuid }
        toUserId: { type: string, format: uuid }
        text: { type: string, maxLength: 500 }
        at: { type: string, format: date-time }
    Space:
      type: object
      required: [spaceId, title, hostId, speakerIds, handIds, listenerCount]
      properties:
        spaceId: { type: string, format: uuid }
        title: { type: string }
        hostId: { type: string, format: uuid }
        speakerIds: { type: array, items: { type: string, format: uuid } } }
        handIds: { type: array, items: { type: string, format: uuid } } }
        listenerCount: { type: integer }
    CreatorProfile:
      type: object
      required: [enabled, ratePerMinUsdc, maxMinutes]
      properties:
        enabled: { type: boolean }
        ratePerMinUsdc: { type: string }
        maxMinutes: { type: integer }
    PaidCall:
      type: object
      required: [callId, status]
      properties:
        callId: { type: string, format: uuid }
        status: { type: string, enum: [awaiting_payment, ringing, live, settled, refunded] }
        minutesUsed: { type: integer }
        creatorAmount: { type: string, nullable: true }
        refundAmount: { type: string, nullable: true }
    PaymentIntent:
      type: object
      required: [intentId, currency, recipient, amount, reference, memo, tx, expiresAt]
      properties:
        intentId: { type: string, format: uuid }
        currency: { type: string, enum: [USDC, SOL, SKR, ORE] }
        recipient: { type: string }
        mint: { type: string, nullable: true }
        amount: { type: string }
        cashCents: { type: integer, description: "For top-ups; null for cosmetic/ad/season_pass." }
        bonusBps: { type: integer }
        reference: { type: string }
        memo: { type: string }
        tx: { type: string }
        solanaPayUrl: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time }
    ShopItem:
      type: object
      required: [id, slot, name, priceCents]
      properties:
        id: { type: string }
        slot: { type: string, enum: [skin, head, hair, top, bottom, shoes, acc] }
        name: { type: string }
        priceCents: { type: integer }
    Inventory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InventoryItem" }
    InventoryItem:
      type: object
      required: [itemId, slot, acquiredAt]
      properties:
        itemId: { type: string }
        slot: { type: string, enum: [skin, head, hair, top, bottom, shoes, acc] }
        acquiredAt: { type: string, format: date-time }
    AdSlot:
      type: object
      required: [slotId, kind, terms]
      properties:
        slotId: { type: string }
        kind: { type: string }
        terms:
          type: array
          items:
            type: object
            required: [termId, priceUsdc]
            properties:
              termId: { type: string }
              priceUsdc: { type: number }
        nextFreeAt: { type: string, format: date-time, nullable: true }
    OreBoard:
      type: object
      required: [roundId, endsAt, endsAtSlot, squares, motherlodeOre, cityStakedOre, priceUsd]
      properties:
        roundId: { type: integer }
        endsAt: { type: string, format: date-time }
        endsAtSlot: { type: integer }
        squares:
          type: array
          minItems: 25
          maxItems: 25
          items:
            type: object
            required: [deployedLamports]
            properties:
              deployedLamports: { type: string }
        motherlodeOre: { type: string }
        cityStakedOre: { type: string }
        priceUsd: { type: string }
    OreMe:
      type: object
      required: [balance, staked, stOre, minerTier]
      properties:
        balance: { type: string }
        staked: { type: string }
        stOre: { type: string }
        minerTier: { type: string, enum: [none, prospector, miner, refiner] }
    ServerEvent:
      type: object
      required: [eventId, at]
      properties:
        eventId: { type: string, enum: [evt_liquidation, evt_rug, evt_coin_launch, evt_mood_change, evt_exploit, evt_ore_motherlode] }
        params: { type: object, additionalProperties: true }
        at: { type: string, format: date-time }
    WeeklyMeta:
      type: object
      required: [weekday, bonus]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6 }
        bonus: { type: string }
    ModerationItem:
      type: object
      required: [id, targetType, targetId, reasonId, createdAt]
      properties:
        id: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        reasonId: { type: string }
        createdAt: { type: string, format: date-time }
