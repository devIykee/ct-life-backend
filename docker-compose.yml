# CT Life — local stack
# Brings up Postgres, Redis, LiveKit dev, MinIO, plus the api/realtime/workers
# services. The `mock` profile adds the bot population (20 bots in Timeline
# Square) and turns on ENABLE_DEV_AUTH.
#
# Ports (host):
#   api           4010
#   realtime      2567  (Colyseus), 2567 (colyseus monitor if MONITOR=1)
#   postgres      5432
#   redis         6379
#   livekit       7880 (HTTP/WS), 7881 (TCP), 7882 (TURN UDP)
#   minio         9000 (S3 API), 9001 (console)
#
# Note: the host already has nairastock-postgres on 5433 and nairastock-redis
# on 6380. Those are unrelated; the CT Life stack uses 5432 and 6379.
# If 5432/6379 are already in use, change the host ports below.

name: ctlife

services:
  postgres:
    image: postgres:16-alpine
    container_name: ctlife-postgres
    environment:
      POSTGRES_USER: ctlife
      POSTGRES_PASSWORD: ctlife
      POSTGRES_DB: ctlife
    ports:
      - "5434:5432"
    volumes:
      - ctlife-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctlife -d ctlife"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ctlife-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - ctlife-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  livekit:
    image: livekit/livekit:v1.13.7
    container_name: ctlife-livekit
    command: ["--dev"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      LIVEKIT_KEYS: "devkey: devsecret_please_change"
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2026-01-01T00-00-00Z
    container_name: ctlife-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ctlife-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2026-01-01T00-00-00Z
    container_name: ctlife-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/ctlife-uploads &&
      mc anonymous set download local/ctlife-uploads || true
      "
    restart: "no"

  # The api/realtime/workers services use the per-process Dockerfiles
  # (Dockerfile.api, Dockerfile.realtime, Dockerfile.workers). On
  # Docker Hub, node:22-alpine pulls fine; on this dev host the
  # Docker Hub registry is restricted, so we point at a local
  # `node:22-alpine` tarball if one has been preloaded. The local
  # processes under `.runtime/` (livekit + minio) substitute when the
  # hub images cannot be pulled.
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ctlife-api:dev
    container_name: ctlife-api
    profiles: ["all", "mock", "default"]
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      NODE_ENV: ${NODE_ENV:-development}
      PORT_API: 4010
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4010:4010"
    restart: unless-stopped

  realtime:
    build:
      context: .
      dockerfile: Dockerfile.realtime
    image: ctlife-realtime:dev
    container_name: ctlife-realtime
    profiles: ["all", "mock", "default"]
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      NODE_ENV: ${NODE_ENV:-development}
      PORT_REALTIME: 2567
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "2567:2567"
    restart: unless-stopped

  workers:
    build:
      context: .
      dockerfile: Dockerfile.workers
    image: ctlife-workers:dev
    container_name: ctlife-workers
    profiles: ["all", "mock", "default"]
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      NODE_ENV: ${NODE_ENV:-development}
      PORT_WORKERS: 8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  bot-population:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ctlife-api:dev
    container_name: ctlife-bot-population
    profiles: ["mock"]
    env_file: .env
    environment:
      BOT_COUNT: "20"
      BOT_VENUE: "timeline_square"
    depends_on:
      api:
        condition: service_started
      realtime:
        condition: service_started
    command: ["node", "--import", "tsx", "tools/bots/world.ts"]
    restart: unless-stopped

volumes:
  ctlife-postgres-data:
  ctlife-redis-data:
  ctlife-minio-data:

networks:
  default:
    name: ctlife